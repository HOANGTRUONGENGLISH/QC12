<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTE Grammar Quiz - Passive Voice</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes pulseBorder {
      0%, 100% { border-color: rgba(244, 63, 94, 0.8); box-shadow: 0 0 15px rgba(244, 63, 94, 0.5); }
      50% { border-color: rgba(244, 63, 94, 0.2); box-shadow: 0 0 5px rgba(244, 63, 94, 0.0); }
    }
    .animate-pulse-border {
      animation: pulseBorder 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    /* ANIMATIONS FOR FOREST BACKGROUND */
    @keyframes fall {
      0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 0.8; }
      100% { transform: translateY(110vh) translateX(20px) rotate(360deg); opacity: 0; }
    }
    @keyframes floatFirefly {
      0% { transform: translate(0, 0) scale(1); opacity: 0; }
      20% { opacity: 0.8; }
      50% { transform: translate(var(--tx), var(--ty)) scale(1.2); opacity: 1; }
      80% { opacity: 0.8; }
      100% { transform: translate(calc(var(--tx) * -1), calc(var(--ty) * -1)) scale(1); opacity: 0; }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .leaf { animation: fall var(--duration, 10s) linear infinite; animation-delay: var(--delay, 0s); }
    .firefly { 
      animation: floatFirefly var(--duration) ease-in-out infinite alternate, flicker var(--flicker-dur) infinite; 
      animation-delay: var(--delay);
      box-shadow: 0 0 10px 2px #f59e0b, 0 0 20px 5px #fbbf24;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.3); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(16, 185, 129, 0.6); }
    body { margin: 0; padding: 0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ----- BỘ ICON CHO GIAO DIỆN (FOREST THEME) -----
    const LeafIcon = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>;
    const TreeIcon = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.994 4.098a5.502 5.502 0 0 0-8.988 0A6.498 6.498 0 0 0 3 11a6.5 6.5 0 0 0 6 6h1.272l-1.026 5h2.464l-.98-5H15a6.5 6.5 0 0 0 6-6 6.498 6.498 0 0 0-3.006-6.902Z"/></svg>;
    const ArrowRight = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>;
    const ArrowLeft = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>;
    const CheckCircle2 = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;
    const XCircle = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>;
    const Clock = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
    const Calendar = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    const User = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    const Info = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>;
    const HelpCircle = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>;

    // ----- FOREST BACKGROUND -----
    const ForestBackground = () => {
      const leaves = Array.from({ length: 25 }).map((_, i) => ({
        id: i,
        left: `${Math.random() * 100}vw`,
        size: `${Math.random() * 1 + 0.5}rem`,
        duration: `${Math.random() * 10 + 10}s`,
        delay: `${Math.random() * -15}s`,
        opacity: Math.random() * 0.5 + 0.2,
        color: Math.random() > 0.5 ? 'text-emerald-400' : 'text-green-600'
      }));

      const fireflies = Array.from({ length: 30 }).map((_, i) => ({
        id: `ff-${i}`,
        top: `${Math.random() * 100}vh`,
        left: `${Math.random() * 100}vw`,
        size: `${Math.random() * 4 + 2}px`,
        duration: `${Math.random() * 15 + 10}s`,
        delay: `${Math.random() * -20}s`,
        flicker: `${Math.random() * 2 + 1}s`,
        tx: `${(Math.random() - 0.5) * 200}px`,
        ty: `${(Math.random() - 0.5) * 200}px`
      }));

      return (
        <div className="fixed inset-0 overflow-hidden pointer-events-none z-0 bg-gradient-to-b from-[#0f2027] via-[#103020] to-[#0a1510]">
          {/* Lớp cây mờ ảo dưới đáy */}
          <div className="absolute bottom-0 left-0 w-full h-[40vh] opacity-30 text-emerald-900 flex items-end justify-around">
            <TreeIcon size={120} className="transform -translate-x-10" />
            <TreeIcon size={200} className="transform -translate-x-5" />
            <TreeIcon size={150} />
            <TreeIcon size={250} className="transform translate-x-5" />
            <TreeIcon size={180} className="transform translate-x-10" />
          </div>
          <div className="absolute bottom-0 left-0 w-full h-[30vh] opacity-50 text-green-950 flex items-end justify-between px-10">
            <TreeIcon size={300} className="transform -translate-x-10" />
            <TreeIcon size={280} />
            <TreeIcon size={350} className="transform translate-x-10" />
          </div>

          {/* Lá rụng */}
          {leaves.map(leaf => (
            <div 
              key={leaf.id} 
              className={`absolute top-0 leaf ${leaf.color}`}
              style={{
                left: leaf.left,
                '--duration': leaf.duration,
                '--delay': leaf.delay,
                opacity: leaf.opacity
              }}
            >
              <LeafIcon size={leaf.size} />
            </div>
          ))}

          {/* Đom đóm */}
          {fireflies.map(ff => (
             <div 
               key={ff.id} 
               className="absolute rounded-full bg-amber-200 firefly"
               style={{
                 top: ff.top, left: ff.left, width: ff.size, height: ff.size,
                 '--duration': ff.duration, '--delay': ff.delay, '--flicker-dur': ff.flicker,
                 '--tx': ff.tx, '--ty': ff.ty
               }}
             ></div>
           ))}
        </div>
      );
    }

    // ----- DỮ LIỆU CÂU HỎI (100 CÂU PASSIVE VOICE) -----
    const QUESTIONS = [
{ id: 1, text: "The university offered Lan a scholarship for her excellent academic performance.", options: ["Lan offered a scholarship by the university.", "A scholarship was offered Lan by the university.", "Lan was offered a scholarship by the university.", "Lan was offered to a scholarship by the university."], answer: 2, translation: "Trường đại học đã trao cho Lan một suất học bổng vì thành tích học tập xuất sắc.", explanation: "Bị động với động từ 2 tân ngữ (offer sb sth -> sb be offered sth)." },
{ id: 2, text: "The teacher told the students to submit their assignments before Friday.", options: ["The students told to submit their assignments before Friday.", "The students were told to submit their assignments before Friday.", "The students were told submitting their assignments before Friday.", "The students were told submit their assignments before Friday."], answer: 1, translation: "Giáo viên bảo học sinh nộp bài tập trước thứ Sáu.", explanation: "Bị động: S + be + told + to V (Bảo ai làm gì)." },
{ id: 3, text: "People believe that the prisoner escaped from the prison last night.", options: ["The prisoner believes to escape from the prison last night.", "The prisoner is believed to escape from the prison last night.", "The prisoner was believed escaping from the prison last night.", "The prisoner is believed to have escaped from the prison last night."], answer: 3, translation: "Mọi người tin rằng tù nhân đã vượt ngục đêm qua.", explanation: "Bị động kép: Hành động 'escaped' xảy ra trước 'believe' -> is believed to have V3/ed." },
{ id: 4, text: "We had a technician install the new air conditioner yesterday.", options: ["We had installed the new air conditioner yesterday.", "We had the new air conditioner installed yesterday.", "We had the technician installed the new air conditioner yesterday.", "We had the new air conditioner to install yesterday."], answer: 1, translation: "Chúng tôi đã nhờ kỹ thuật viên lắp máy lạnh mới hôm qua.", explanation: "Cấu trúc nhờ vả: have sb do sth -> have sth done (bởi sb)." },
{ id: 5, text: "The manager made the staff work overtime.", options: ["The staff were made work overtime.", "The staff were made to work overtime.", "The staff made to work overtime.", "The staff were made working overtime."], answer: 1, translation: "Quản lý bắt nhân viên làm thêm giờ.", explanation: "Bị động của 'make': be made TO V (bị bắt làm gì)." },
{ id: 6, text: "She wants someone to send the documents today.", options: ["She wants the documents send today.", "She wants the documents being sent today.", "She wants the documents to be sent today.", "She wants the documents to sent today."], answer: 2, translation: "Cô ấy muốn ai đó gửi tài liệu đi hôm nay.", explanation: "Bị động với 'want': want sth TO BE V3/ed." },
{ id: 7, text: "The floor needs cleaning before the guests arrive.", options: ["The floor needs to clean before the guests arrive.", "The floor needs to be cleaned before the guests arrive.", "The floor needs being cleaned before the guests arrive.", "The floor needs be cleaned before the guests arrive."], answer: 1, translation: "Sàn nhà cần được lau dọn trước khi khách đến.", explanation: "need V-ing = need to be V3/ed (Cần được làm gì)." },
{ id: 8, text: "The witnesses saw the suspect enter the building.", options: ["The suspect was seen enter the building.", "The suspect was seen entered the building.", "The suspect was seen to enter the building.", "The suspect was seen to entering the building."], answer: 2, translation: "Các nhân chứng thấy nghi phạm đi vào tòa nhà.", explanation: "Động từ tri giác: see sb do sth -> be seen TO DO sth." },
{ id: 9, text: "People say that the new bridge is unsafe.", options: ["It says that the new bridge is unsafe.", "It is saying that the new bridge is unsafe.", "The new bridge says to be unsafe.", "It is said that the new bridge is unsafe."], answer: 3, translation: "Người ta nói rằng cây cầu mới không an toàn.", explanation: "Bị động kép với chủ ngữ giả: It is said that + Clause." },
{ id: 10, text: "The company gave each employee a bonus.", options: ["Each employee gave a bonus.", "Each employee was given to a bonus.", "Each employee was given a bonus.", "Each employee has given a bonus."], answer: 2, translation: "Công ty đã thưởng cho mỗi nhân viên.", explanation: "Bị động với 2 tân ngữ: give sb sth -> sb be given sth." },
{ id: 11, text: "The doctor advised him to stop smoking immediately.", options: ["He advised to stop smoking immediately.", "He was advised to stop smoking immediately.", "He was advised stop smoking immediately.", "He was advised stopping smoking immediately."], answer: 1, translation: "Bác sĩ khuyên anh ấy nên bỏ thuốc lá ngay lập tức.", explanation: "advise sb to V -> be advised to V." },
{ id: 12, text: "We got the mechanic to check the brakes.", options: ["We got the brakes to check.", "We got checked the brakes.", "We got the brakes checked.", "We got the brakes checking."], answer: 2, translation: "Chúng tôi đã nhờ thợ máy kiểm tra phanh.", explanation: "Cấu trúc nhờ vả: get sb to do sth -> get sth done." },
{ id: 13, text: "People expect that the company will announce its results soon.", options: ["The company expects to announce its results soon.", "The company is expected announcing its results soon.", "The company is expected to have announced its results soon.", "The company is expected to announce its results soon."], answer: 3, translation: "Mọi người kỳ vọng công ty sẽ sớm công bố kết quả.", explanation: "Bị động kép: is expected to V (vì hành động announce ở tương lai/hiện tại)." },
{ id: 14, text: "Their parents let the children stay up late last night.", options: ["The children were allowed to stay up late last night.", "The children were let to stay up late last night.", "The children were allowed staying up late last night.", "The children allowed to stay up late last night."], answer: 0, translation: "Bố mẹ cho phép bọn trẻ thức khuya đêm qua.", explanation: "Bị động của 'let': be allowed to V." },
{ id: 15, text: "It is necessary to complete these forms before Friday.", options: ["These forms must be completed before Friday.", "These forms must complete before Friday.", "These forms must be completing before Friday.", "These forms must have completed before Friday."], answer: 0, translation: "Cần phải hoàn thành các biểu mẫu này trước thứ Sáu.", explanation: "It is necessary = must. Bị động: must be V3/ed." },
{ id: 16, text: "They suggested that the council should widen the road.", options: ["It suggested that the road should widen.", "It was suggested that the road should be widened.", "It was suggested that the road should widen.", "The road was suggested widening."], answer: 1, translation: "Họ đề nghị hội đồng nên mở rộng đường.", explanation: "suggest that + clause -> It was suggested that S + should be V3/ed." },
{ id: 17, text: "It is important for the staff to keep these records securely.", options: ["It is important for these records to be kept securely.", "It is important for these records to keep securely.", "These records are important to keeping securely.", "It is important for these records being kept securely."], answer: 0, translation: "Việc nhân viên giữ hồ sơ an toàn là rất quan trọng.", explanation: "Cấu trúc: for O to V -> for O to be V3/ed." },
{ id: 18, text: "My boss asked me to attend the meeting.", options: ["I was asked to attend the meeting.", "I was asked attend the meeting.", "I asked to attend the meeting.", "I was asked attending the meeting."], answer: 0, translation: "Sếp yêu cầu tôi tham dự cuộc họp.", explanation: "ask sb to V -> be asked to V." },
{ id: 19, text: "People reported that the two climbers had disappeared before the rescue team arrived.", options: ["The two climbers were reported to have disappeared before the rescue team arrived.", "The two climbers were reported to disappear before the rescue team arrived.", "The two climbers reported to have disappeared before the rescue team arrived.", "The two climbers were reporting to disappear before the rescue team arrived."], answer: 0, translation: "Người ta báo cáo rằng 2 người leo núi đã mất tích trước khi đội cứu hộ đến.", explanation: "Bị động kép: Hành động 'had disappeared' xảy ra trước 'reported' -> to have V3/ed." },
{ id: 20, text: "She doesn't want anyone to disturb her during the meeting.", options: ["She doesn't want disturbing during the meeting.", "She doesn't want to be disturbed during the meeting.", "She doesn't want to disturb during the meeting.", "She doesn't want being disturbed during the meeting."], answer: 1, translation: "Cô ấy không muốn ai làm phiền trong cuộc họp.", explanation: "want sb to V -> want to be V3/ed (nếu tân ngữ trùng chủ ngữ)." },
{ id: 21, text: "We heard the baby cry in the next room.", options: ["The baby was heard cry in the next room.", "The baby heard to cry in the next room.", "The baby was heard to cry in the next room.", "The baby was heard crying to the next room."], answer: 2, translation: "Chúng tôi nghe tiếng em bé khóc ở phòng bên cạnh.", explanation: "hear sb do sth -> be heard TO DO sth." },
{ id: 22, text: "They persuaded him to accept the job offer.", options: ["He persuaded to accept the job offer.", "He was persuaded to accept the job offer.", "He was persuaded accepting the job offer.", "He was persuaded accept the job offer."], answer: 1, translation: "Họ thuyết phục anh ấy nhận lời mời làm việc.", explanation: "persuade sb to V -> be persuaded to V." },
{ id: 23, text: "I had my assistant send all the emails yesterday.", options: ["I had all the emails sent by my assistant yesterday.", "I had all the emails to send yesterday.", "I had all the emails sending yesterday.", "I had sent all the emails by my assistant yesterday."], answer: 0, translation: "Tôi nhờ trợ lý gửi toàn bộ email hôm qua.", explanation: "have sb do sth -> have sth done by sb." },
{ id: 24, text: "It was her duty to organize all the files.", options: ["She was supposed to organize all the files.", "She supposed to organize all the files.", "She was supposed organizing all the files.", "She was supposed organize all the files."], answer: 0, translation: "Nhiệm vụ của cô ấy là sắp xếp tất cả các hồ sơ.", explanation: "It's one's duty = be supposed to V (có nhiệm vụ làm gì)." },
{ id: 25, text: "People know that she speaks four foreign languages.", options: ["She is known to speak four foreign languages.", "She is known to have spoken four foreign languages.", "She knows to speak four foreign languages.", "She was known speaking four foreign languages."], answer: 0, translation: "Mọi người biết rằng cô ấy nói được 4 ngoại ngữ.", explanation: "Bị động kép: Hành động 'speaks' cùng thì với 'know' -> to V." },
{ id: 26, text: "The manager reminded the employees to wear their identification badges.", options: ["The employees reminded to wear their identification badges.", "The employees were reminded to wear their identification badges.", "The employees were reminded wear their identification badges.", "The employees were reminding to wear their identification badges."], answer: 1, translation: "Quản lý nhắc nhở nhân viên đeo thẻ tên.", explanation: "remind sb to V -> be reminded to V." },
{ id: 27, text: "People thought that he was living abroad at that time.", options: ["He is thought to have lived abroad at that time.", "He thought to be living abroad at that time.", "He was thought to have been lived abroad at that time.", "He was thought to be living abroad at that time."], answer: 3, translation: "Người ta nghĩ rằng anh ấy đang sống ở nước ngoài vào thời điểm đó.", explanation: "Cùng thì quá khứ, tiếp diễn -> to be V-ing." },
{ id: 28, text: "The windows need washing before the party.", options: ["The windows need to wash before the party.", "The windows need be washed before the party.", "The windows need to be washed before the party.", "The windows need to washing before the party."], answer: 2, translation: "Các cửa sổ cần được lau rửa trước bữa tiệc.", explanation: "need V-ing = need to be V3/ed." },
{ id: 29, text: "The police ordered the residents to leave the area immediately.", options: ["The residents ordered to leave the area immediately.", "The residents were ordered leaving the area immediately.", "The residents were ordered leave the area immediately.", "The residents were ordered to leave the area immediately."], answer: 3, translation: "Cảnh sát ra lệnh cho người dân rời khỏi khu vực ngay lập tức.", explanation: "order sb to V -> be ordered to V." },
{ id: 30, text: "I got the tailor to shorten my trousers.", options: ["I got my trousers to shorten.", "I got my trousers shortened.", "I got shortened my trousers.", "I got my trousers shortening."], answer: 1, translation: "Tôi nhờ thợ may cắt ngắn quần của mình.", explanation: "get sb to do sth -> get sth done." },
{ id: 31, text: "People believe that the ancient temple was built over 1,000 years ago.", options: ["The ancient temple is believed to have been built over 1,000 years ago.", "The ancient temple is believed to be built over 1,000 years ago.", "The ancient temple believes to have been built over 1,000 years ago.", "The ancient temple was believed to build over 1,000 years ago."], answer: 0, translation: "Mọi người tin rằng ngôi đền cổ được xây dựng hơn 1000 năm trước.", explanation: "Xảy ra trước (was built) + Bị động -> to have been V3/ed." },
{ id: 32, text: "The coach made the players run five kilometres.", options: ["The players made to run five kilometres.", "The players were made run five kilometres.", "The players were made running five kilometres.", "The players were made to run five kilometres."], answer: 3, translation: "Huấn luyện viên bắt các cầu thủ chạy 5 km.", explanation: "make sb do sth -> be made to V." },
{ id: 33, text: "They invited us to attend the opening ceremony.", options: ["We invited to attend the opening ceremony.", "We were invited attending the opening ceremony.", "We were invited attend the opening ceremony.", "We were invited to attend the opening ceremony."], answer: 3, translation: "Họ mời chúng tôi tham dự lễ khai mạc.", explanation: "invite sb to V -> be invited to V." },
{ id: 34, text: "People understand that the drug causes several side effects.", options: ["The drug understands to cause several side effects.", "The drug is understood to have caused several side effects.", "The drug was understood causing several side effects.", "The drug is understood to cause several side effects."], answer: 3, translation: "Người ta hiểu rằng loại thuốc này gây ra vài tác dụng phụ.", explanation: "Cùng thì hiện tại -> is understood to cause." },
{ id: 35, text: "She wants the staff to finish the report today.", options: ["She wants the report finish today.", "She wants the report being finished today.", "She wants the report to be finished today.", "She wants the report to finish today."], answer: 2, translation: "Cô ấy muốn nhân viên hoàn thành báo cáo hôm nay.", explanation: "want sb to V sth -> want sth to be V3/ed." },

          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.15); 
          
          gain.gain.setValueAtTime(0, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.03, ctx.currentTime + 0.15);
          gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.17);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
        } else {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(250, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        }
        
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 1.0);
      } catch (e) {
        console.error("Trình duyệt không hỗ trợ Web Audio API", e);
      }
    };

    // ----- LOGIC ỨNG DỤNG -----
    function App() {
      const [gameState, setGameState] = useState('welcome');
      const [userName, setUserName] = useState('');
      const [currentIdx, setCurrentIdx] = useState(0);
      const [answers, setAnswers] = useState({});
      const [timeElapsed, setTimeElapsed] = useState(0);
      const [finishDate, setFinishDate] = useState(null);
      const [showHint, setShowHint] = useState(false);
      
      const inputRef = useRef(null);

      useEffect(() => {
        let timer;
        if (gameState === 'playing') {
          timer = setInterval(() => { setTimeElapsed((prev) => prev + 1); }, 1000);
        }
        return () => clearInterval(timer);
      }, [gameState]);

      useEffect(() => {
        setShowHint(false); // Ẩn hint khi qua câu mới
      }, [currentIdx]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Enter') {
            if (gameState === 'welcome' && userName.trim() !== '') {
              startQuiz();
            } else if (gameState === 'playing') {
              const currentAns = answers[currentIdx];
              if (currentAns?.resolved) {
                handleNext();
              }
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [gameState, userName, currentIdx, answers]);

      const startQuiz = () => {
        setGameState('playing');
        setTimeElapsed(0);
        setCurrentIdx(0);
        setAnswers({});
      };

      const handleNext = () => {
        if (currentIdx < QUESTIONS.length - 1) {
          setCurrentIdx(currentIdx + 1);
        } else {
          finishQuiz();
        }
      };

      const handleBack = () => {
        if (currentIdx > 0) {
          setCurrentIdx(currentIdx - 1);
        }
      };

      const selectOption = (optIdx) => {
        const currentQ = QUESTIONS[currentIdx];
        const currentAns = answers[currentIdx] || { attempts: [], resolved: false, firstTryCorrect: false };
        
        if (currentAns.resolved || currentAns.attempts.includes(optIdx)) return;
        
        const newAttempts = [...currentAns.attempts, optIdx];
        let isResolved = false;
        let isFirstTryCorrect = false;

        if (optIdx === currentQ.answer) {
          playSound('correct'); 
          isResolved = true;
          if (newAttempts.length === 1) {
            isFirstTryCorrect = true;
          }
        } else {
          playSound('incorrect'); 
          if (newAttempts.length >= 2) {
            isResolved = true;
          }
        }

        setAnswers({
          ...answers,
          [currentIdx]: {
            attempts: newAttempts,
            resolved: isResolved,
            firstTryCorrect: isFirstTryCorrect
          }
        });
      };

      const finishQuiz = () => {
        setFinishDate(new Date());
        setGameState('summary');
      };

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      const calculateScore = () => {
        let correct = 0;
        QUESTIONS.forEach((q, idx) => {
          if (answers[idx]?.firstTryCorrect) correct++;
        });
        return correct;
      };

      const optionLabels = ["A", "B", "C", "D"];

      return (
        <div className="min-h-screen font-sans text-slate-100 flex flex-col items-center justify-between p-4 sm:p-8 relative overflow-hidden">
          
          <ForestBackground />

          <div className="w-full max-w-4xl z-10 flex-grow flex flex-col justify-center items-center">
            
            {gameState === 'welcome' && (
              <div className="bg-emerald-950/40 backdrop-blur-xl border border-emerald-500/30 p-10 rounded-3xl shadow-2xl w-full max-w-md text-center transform transition-all">
                <div className="flex justify-center mb-6 text-emerald-400 drop-shadow-[0_0_15px_rgba(16,185,129,0.5)]">
                  <TreeIcon size={64} className="animate-pulse" style={{animationDuration: '3s'}}/>
                </div>
                <h1 className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-100 to-green-400 mb-2 drop-shadow-sm">
                  Welcome to HTE
                </h1>
                <p className="text-emerald-100/80 mb-8 font-medium tracking-wide uppercase text-sm">Practice - Passive Voice</p>
                
                <div className="mb-8">
                  <label className="block text-left text-sm font-semibold text-emerald-200 mb-2">Please enter your name:</label>
                  <input 
                    ref={inputRef}
                    type="text" 
                    autoFocus
                    className="w-full px-5 py-4 rounded-xl bg-emerald-950/60 border border-emerald-500/50 text-white focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/40 transition-all text-lg shadow-inner"
                    value={userName}
                    onChange={(e) => setUserName(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && userName.trim() !== '' && startQuiz()}
                  />
                </div>

                <button 
                  onClick={startQuiz}
                  disabled={userName.trim() === ''}
                  className={`w-full py-4 rounded-xl font-bold text-lg flex justify-center items-center gap-2 transition-all duration-300 shadow-lg ${userName.trim() !== '' ? 'bg-gradient-to-r from-emerald-500 to-green-500 text-emerald-950 hover:shadow-[0_0_20px_rgba(16,185,129,0.4)] hover:scale-[1.02]' : 'bg-gray-700/50 text-gray-400 cursor-not-allowed'}`}
                >
                  Start <ArrowRight size={20} />
                </button>
              </div>
            )}

            {gameState === 'playing' && (
              <div className="w-full">
                
                {/* Nổi bật tiêu đề bài làm */}
                <div className="text-center mb-8 relative z-10">
                  <h2 className="inline-flex items-center justify-center gap-3 text-lg sm:text-2xl md:text-3xl font-black uppercase tracking-widest bg-emerald-950/60 backdrop-blur-xl px-12 py-4 rounded-full border border-emerald-500/30 shadow-[0_10px_40px_rgba(4,120,87,0.2)]">
                    <TreeIcon size={32} className="text-emerald-400 drop-shadow-md" />
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-200 to-green-400 drop-shadow-sm">
                      PASSIVE VOICE
                    </span>
                  </h2>
                </div>

                <div className="flex flex-wrap justify-between items-center bg-emerald-950/40 backdrop-blur-md border border-emerald-500/30 p-4 rounded-2xl mb-6 text-emerald-50 shadow-lg font-medium">
                  <div className="flex items-center gap-2">
                    <User size={18} className="text-emerald-400" /> 
                    <span className="truncate max-w-[150px] sm:max-w-xs">{userName}</span>
                  </div>
                  <div className="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-200 to-green-400">
                    Question {currentIdx + 1} / {QUESTIONS.length}
                  </div>
                  <div className="flex items-center gap-2 font-mono text-emerald-200 bg-black/40 px-4 py-1.5 rounded-lg border border-emerald-800/50 shadow-inner">
                    <Clock size={18} className="animate-pulse text-emerald-400" /> {formatTime(timeElapsed)}
                  </div>
                </div>

                <div className="w-full bg-black/40 h-2.5 rounded-full mb-8 overflow-hidden border border-emerald-900/50 shadow-inner">
                  <div 
                    className="h-full bg-gradient-to-r from-green-400 to-emerald-500 transition-all duration-300 ease-out relative"
                    style={{ width: `${((currentIdx + 1) / QUESTIONS.length) * 100}%` }}
                  >
                     <div className="absolute top-0 bottom-0 right-0 w-6 bg-white/30 animate-pulse rounded-full"></div>
                  </div>
                </div>

                <div className="bg-emerald-950/60 backdrop-blur-xl border border-emerald-500/30 rounded-3xl p-6 sm:p-10 shadow-2xl mb-4 relative">
                  <LeafIcon size={160} className="absolute -right-12 -bottom-10 text-emerald-400/10 pointer-events-none -rotate-12" />

                  <h2 className="text-2xl sm:text-3xl font-semibold text-white mb-8 leading-relaxed relative z-10">
                    <span className="text-emerald-400 mr-2">{currentIdx + 1}.</span> 
                    {QUESTIONS[currentIdx].text}
                  </h2>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 relative z-10">
                    {QUESTIONS[currentIdx].options.map((opt, idx) => {
                      const currentQ = QUESTIONS[currentIdx];
                      const currentAnsInfo = answers[currentIdx] || { attempts: [], resolved: false };
                      const isSelected = currentAnsInfo.attempts.includes(idx);
                      const isCorrectAns = idx === currentQ.answer;

                      let btnClass = "flex items-center p-4 rounded-2xl text-left border-2 transition-all duration-200 group font-medium ";
                      let iconClass = "w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-xl mr-4 text-lg transition-colors shadow-inner font-bold ";
                      let textClass = "text-lg transition-colors ";

                      if (currentAnsInfo.resolved && isCorrectAns) {
                        btnClass += "bg-emerald-800/60 border-emerald-400 shadow-[0_0_15px_rgba(16,185,129,0.4)]";
                        iconClass += "bg-emerald-400 text-emerald-950";
                        textClass += "text-white";
                      } else if (isSelected && !isCorrectAns) {
                        btnClass += "bg-rose-900/40 border-rose-500 shadow-[0_0_10px_rgba(244,63,94,0.4)] animate-pulse-border cursor-not-allowed";
                        iconClass += "bg-rose-600 text-white";
                        textClass += "text-rose-200 line-through opacity-70";
                      } else {
                        btnClass += "bg-black/30 border-emerald-800/50 hover:bg-emerald-900/40 hover:border-emerald-500/50 cursor-pointer shadow-sm";
                        iconClass += "bg-black/40 text-emerald-200 group-hover:bg-emerald-500/30 border border-emerald-800/50";
                        textClass += "text-emerald-50";
                      }

                      return (
                        <button key={idx} onClick={() => selectOption(idx)} disabled={currentAnsInfo.resolved || isSelected} className={btnClass}>
                          <div className={iconClass}>{optionLabels[idx]}</div>
                          <span className={textClass}>{opt}</span>
                        </button>
                      );
                    })}
                  </div>

                  <div className="mt-5 text-center min-h-[24px] z-10 relative">
                    {(() => {
                      const currentAnsInfo = answers[currentIdx] || { attempts: [], resolved: false, firstTryCorrect: false };
                      if (currentAnsInfo.resolved) {
                        return currentAnsInfo.firstTryCorrect 
                          ? <span className="text-emerald-300 font-medium bg-emerald-900/40 border border-emerald-700/50 px-4 py-1.5 rounded-full inline-block shadow-sm">Excellent! Correct answer.</span>
                          : <span className="text-amber-300 font-medium bg-amber-900/40 border border-amber-700/50 px-4 py-1.5 rounded-full inline-block shadow-sm">The correct answer has been revealed.</span>;
                      } else if (currentAnsInfo.attempts.length > 0) {
                        return <span className="text-rose-300 font-medium bg-rose-900/40 border border-rose-700/50 px-4 py-1.5 rounded-full inline-block shadow-sm">Incorrect. Try again! (Attempts left: {2 - currentAnsInfo.attempts.length})</span>;
                      }
                      return null;
                    })()}
                  </div>

                  {/* Nút HINT tinh tế */}
                  <div className="mt-6 flex flex-col items-center relative z-50">
                    <button 
                      onClick={() => setShowHint(!showHint)} 
                      className={`px-4 py-2 rounded-full text-sm font-semibold shadow-sm border transition-all flex items-center gap-2 ${showHint ? 'bg-emerald-500/20 border-emerald-400/50 text-emerald-200' : 'bg-black/40 border-emerald-800/50 text-emerald-400 hover:bg-emerald-900/50'}`}
                    >
                       <HelpCircle size={16} />
                       {showHint ? 'Hide Hint' : 'Show Hint'}
                    </button>
                    
                    {/* BUBBLE NỔI LÊN */}
                    {showHint && (
                       <div className="absolute top-full mt-3 w-max max-w-[90vw] sm:max-w-md p-4 bg-emerald-950/95 backdrop-blur-xl border border-emerald-500/50 rounded-2xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.7)] text-emerald-50 text-left z-50">
                           <div className="absolute -top-2.5 left-1/2 -translate-x-1/2 w-5 h-5 bg-emerald-950/95 border-t border-l border-emerald-500/50 rotate-45 rounded-tl-sm"></div>
                           
                           <div className="relative z-10">
                             <div className="flex items-center gap-1.5 mb-1">
                               <span className="text-[10px] uppercase font-bold text-emerald-400 tracking-wider">Translation</span>
                             </div>
                             <p className="font-medium text-[14px] leading-relaxed text-emerald-50 mb-3">{QUESTIONS[currentIdx].translation}</p>
                             
                             {answers[currentIdx]?.resolved ? (
                                 <div className="pt-3 border-t border-emerald-800/50">
                                    <div className="flex items-center gap-1.5 mb-1">
                                      <span className="text-[10px] uppercase font-bold text-green-400 tracking-wider">Grammar Rule</span>
                                    </div>
                                    <p className="text-[13px] text-emerald-200 leading-relaxed"><strong className="font-semibold text-emerald-400">Rule:</strong> {QUESTIONS[currentIdx].explanation}</p>
                                 </div>
                             ) : (
                                 <div className="mt-1 pt-2 border-t border-emerald-800/50">
                                   <p className="text-emerald-400/60 italic text-[11px] font-medium text-center">* Please select an answer to reveal the grammar rule.</p>
                                 </div>
                             )}
                           </div>
                       </div>
                    )}
                  </div>
                </div>

                <div className="flex flex-col-reverse sm:flex-row justify-between items-center gap-4 sm:gap-0 mt-4 w-full">
                  <button 
                    onClick={handleBack} disabled={currentIdx === 0}
                    className={`flex items-center justify-center gap-2 w-full sm:w-auto px-6 py-4 sm:py-3 rounded-xl font-semibold transition-all shadow-sm ${currentIdx === 0 ? 'opacity-0 cursor-default hidden sm:flex' : 'bg-emerald-950/60 text-emerald-200 hover:bg-emerald-900 border border-emerald-800/50'}`}
                  >
                    <ArrowLeft size={20} /> Back
                  </button>
                  
                  <div className="flex flex-col items-center sm:items-end w-full sm:w-auto">
                    <button 
                      onClick={handleNext} disabled={!(answers[currentIdx]?.resolved)}
                      className={`flex items-center justify-center gap-2 w-full sm:w-auto px-8 py-4 rounded-xl font-bold text-lg transition-all shadow-lg
                        ${answers[currentIdx]?.resolved 
                          ? 'bg-gradient-to-r from-emerald-500 to-green-600 text-emerald-950 hover:shadow-[0_0_20px_rgba(16,185,129,0.4)] hover:scale-105 cursor-pointer border border-emerald-400/50' 
                          : 'bg-black/30 text-emerald-700 border border-emerald-900/50 cursor-not-allowed'}`}
                    >
                      {currentIdx === QUESTIONS.length - 1 ? 'Finish Quiz' : 'Next'} 
                      {currentIdx === QUESTIONS.length - 1 ? <CheckCircle2 size={20} /> : <ArrowRight size={20} />}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {gameState === 'summary' && (
              <div className="w-full bg-emerald-950/80 backdrop-blur-xl border border-emerald-500/30 p-6 sm:p-10 rounded-3xl shadow-2xl relative">
                <div className="text-center mb-10">
                  <div className="inline-flex justify-center items-center w-20 h-20 bg-gradient-to-tr from-emerald-400 to-green-600 rounded-full mb-4 shadow-[0_0_30px_rgba(16,185,129,0.4)] border-4 border-emerald-950">
                    <TreeIcon size={36} className="text-emerald-950" />
                  </div>
                  <h1 className="text-4xl font-black text-white mb-2 tracking-tight">Quiz Summary</h1>
                  <p className="text-xl text-emerald-300 font-medium">Great expedition, {userName}!</p>
                </div>

                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
                  <div className="bg-black/30 p-4 rounded-2xl border border-emerald-800/50 flex flex-col items-center justify-center text-center shadow-sm">
                    <Calendar className="text-emerald-400 mb-2" size={24}/>
                    <div className="text-xs text-emerald-200/70 mb-1 font-semibold uppercase tracking-wider">Date</div>
                    <div className="text-sm font-bold text-white">{finishDate?.toLocaleDateString('vi-VN')} {finishDate?.toLocaleTimeString('vi-VN', {hour: '2-digit', minute: '2-digit'})}</div>
                  </div>
                  <div className="bg-black/30 p-4 rounded-2xl border border-emerald-800/50 flex flex-col items-center justify-center text-center shadow-sm">
                    <Clock className="text-emerald-400 mb-2" size={24}/>
                    <div className="text-xs text-emerald-200/70 mb-1 font-semibold uppercase tracking-wider">Time Taken</div>
                    <div className="text-lg font-black text-white">{formatTime(timeElapsed)}</div>
                  </div>
                  <div className="bg-black/30 p-4 rounded-2xl border border-emerald-800/50 flex flex-col items-center justify-center text-center shadow-sm">
                    <CheckCircle2 className="text-green-400 mb-2" size={24}/>
                    <div className="text-xs text-emerald-200/70 mb-1 font-semibold uppercase tracking-wider">1st Try Correct</div>
                    <div className="text-2xl font-black text-green-400">{calculateScore()}</div>
                  </div>
                  <div className="bg-black/30 p-4 rounded-2xl border border-emerald-800/50 flex flex-col items-center justify-center text-center shadow-sm">
                    <XCircle className="text-rose-400 mb-2" size={24}/>
                    <div className="text-xs text-emerald-200/70 mb-1 font-semibold uppercase tracking-wider">Mistakes</div>
                    <div className="text-2xl font-black text-rose-400">{QUESTIONS.length - calculateScore()}</div>
                  </div>
                </div>

                <div className="mb-10 text-center">
                  <div className="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 to-green-300 mb-4 drop-shadow-sm">
                    {Math.round((calculateScore() / QUESTIONS.length) * 100)}%
                  </div>
                  <div className="w-full max-w-md mx-auto bg-black/40 h-4 rounded-full overflow-hidden shadow-inner border border-emerald-900/50">
                    <div 
                      className="h-full bg-gradient-to-r from-rose-500 via-amber-400 to-green-500 transition-all duration-1000"
                      style={{ width: `${(calculateScore() / QUESTIONS.length) * 100}%` }}
                    ></div>
                  </div>
                </div>

                <div className="mt-8 border-t border-emerald-800/50 pt-8">
                  <h3 className="text-2xl font-bold text-white mb-6 flex items-center gap-2"><Info size={24} className="text-emerald-400"/> Detailed Review</h3>
                  <div className="space-y-4 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                    {QUESTIONS.map((q, idx) => {
                      const ansInfo = answers[idx] || { attempts: [], firstTryCorrect: false };
                      const isCorrect = ansInfo.firstTryCorrect;
                      const firstGuessIdx = ansInfo.attempts[0];
                      const isUnanswered = ansInfo.attempts.length === 0;

                      return (
                        <div key={idx} className={`p-5 rounded-2xl border shadow-sm ${isCorrect ? 'bg-emerald-900/30 border-emerald-500/40' : 'bg-rose-900/20 border-rose-500/30'} flex flex-col gap-4`}>
                          <div className="flex flex-col sm:flex-row sm:items-start gap-4">
                            <div className="flex-shrink-0 mt-1">
                              {isCorrect ? <div className="bg-emerald-500/20 p-2 rounded-xl text-emerald-400"><CheckCircle2 size={24} /></div> 
                                         : <div className="bg-rose-500/20 p-2 rounded-xl text-rose-400"><XCircle size={24} /></div>}
                            </div>
                            <div className="flex-grow">
                              <p className="text-white font-bold text-[17px] mb-1 leading-snug"><span className="text-emerald-400/70 mr-1">{q.id}.</span> {q.text}</p>
                              <p className="text-emerald-200/60 text-[14px] mb-4 italic font-medium">"{q.translation}"</p>
                              
                              <div className="grid sm:grid-cols-2 gap-3 text-sm">
                                <div className="bg-black/30 p-3 rounded-xl border border-emerald-800/30 shadow-inner">
                                  <span className="text-emerald-300/60 text-xs font-bold uppercase block mb-1">Your First Try:</span> 
                                  <span className={`font-bold text-[15px] ${isCorrect ? 'text-emerald-400' : 'text-rose-400'}`}>
                                    {isUnanswered ? "None" : `${optionLabels[firstGuessIdx]}. ${q.options[firstGuessIdx]}`}
                                 </span>
                                </div>
                                {!isCorrect && (
                                  <div className="bg-emerald-900/40 p-3 rounded-xl border border-emerald-500/30 shadow-inner">
                                    <span className="text-emerald-400/80 text-xs font-bold uppercase block mb-1">Correct Answer:</span> 
                                    <span className="font-bold text-[15px] text-emerald-300">
                                      {optionLabels[q.answer]}. {q.options[q.answer]}
                                    </span>
                                  </div>
                                )}
                              </div>
                            </div>
                          </div>
                          
                          {q.explanation && (
                            <div className={`mt-1 p-4 rounded-xl border flex items-start gap-3 text-[14px] font-medium shadow-sm ${isCorrect ? 'bg-emerald-950/50 border-emerald-500/20 text-emerald-200' : 'bg-rose-950/50 border-rose-500/20 text-rose-200'}`}>
                              <Info size={20} className="flex-shrink-0 mt-0.5 opacity-60" />
                              <p className="leading-relaxed"><strong className="font-bold opacity-80 uppercase text-xs mr-2">Rule:</strong> {q.explanation}</p>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
                
                <div className="mt-10 flex justify-center">
                   <button 
                      onClick={() => window.location.reload()}
                      className="px-8 py-4 rounded-xl font-bold bg-black/40 hover:bg-emerald-900 text-white shadow-lg transition-all flex items-center gap-3 group border border-emerald-600/50"
                    >
                      <Clock size={20} className="group-hover:-rotate-90 transition-transform duration-500" /> Retake Quiz
                    </button>
                </div>
              </div>
            )}
          </div>

          <footer className="w-full text-center py-6 mt-auto z-20 relative">
            <p className="text-emerald-50 text-sm font-semibold tracking-wide bg-[#0a1510]/80 backdrop-blur-md inline-block px-6 py-2.5 rounded-full border border-emerald-800/50 shadow-[0_0_15px_rgba(0,0,0,0.5)]">
              © Copyright by <span className="text-emerald-400 font-bold">Hoang Truong English</span>
            </p>
          </footer>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
