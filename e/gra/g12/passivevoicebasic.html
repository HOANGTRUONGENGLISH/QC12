<!DOCTYPE html>
<html lang="vi">
<head>

  <!-- React & ReactDOM -->

  <!-- Babel để dịch mã JSX ngay trên trình duyệt -->

  <style>
    @keyframes pulseBorder {
      0%, 100% { border-color: rgba(249, 115, 22, 0.8); box-shadow: 0 0 15px rgba(249, 115, 22, 0.4); }
      50% { border-color: rgba(249, 115, 22, 0.2); box-shadow: 0 0 5px rgba(249, 115, 22, 0.0); }
    }
    .animate-pulse-border {
      animation: pulseBorder 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    /* ANIMATIONS FOR LEMON THEME */
    @keyframes floatLemon {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }
    
    @keyframes leafFall {
      0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.4; }
      100% { transform: translateY(110vh) translateX(30px) rotate(360deg); opacity: 0; }
    }

    .float-lemon { animation: floatLemon var(--duration, 6s) ease-in-out infinite; animation-delay: var(--delay, 0s); }
    .leaf-fall { animation: leafFall var(--duration, 12s) linear infinite; animation-delay: var(--delay, 0s); }

    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(253, 224, 71, 0.2); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(250, 204, 21, 0.5); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(234, 179, 8, 0.7); }
    body { margin: 0; padding: 0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ----- BỘ ICON CHO GIAO DIỆN (LEMON THEME) -----

    const QUESTIONS = [
      { id: 1, text: "Thousands of smartphones ______ in this factory every month.", options: ["produce", "are produced", "are producing", "have produced"], answer: 1, explanation: "Hiện tại đơn bị động: am/is/are + V3/ed (dấu hiệu: every month).", translation: "Hàng ngàn điện thoại thông minh được sản xuất trong nhà máy này mỗi tháng." },
      { id: 2, text: "English ______ as an international language in many countries.", options: ["speaks", "is speaking", "is spoken", "has spoken"], answer: 2, explanation: "Hiện tại đơn bị động (Sự thật hiển nhiên, English là số ít -> is spoken).", translation: "Tiếng Anh được nói như một ngôn ngữ quốc tế ở nhiều quốc gia." },

      { id: 5, text: "The new bridge ______ at the moment, so drivers have to use another route.", options: ["builds", "is being built", "has been built", "was built"], answer: 1, explanation: "Hiện tại tiếp diễn bị động: am/is/are + being + V3/ed (dấu hiệu: at the moment).", translation: "Cây cầu mới đang được xây dựng vào lúc này, nên tài xế phải dùng đường khác." },

      { id: 7, text: "The injured passengers ______ to the nearest hospital at the moment.", options: ["take", "have been taken", "were taken", "are being taken"], answer: 3, explanation: "Hiện tại tiếp diễn bị động (dấu hiệu: at the moment).", translation: "Những hành khách bị thương đang được đưa tới bệnh viện gần nhất vào lúc này." },
      { id: 8, text: "A new shopping centre ______ near my house these days.", options: ["has built", "builds", "is being built", "was being built"], answer: 2, explanation: "Hiện tại tiếp diễn bị động (dấu hiệu: these days chỉ sự việc đang diễn ra dạo này).", translation: "Một trung tâm mua sắm mới đang được xây dựng gần nhà tôi dạo gần đây." },
      { id: 9, text: "The final results ______ on the school website already.", options: ["have been announced", "announced", "are announcing", "have announced"], answer: 0, explanation: "Hiện tại hoàn thành bị động: have/has + been + V3/ed (dấu hiệu: already).", translation: "Kết quả cuối cùng đã được thông báo trên trang web của trường rồi." },
      { id: 10, text: "Several new measures ______ to reduce air pollution so far.", options: ["introduced", "are introducing", "were introduced", "have been introduced"], answer: 3, explanation: "Hiện tại hoàn thành bị động (dấu hiệu: so far).", translation: "Một số biện pháp mới đã được áp dụng để giảm thiểu ô nhiễm không khí cho đến nay." },

      { id: 17, text: "When I arrived at the office, the documents ______ by the secretary.", options: ["were being copied", "copied", "had copied", "have been copied"], answer: 0, explanation: "Quá khứ tiếp diễn bị động: was/were + being + V3/ed (Hành động đang xảy ra tại một thời điểm trong quá khứ).", translation: "Khi tôi đến văn phòng, các tài liệu đang được thư ký sao chép." },

      { id: 19, text: "While the students were taking the test, they ______ by two teachers.", options: ["monitored", "were being monitored", "have been monitored", "are monitored"], answer: 1, explanation: "Quá khứ tiếp diễn bị động (Hành động đang xảy ra song song trong quá khứ: While...).", translation: "Trong khi các học sinh đang làm bài kiểm tra, chúng đang được giám sát bởi hai giáo viên." },
      { id: 20, text: "When we visited the museum, several paintings ______.", options: ["restored", "have been restored", "were being restored", "are restoring"], answer: 2, explanation: "Quá khứ tiếp diễn bị động (Hành động đang diễn ra khi hành động khác xen vào).", translation: "Khi chúng tôi thăm bảo tàng, một vài bức tranh đang được phục chế." },
      { id: 21, text: "By the time the police arrived, all the valuable items ______.", options: ["had been stolen", "were stealing", "have been stolen", "had stolen"], answer: 0, explanation: "Quá khứ hoàn thành bị động: had + been + V3/ed (dấu hiệu: By the time + quá khứ đơn).", translation: "Vào lúc cảnh sát đến, tất cả các món đồ giá trị đã bị đánh cắp." },
      { id: 22, text: "The room was ready because it ______ before the guests arrived.", options: ["cleaned", "was cleaning", "has been cleaned", "had been cleaned"], answer: 3, explanation: "Quá khứ hoàn thành bị động (Hành động xảy ra và hoàn tất trước một hành động khác trong QK).", translation: "Căn phòng đã sẵn sàng vì nó đã được dọn dẹp trước khi khách đến." },
      { id: 23, text: "Before the new manager started working, several changes ______.", options: ["have made", "had been made", "were making", "made"], answer: 1, explanation: "Quá khứ hoàn thành bị động (dấu hiệu: Before + quá khứ đơn).", translation: "Trước khi quản lý mới bắt đầu làm việc, một vài thay đổi đã được thực hiện." },
      { id: 24, text: "By the time the meeting began, all the reports ______ to the participants.", options: ["distributed", "were distributing", "had been distributed", "have distributed"], answer: 2, explanation: "Quá khứ hoàn thành bị động (dấu hiệu: By the time + quá khứ đơn).", translation: "Vào lúc cuộc họp bắt đầu, tất cả các báo cáo đã được phân phát cho người tham dự." },
      { id: 25, text: "The winners ______ at the end of the competition tomorrow.", options: ["announce", "are announced", "have been announced", "will be announced"], answer: 3, explanation: "Tương lai đơn bị động: will + be + V3/ed (dấu hiệu: tomorrow).", translation: "Những người chiến thắng sẽ được công bố vào cuối cuộc thi ngày mai." },
      { id: 26, text: "More renewable energy ______ in the future.", options: ["will be used", "will use", "is using", "has used"], answer: 0, explanation: "Tương lai đơn bị động (dấu hiệu: in the future).", translation: "Nhiều năng lượng tái tạo hơn sẽ được sử dụng trong tương lai." },
      { id: 27, text: "The old building ______ next month because it is unsafe.", options: ["demolished", "is going to be demolished", "is going to demolish", "has been demolished"], answer: 1, explanation: "Tương lai gần bị động: am/is/are + going to be + V3/ed (Chỉ một kế hoạch, dự định).", translation: "Tòa nhà cũ sẽ bị phá dỡ vào tháng tới vì nó không an toàn." },
      { id: 28, text: "A new library ______ on this land next year.", options: ["is going to build", "was built", "is going to be built", "has built"], answer: 2, explanation: "Tương lai gần bị động (dự định trong tương lai - next year).", translation: "Một thư viện mới sẽ được xây dựng trên mảnh đất này vào năm tới." },
      { id: 29, text: "All passengers ______ before they enter the departure area.", options: ["must check", "must have checked", "are checking", "must be checked"], answer: 3, explanation: "Động từ khuyết thiếu bị động: must + be + V3/ed.", translation: "Tất cả hành khách phải được kiểm tra trước khi họ vào khu vực khởi hành." },
      { id: 30, text: "Personal information ______ without the user's permission.", options: ["should not be shared", "should not share", "should not have sharing", "should not be sharing"], answer: 0, explanation: "Động từ khuyết thiếu bị động: should + not + be + V3/ed.", translation: "Thông tin cá nhân không nên bị chia sẻ mà không có sự cho phép của người dùng." }
    ];

    // ----- ÂM THANH (Web Audio API) -----
    const playSound = (type) => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        if (type === 'correct') {
          // Tiếng chuông đôi trong trẻo (C5 - G5)
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); 
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.15); 
          
          gain.gain.setValueAtTime(0, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.03, ctx.currentTime + 0.15);
          gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.17);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
        } else {
          // Tiếng trầm báo lỗi
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(250, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        }
        
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 1.0);
      } catch (e) {
        console.error("Trình duyệt không hỗ trợ Web Audio API", e);
      }
    };

    // ----- LOGIC ỨNG DỤNG -----
    function App() {
      const [gameState, setGameState] = useState('welcome');
      const [userName, setUserName] = useState('');
      const [currentIdx, setCurrentIdx] = useState(0);
      const [answers, setAnswers] = useState({});
      const [timeElapsed, setTimeElapsed] = useState(0);
      const [finishDate, setFinishDate] = useState(null);
      const [showHint, setShowHint] = useState(false);
      
      const inputRef = useRef(null);

      useEffect(() => {
        let timer;
        if (gameState === 'playing') {
          timer = setInterval(() => {
            setTimeElapsed((prev) => prev + 1);
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [gameState]);

      useEffect(() => {
        setShowHint(false); 
      }, [currentIdx]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Enter') {
            if (gameState === 'welcome' && userName.trim() !== '') {
              startQuiz();
            } else if (gameState === 'playing') {
              const currentAns = answers[currentIdx];
              if (currentAns?.resolved) {
                handleNext();
              }
            }
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [gameState, userName, currentIdx, answers]);

      const startQuiz = () => {
        setGameState('playing');
        setTimeElapsed(0);
        setCurrentIdx(0);
        setAnswers({});
      };

      const handleNext = () => {
        if (currentIdx < QUESTIONS.length - 1) {
          setCurrentIdx(currentIdx + 1);
        } else {
          finishQuiz();
        }
      };

      const handleBack = () => {
        if (currentIdx > 0) {
          setCurrentIdx(currentIdx - 1);
        }
      };

      const selectOption = (optIdx) => {
        const currentQ = QUESTIONS[currentIdx];
        const currentAns = answers[currentIdx] || { attempts: [], resolved: false, firstTryCorrect: false };
        
        if (currentAns.resolved || currentAns.attempts.includes(optIdx)) return;
        
        const newAttempts = [...currentAns.attempts, optIdx];
        let isResolved = false;
        let isFirstTryCorrect = false;

        if (optIdx === currentQ.answer) {
          playSound('correct'); 
          isResolved = true;
          if (newAttempts.length === 1) {
            isFirstTryCorrect = true;
          }
        } else {
          playSound('incorrect'); 
          // Chỉ cho tối đa 2 lần chọn
          if (newAttempts.length >= 2) {
            isResolved = true;
          }
        }

        setAnswers({
          ...answers,
          [currentIdx]: {
            attempts: newAttempts,
            resolved: isResolved,
            firstTryCorrect: isFirstTryCorrect
          }
        });
      };

      const finishQuiz = () => {
        setFinishDate(new Date());
        setGameState('summary');
      };

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      const calculateScore = () => {
        let correct = 0;
        QUESTIONS.forEach((q, idx) => {
          if (answers[idx]?.firstTryCorrect) correct++;
        });
        return correct;
      };

      const optionLabels = ["A", "B", "C", "D"];

      return (
        <div className="min-h-screen font-sans text-slate-800 bg-transparent flex flex-col items-center justify-between p-4 sm:p-8 relative overflow-hidden">
          
          {/* BACKGROUND ANIMATION MÀU CHANH */}
          <LemonBackground />

          <div className="w-full max-w-4xl z-10 flex-grow flex flex-col justify-center items-center">
            
            {/* WELCOME SCREEN */}
            {gameState === 'welcome' && (
              <div className="bg-white/60 backdrop-blur-xl border border-yellow-200 p-10 rounded-3xl shadow-[0_15px_40px_rgba(250,204,21,0.2)] w-full max-w-md text-center transform transition-all">
                <div className="flex justify-center mb-6 text-yellow-500 drop-shadow-md">
                  <LemonIcon size={64} className="float-lemon" style={{animationDuration: '4s'}}/>
                </div>
                <h1 className="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-500 to-lime-600 mb-2 drop-shadow-sm">
                  Welcome to HTE
                </h1>
                <p className="text-yellow-700/80 mb-8 font-semibold tracking-wide">Practice - Passive Voice (Basic)</p>
                
                <div className="mb-8">
                  <label className="block text-left text-sm font-bold text-yellow-700 mb-2">Please enter your name:</label>
                  <input 
                    ref={inputRef}
                    type="text" 
                    autoFocus
                    className="w-full px-5 py-4 rounded-xl bg-white border border-yellow-300 text-slate-800 focus:outline-none focus:border-yellow-500 focus:ring-4 focus:ring-yellow-400/20 transition-all text-lg shadow-inner placeholder-slate-400"
                    placeholder="Your Name..."
                    value={userName}
                    onChange={(e) => setUserName(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && userName.trim() !== '' && startQuiz()}
                  />
                </div>

                <button 
                  onClick={startQuiz}
                  disabled={userName.trim() === ''}
                  className={`w-full py-4 rounded-xl font-bold text-lg flex justify-center items-center gap-2 transition-all duration-300 shadow-lg ${userName.trim() !== '' ? 'bg-gradient-to-r from-yellow-400 to-lime-400 text-slate-800 hover:shadow-[0_0_25px_rgba(250,204,21,0.5)] hover:scale-[1.02]' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
                >
                  Start <ArrowRight size={20} />
                </button>
              </div>
            )}

            {/* QUIZ SCREEN */}
            {gameState === 'playing' && (
              <div className="w-full">
                
                {/* Tiêu đề Nổi bật */}
                <div className="text-center mb-8 relative z-10">
                  <h2 className="inline-flex items-center justify-center gap-3 text-lg sm:text-2xl md:text-3xl font-extrabold uppercase tracking-widest bg-white/70 backdrop-blur-xl px-12 py-4 rounded-full border border-yellow-300 shadow-[0_10px_30px_rgba(250,204,21,0.3)]">
                    <SunIcon size={32} className="text-yellow-500 drop-shadow-md" />
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-yellow-600 to-lime-700 drop-shadow-sm">
                      PASSIVE VOICE
                    </span>
                  </h2>
                </div>

                {/* Thanh trạng thái */}
                <div className="flex flex-wrap justify-between items-center bg-white/70 backdrop-blur-md border border-yellow-200 p-4 rounded-2xl mb-6 text-slate-700 shadow-md font-semibold">
                  <div className="flex items-center gap-2">
                    <User size={18} className="text-yellow-600" /> 
                    <span className="truncate max-w-[150px] sm:max-w-xs">{userName}</span>
                  </div>
                  <div className="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-600 to-lime-600">
                    Question {currentIdx + 1} / {QUESTIONS.length}
                  </div>
                  <div className="flex items-center gap-2 font-mono text-yellow-700 bg-white/80 px-4 py-1.5 rounded-lg border border-yellow-200 shadow-inner">
                    <Clock size={18} className="animate-pulse text-yellow-500" /> {formatTime(timeElapsed)}
                  </div>
                </div>

                {/* Thanh tiến độ */}
                <div className="w-full bg-yellow-100 h-2.5 rounded-full mb-8 overflow-hidden border border-yellow-200 shadow-inner">
                  <div 
                    className="h-full bg-gradient-to-r from-yellow-400 to-lime-400 transition-all duration-300 ease-out relative"
                    style={{ width: `${((currentIdx + 1) / QUESTIONS.length) * 100}%` }}
                  >
                     <div className="absolute top-0 bottom-0 right-0 w-6 bg-white/40 animate-pulse rounded-full"></div>
                  </div>
                </div>

                {/* Khung Câu hỏi */}
                <div className="bg-white/80 backdrop-blur-xl border border-yellow-300 rounded-3xl p-6 sm:p-10 shadow-xl mb-4 relative">
                  
                  <h2 className="text-2xl sm:text-3xl font-semibold text-slate-800 mb-8 leading-relaxed relative z-10">
                    <span className="text-yellow-600 mr-2">{currentIdx + 1}.</span> 
                    {QUESTIONS[currentIdx].text}
                  </h2>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 relative z-10">
                    {QUESTIONS[currentIdx].options.map((opt, idx) => {
                      const currentQ = QUESTIONS[currentIdx];
                      const currentAnsInfo = answers[currentIdx] || { attempts: [], resolved: false };
                      const isSelected = currentAnsInfo.attempts.includes(idx);
                      const isCorrectAns = idx === currentQ.answer;

                      let btnClass = "flex items-center p-4 rounded-2xl text-left border-2 transition-all duration-200 group font-medium ";
                      let iconClass = "w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-xl mr-4 text-lg transition-colors shadow-inner font-bold ";
                      let textClass = "text-lg transition-colors ";

                      if (currentAnsInfo.resolved && isCorrectAns) {
                        btnClass += "bg-lime-100/90 border-lime-400 shadow-[0_0_15px_rgba(132,204,22,0.4)]";
                        iconClass += "bg-lime-500 text-white";
                        textClass += "text-lime-800";
                      } else if (isSelected && !isCorrectAns) {
                        btnClass += "bg-orange-50/80 border-orange-400 shadow-[0_0_10px_rgba(249,115,22,0.3)] animate-pulse-border cursor-not-allowed";
                        iconClass += "bg-orange-500 text-white";
                        textClass += "text-orange-600 line-through opacity-70";
                      } else {
                        btnClass += "bg-white/60 border-yellow-200 hover:bg-yellow-50 hover:border-yellow-400 cursor-pointer shadow-sm";
                        iconClass += "bg-yellow-100 text-yellow-700 group-hover:bg-yellow-200 border border-yellow-200";
                        textClass += "text-slate-700";
                      }

                      return (
                        <button key={idx} onClick={() => selectOption(idx)} disabled={currentAnsInfo.resolved || isSelected} className={btnClass}>
                          <div className={iconClass}>{optionLabels[idx]}</div>
                          <span className={textClass}>{opt}</span>
                        </button>
                      );
                    })}
                  </div>

                  {/* Phản hồi nhanh */}
                  <div className="mt-5 text-center min-h-[24px] z-10 relative">
                    {(() => {
                      const currentAnsInfo = answers[currentIdx] || { attempts: [], resolved: false, firstTryCorrect: false };
                      if (currentAnsInfo.resolved) {
                        return currentAnsInfo.firstTryCorrect 
                          ? <span className="text-lime-600 font-bold bg-lime-100 border border-lime-300 px-4 py-1.5 rounded-full inline-block shadow-sm">Excellent! Correct answer.</span>
                          : <span className="text-amber-600 font-bold bg-amber-100 border border-amber-300 px-4 py-1.5 rounded-full inline-block shadow-sm">The correct answer has been revealed.</span>;
                      } else if (currentAnsInfo.attempts.length > 0) {
                        return <span className="text-orange-600 font-bold bg-orange-100 border border-orange-300 px-4 py-1.5 rounded-full inline-block shadow-sm">Incorrect. Try again! (Attempts left: {2 - currentAnsInfo.attempts.length})</span>;
                      }
                      return null;
                    })()}
                  </div>

                  {/* Hint Bubble tinh tế */}
                  <div className="mt-6 flex flex-col items-center relative z-50">
                    <button 
                      onClick={() => setShowHint(!showHint)} 
                      className={`px-4 py-2 rounded-full text-sm font-bold shadow-sm border transition-all flex items-center gap-2 ${showHint ? 'bg-yellow-200 border-yellow-400 text-yellow-800' : 'bg-white/80 border-yellow-300 text-yellow-600 hover:bg-yellow-50'}`}
                    >
                       <Lightbulb size={16} />
                       {showHint ? 'Hide Hint' : 'Show Hint'}
                    </button>
                    
                    {showHint && (
                       <div className="absolute top-full mt-3 w-max max-w-[90vw] sm:max-w-md p-4 bg-white/95 backdrop-blur-xl border border-yellow-300 rounded-2xl shadow-[0_15px_40px_rgba(0,0,0,0.15)] text-slate-700 text-left z-50">
                           <div className="absolute -top-2.5 left-1/2 -translate-x-1/2 w-5 h-5 bg-white/95 border-t border-l border-yellow-300 rotate-45 rounded-tl-sm"></div>
                           
                           <div className="relative z-10">
                             <div className="flex items-center gap-1.5 mb-1">
                               <span className="text-[10px] uppercase font-bold text-yellow-600 tracking-wider">Translation</span>
                             </div>
                             <p className="font-medium text-[14px] leading-relaxed text-slate-800 mb-3">{QUESTIONS[currentIdx].translation}</p>
                             
                             {answers[currentIdx]?.resolved ? (
                                 <div className="pt-3 border-t border-yellow-200">
                                    <div className="flex items-center gap-1.5 mb-1">
                                      <span className="text-[10px] uppercase font-bold text-lime-600 tracking-wider">Grammar Note</span>
                                    </div>
                                    <p className="text-[13px] text-slate-600 leading-relaxed"><strong className="font-semibold text-lime-600">Rule:</strong> {QUESTIONS[currentIdx].explanation}</p>
                                 </div>
                             ) : (
                                 <div className="mt-1 pt-2 border-t border-yellow-100">
                                   <p className="text-yellow-500/80 italic text-[11px] font-medium text-center">* Please select an answer to reveal the grammar rule.</p>
                                 </div>
                             )}
                           </div>
                       </div>
                    )}
                  </div>
                </div>

                {/* Điều hướng Next / Back */}
                <div className="flex flex-col-reverse sm:flex-row justify-between items-center gap-4 sm:gap-0 mt-4 w-full">
                  <button 
                    onClick={handleBack} disabled={currentIdx === 0}
                    className={`flex items-center justify-center gap-2 w-full sm:w-auto px-6 py-4 sm:py-3 rounded-xl font-bold transition-all shadow-sm ${currentIdx === 0 ? 'opacity-0 cursor-default hidden sm:flex' : 'bg-white/70 text-yellow-700 hover:bg-white border border-yellow-300'}`}
                  >
                    <ArrowLeft size={20} /> Back
                  </button>
                  
                  <div className="flex flex-col items-center sm:items-end w-full sm:w-auto">
                    <button 
                      onClick={handleNext} disabled={!(answers[currentIdx]?.resolved)}
                      className={`flex items-center justify-center gap-2 w-full sm:w-auto px-8 py-4 rounded-xl font-extrabold text-lg transition-all shadow-lg
                        ${answers[currentIdx]?.resolved 
                          ? 'bg-gradient-to-r from-yellow-400 to-lime-400 text-slate-800 hover:shadow-[0_0_20px_rgba(250,204,21,0.4)] hover:scale-105 cursor-pointer border border-yellow-300' 
                          : 'bg-white/40 text-yellow-700/50 border border-yellow-300/50 cursor-not-allowed'}`}
                    >
                      {currentIdx === QUESTIONS.length - 1 ? 'Finish Quiz' : 'Next'} 
                      {currentIdx === QUESTIONS.length - 1 ? <CheckCircle2 size={20} /> : <ArrowRight size={20} />}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* SUMMARY SCREEN */}
            {gameState === 'summary' && (
              <div className="w-full bg-white/80 backdrop-blur-xl border border-yellow-300 p-6 sm:p-10 rounded-3xl shadow-2xl relative">
                <div className="text-center mb-10">
                  <div className="inline-flex justify-center items-center w-20 h-20 bg-gradient-to-tr from-yellow-300 to-lime-300 rounded-full mb-4 shadow-[0_0_30px_rgba(250,204,21,0.5)] border-4 border-white">
                    <SunIcon size={36} className="text-yellow-700" />
                  </div>
                  <h1 className="text-4xl font-extrabold text-slate-800 mb-2 tracking-tight">Quiz Summary</h1>
                  <p className="text-xl text-yellow-600 font-bold">Great job, {userName}!</p>
                </div>

                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
                  <div className="bg-white/70 p-4 rounded-2xl border border-yellow-200 flex flex-col items-center justify-center text-center shadow-sm">
                    <Calendar className="text-yellow-500 mb-2" size={24}/>
                    <div className="text-xs text-slate-500 mb-1 font-bold uppercase tracking-wider">Date</div>
                    <div className="text-sm font-bold text-slate-800">{finishDate?.toLocaleDateString('vi-VN')} {finishDate?.toLocaleTimeString('vi-VN', {hour: '2-digit', minute: '2-digit'})}</div>
                  </div>
                  <div className="bg-white/70 p-4 rounded-2xl border border-yellow-200 flex flex-col items-center justify-center text-center shadow-sm">
                    <Clock className="text-lime-500 mb-2" size={24}/>
                    <div className="text-xs text-slate-500 mb-1 font-bold uppercase tracking-wider">Time Taken</div>
                    <div className="text-lg font-black text-slate-800">{formatTime(timeElapsed)}</div>
                  </div>
                  <div className="bg-white/70 p-4 rounded-2xl border border-yellow-200 flex flex-col items-center justify-center text-center shadow-sm">
                    <CheckCircle2 className="text-emerald-500 mb-2" size={24}/>
                    <div className="text-xs text-slate-500 mb-1 font-bold uppercase tracking-wider">1st Try Correct</div>
                    <div className="text-2xl font-black text-emerald-600">{calculateScore()}</div>
                  </div>
                  <div className="bg-white/70 p-4 rounded-2xl border border-yellow-200 flex flex-col items-center justify-center text-center shadow-sm">
                    <XCircle className="text-orange-500 mb-2" size={24}/>
                    <div className="text-xs text-slate-500 mb-1 font-bold uppercase tracking-wider">Mistakes</div>
                    <div className="text-2xl font-black text-orange-600">{QUESTIONS.length - calculateScore()}</div>
                  </div>
                </div>

                <div className="mb-10 text-center">
                  <div className="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-500 to-lime-600 mb-4 drop-shadow-sm">
                    {Math.round((calculateScore() / QUESTIONS.length) * 100)}%
                  </div>
                  <div className="w-full max-w-md mx-auto bg-yellow-100 h-4 rounded-full overflow-hidden shadow-inner border border-yellow-200">
                    <div 
                      className="h-full bg-gradient-to-r from-orange-400 via-yellow-400 to-lime-400 transition-all duration-1000"
                      style={{ width: `${(calculateScore() / QUESTIONS.length) * 100}%` }}
                    ></div>
                  </div>
                </div>

                <div className="mt-8 border-t border-yellow-200 pt-8">
                  <h3 className="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2"><Info size={24} className="text-yellow-600"/> Detailed Review</h3>
                  <div className="space-y-4 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                    {QUESTIONS.map((q, idx) => {
                      const ansInfo = answers[idx] || { attempts: [], firstTryCorrect: false };
                      const isCorrect = ansInfo.firstTryCorrect;
                      const firstGuessIdx = ansInfo.attempts[0];
                      const isUnanswered = ansInfo.attempts.length === 0;

                      return (
                        <div key={idx} className={`p-5 rounded-2xl border shadow-sm ${isCorrect ? 'bg-lime-50/80 border-lime-200' : 'bg-orange-50/80 border-orange-200'} flex flex-col gap-4`}>
                          <div className="flex flex-col sm:flex-row sm:items-start gap-4">
                            <div className="flex-shrink-0 mt-1">
                              {isCorrect ? <div className="bg-lime-200/50 p-2 rounded-xl text-lime-600"><CheckCircle2 size={24} /></div> 
                                         : <div className="bg-orange-200/50 p-2 rounded-xl text-orange-600"><XCircle size={24} /></div>}
                            </div>
                            <div className="flex-grow">
                              <p className="text-slate-800 font-bold text-[17px] mb-1 leading-snug"><span className="text-yellow-600 mr-1">{q.id}.</span> {q.text}</p>
                              <p className="text-slate-500 text-[14px] mb-4 italic font-medium">"{q.translation}"</p>
                              
                              <div className="grid sm:grid-cols-2 gap-3 text-sm">
                                <div className="bg-white/90 p-3 rounded-xl border border-slate-200 shadow-sm">
                                  <span className="text-slate-500 text-xs font-bold uppercase block mb-1">Your First Try:</span> 
                                  <span className={`font-bold text-[15px] ${isCorrect ? 'text-lime-600' : 'text-orange-600'}`}>
                                    {isUnanswered ? "None" : `${optionLabels[firstGuessIdx]}. ${q.options[firstGuessIdx]}`}
                                 </span>
                                </div>
                                {!isCorrect && (
                                  <div className="bg-lime-50 p-3 rounded-xl border border-lime-300 shadow-sm">
                                    <span className="text-lime-700 text-xs font-bold uppercase block mb-1">Correct Answer:</span> 
                                    <span className="font-bold text-[15px] text-lime-700">
                                      {optionLabels[q.answer]}. {q.options[q.answer]}
                                    </span>
                                  </div>
                                )}
                              </div>
                            </div>
                          </div>
                          
                          {q.explanation && (
                            <div className={`mt-1 p-4 rounded-xl border flex items-start gap-3 text-[14px] font-medium shadow-sm ${isCorrect ? 'bg-lime-100/60 border-lime-200 text-lime-800' : 'bg-yellow-100/60 border-yellow-200 text-yellow-800'}`}>
                              <Info size={20} className="flex-shrink-0 mt-0.5 opacity-60" />
                              <p className="leading-relaxed"><strong className="font-bold opacity-80 uppercase text-xs mr-2">Rule:</strong> {q.explanation}</p>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
                
                <div className="mt-10 flex justify-center">
                   <button 
                      onClick={() => window.location.reload()}
                      className="px-8 py-4 rounded-xl font-bold bg-white hover:bg-yellow-50 text-yellow-600 shadow-lg transition-all flex items-center gap-3 group border border-yellow-300"
                    >
                      <Clock size={20} className="group-hover:-rotate-90 transition-transform duration-500" /> Retake Quiz
                    </button>
                </div>
              </div>
            )}
          </div>

          <footer className="w-full text-center py-6 mt-auto z-20 relative">
            <p className="text-yellow-900 text-sm font-medium tracking-wide bg-white/60 backdrop-blur-md inline-block px-6 py-2.5 rounded-full border border-yellow-300 shadow-[0_5px_15px_rgba(250,204,21,0.2)]">
              © Copyright by <span className="text-yellow-600 font-extrabold">Hoang Truong English</span>
            </p>
          </footer>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
