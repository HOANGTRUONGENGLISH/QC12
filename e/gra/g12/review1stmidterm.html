<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTE Grammar Quiz - GS12 - Review - 1st Midterm</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes pulseBorder {
      0%, 100% { border-color: rgba(249, 115, 22, 0.8); box-shadow: 0 0 15px rgba(249, 115, 22, 0.4); }
      50% { border-color: rgba(147, 51, 234, 0.4); box-shadow: 0 0 5px rgba(147, 51, 234, 0.2); }
    }
    .animate-pulse-border {
      animation: pulseBorder 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    /* ANIMATIONS FOR HALLOWEEN THEME */
    @keyframes floatGhost {
      0%, 100% { transform: translateY(0) rotate(-5deg); opacity: 0.3; }
      50% { transform: translateY(-25px) rotate(5deg); opacity: 0.6; }
    }
    
    @keyframes flyBat {
      0% { transform: translateY(10vh) translateX(-10vw) scale(0.5) rotate(15deg); opacity: 0; }
      10% { opacity: 0.5; }
      50% { transform: translateY(-30vh) translateX(50vw) scale(1) rotate(-10deg); opacity: 0.8; }
      90% { opacity: 0.3; }
      100% { transform: translateY(-70vh) translateX(110vw) scale(0.6) rotate(20deg); opacity: 0; }
    }

    .float-ghost { animation: floatGhost var(--duration, 6s) ease-in-out infinite; animation-delay: var(--delay, 0s); }
    .fly-bat { animation: flyBat var(--duration, 12s) linear infinite; animation-delay: var(--delay, 0s); }

    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(249, 115, 22, 0.5); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(249, 115, 22, 0.8); }
    body { margin: 0; padding: 0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; background-color: #0f172a; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ----- BỘ ICON CHO GIAO DIỆN (HALLOWEEN THEME) -----
    const GhostIcon = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 10h.01"/><path d="M15 10h.01"/><path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"/></svg>;
    const MoonIcon = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>;
    const ArrowRight = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>;
    const ArrowLeft = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>;
    const CheckCircle2 = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>;
    const XCircle = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>;
    const Clock = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
    const Calendar = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    const User = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    const Lightbulb = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.5 1.5 1.8.8 2.3 1.8 2.5 2.8"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>;
    const Info = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>;
    
    // Custom Bat Icon
    const BatIcon = ({size=24, className=""}) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M12 11.5c-1.5-2-4-2.5-6-1.5-2 1-3 3-2 5 2-1 4-1 6 0-1 1.5-3 2-5 3 2.5.5 5 0 7-1.5 1-1 2-2 4-2s3 1 4 2c2 1.5 4.5 2 7 1.5-2-1-4-2.5-5-3 2-1 4-1 6 0 1-2 0-4-2-5-2-1-4-.5-6 1.5-1 1-2.5 1.5-4 1.5s-3-.5-4-1.5z"/></svg>;

    // ----- HALLOWEEN BACKGROUND -----
    const HalloweenBackground = () => {
      const bats = Array.from({ length: 8 }).map((_, i) => ({
        id: i,
        size: `${Math.random() * 2 + 1}rem`,
        duration: `${Math.random() * 10 + 10}s`,
        delay: `${Math.random() * -20}s`,
      }));

      return (
        <div className="fixed inset-0 overflow-hidden pointer-events-none z-0 bg-gradient-to-b from-slate-900 via-purple-950 to-black">
          
          {/* Mặt trăng khổng lồ */}
          <MoonIcon size={300} className="absolute top-10 right-10 text-orange-400/20 drop-shadow-[0_0_50px_rgba(249,115,22,0.4)]" />

          {/* Bóng ma lơ lửng */}
          <GhostIcon size={120} className="absolute top-[20%] left-[10%] text-purple-400/20 float-ghost" style={{"--duration": "7s", "--delay": "0s"}} />
          <GhostIcon size={80} className="absolute bottom-[20%] right-[15%] text-slate-300/20 float-ghost" style={{"--duration": "9s", "--delay": "2s"}} />
          
          {/* Dơi bay */}
          {bats.map(bat => (
            <div 
              key={bat.id} 
              className="absolute bottom-0 text-black/40 fly-bat drop-shadow-xl"
              style={{
                '--duration': bat.duration,
                '--delay': bat.delay,
              }}
            >
               <BatIcon size={bat.size} />
            </div>
          ))}
        </div>
      );
    }

    // ----- DỮ LIỆU CÂU HỎI (50 CÂU) -----
    const QUESTIONS = [
      { id: 1, text: "Plastic takes hundreds of years to ________, which is certainly not good for the environment.", options: ["vitalize", "disappear", "decompose", "solve"], answer: 2, explanation: "decompose (v): phân huỷ.", translation: "Nhựa mất hàng trăm năm để phân huỷ, điều này chắc chắn không tốt cho môi trường." },
      { id: 2, text: "I use reusable containers to store portions of cooked food and keep ________ in the fridge, which is also better for the environment.", options: ["canned food", "vegetables", "food", "leftovers"], answer: 3, explanation: "leftovers (n): đồ ăn thừa.", translation: "Tôi sử dụng hộp đựng có thể tái sử dụng để lưu trữ khẩu phần thức ăn đã nấu chín và giữ thức ăn thừa trong tủ lạnh..." },
      { id: 3, text: "I bring my ________ water bottle when I go to school.", options: ["old", "second-hand", "reusable", "recycled"], answer: 2, explanation: "reusable (adj): có thể tái sử dụng (hợp ngữ cảnh bảo vệ môi trường).", translation: "Tôi mang theo bình nước có thể tái sử dụng của mình khi đến trường." },
      { id: 4, text: "At the festival, many people like to buy a(n) ________ to remember their visit.", options: ["cuisine", "popularity", "souvenir", "identity"], answer: 2, explanation: "souvenir (n): quà lưu niệm.", translation: "Tại lễ hội, nhiều người thích mua một món quà lưu niệm để nhớ về chuyến tham quan của họ." },
      { id: 5, text: "One of the most exciting events at the festival is the traditional ________ where teams compete to pull the rope.", options: ["hide-and-seek", "bamboo dancing", "tug of war", "spring roll"], answer: 2, explanation: "tug of war (n): trò kéo co (pull the rope).", translation: "Một trong những sự kiện thú vị nhất tại lễ hội là trò kéo co truyền thống, nơi các đội thi đấu kéo dây." },
      { id: 6, text: "The food at the festival is not only diverse but also incredibly ________.", options: ["tasty", "boring", "plain", "unhealthy"], answer: 0, explanation: "tasty (adj): ngon miệng (~ delicious).", translation: "Đồ ăn ở lễ hội không chỉ đa dạng mà còn vô cùng ngon miệng." },
      { id: 7, text: "Globalization has led to the spread of different ________ around the world, allowing people to experience foods from various cultures.", options: ["technologies", "languages", "traditions", "cuisines"], answer: 3, explanation: "cuisines (n): nền ẩm thực.", translation: "Toàn cầu hóa đã dẫn đến sự lây lan của các nền ẩm thực khác nhau trên thế giới..." },
      { id: 8, text: "Globalization allows for a greater ________ of international dishes, such as Italian pizza and Japanese sushi, to be enjoyed in many countries.", options: ["vary", "variety", "various", "variously"], answer: 1, explanation: "variety (n): sự đa dạng (sau mạo từ 'a' và tính từ 'greater').", translation: "Toàn cầu hóa cho phép sự đa dạng lớn hơn của các món ăn quốc tế..." },
      { id: 9, text: "One of the effects of globalization is that people can quickly ________ new music from different cultures.", options: ["customize", "discover", "celebrate", "captivate"], answer: 1, explanation: "discover (v): khám phá.", translation: "Một trong những tác động của toàn cầu hóa là mọi người có thể nhanh chóng khám phá âm nhạc mới từ các nền văn hóa khác nhau." },
      { id: 10, text: "A popular Vietnamese ________ is Bún chả, which includes grilled pork and noodles.", options: ["speciality", "meal", "dessert", "beverage"], answer: 0, explanation: "speciality (n): đặc sản.", translation: "Một đặc sản phổ biến của Việt Nam là Bún chả, bao gồm thịt lợn nướng và bún." },
      { id: 11, text: "A nation’s ________ is often reflected in its language, customs, and traditions.", options: ["identity", "economy", "geography", "policy"], answer: 0, explanation: "identity (n): bản sắc, danh tính.", translation: "Bản sắc của một quốc gia thường được phản ánh qua ngôn ngữ, phong tục và truyền thống của quốc gia đó." },
      { id: 12, text: "Many companies are ________ an effort to go green by reducing their carbon footprint and using sustainable resources.", options: ["making", "going", "having", "doing"], answer: 0, explanation: "make an effort to Vo: nỗ lực làm gì.", translation: "Nhiều công ty đang nỗ lực chuyển hướng xanh bằng cách giảm lượng khí thải carbon..." },
      { id: 13, text: "One of her ________ achievements is the discovery of radium and polonium.", options: ["impress", "impressive", "impression", "impressively"], answer: 1, explanation: "impressive (adj): ấn tượng (bổ nghĩa cho danh từ achievements).", translation: "Một trong những thành tựu ấn tượng của bà là việc phát hiện ra radium và polonium." },
      { id: 14, text: "Her contributions to the resistance were invaluable, but ________, she was killed by the enemy before the war’s end.", options: ["fortunate", "unfortunate", "unfortunately", "fortunately"], answer: 2, explanation: "unfortunately (adv): thật không may (đứng đầu mệnh đề, ngăn cách bằng dấu phẩy).", translation: "Những đóng góp của cô cho cuộc kháng chiến là vô giá, nhưng thật không may, cô đã bị kẻ thù giết trước khi chiến tranh kết thúc." },
      { id: 15, text: "Malala Yousafzai has devoted her efforts ________ for girls’ education, becoming a global symbol of courage and resistance against oppression.", options: ["advocate", "advocating", "to advocate", "to advocating"], answer: 3, explanation: "devote efforts to Ving: cống hiến nỗ lực cho việc gì.", translation: "Malala Yousafzai đã cống hiến nỗ lực của mình cho việc vận động cho nền giáo dục của trẻ em gái..." },
      { id: 16, text: "Thomas Edison’s ________ achievement in developing a practical electric light bulb revolutionized the way people illuminated the night.", options: ["impress", "impressive", "impression", "impressively"], answer: 1, explanation: "impressive (adj): ấn tượng.", translation: "Thành tựu ấn tượng của Thomas Edison trong việc phát triển bóng đèn điện thực tế..." },
      { id: 17, text: "A multicultural world celebrates a wide range ________ traditions, cuisines, and languages, enriching our global community.", options: ["of", "for", "to", "with"], answer: 0, explanation: "a wide range of + N: một loạt các, đa dạng các...", translation: "Một thế giới đa văn hóa tôn vinh một loạt các truyền thống, ẩm thực và ngôn ngữ..." },
      { id: 18, text: "Leaving the water running while brushing your teeth is a waste ________ water, a precious resource we need to conserve.", options: ["to", "about", "of", "for"], answer: 2, explanation: "a waste of: sự lãng phí cái gì.", translation: "Để nước chảy trong khi đánh răng là một sự lãng phí nước..." },
      { id: 19, text: "Poor Linda! She suffers ________ migraine headaches.", options: ["to", "at", "for", "from"], answer: 3, explanation: "suffer from: chịu đựng (bệnh tật, khó khăn).", translation: "Tội nghiệp Linda! Cô ấy bị chứng đau nửa đầu." },
      { id: 20, text: "Society tries to deal ________ young offenders ________ a variety of ways.", options: ["with - in", "about - to", "to - by", "around - from"], answer: 0, explanation: "deal with (giải quyết), in a variety of ways (bằng nhiều cách).", translation: "Xã hội cố gắng giải quyết những người phạm tội trẻ tuổi bằng nhiều cách khác nhau." },
      { id: 21, text: "You can never rely ________ Anna to provide you ________ information.", options: ["of - with", "for - to", "on - with", "on - by"], answer: 2, explanation: "rely on (dựa dẫm, tin cậy), provide SB with STH (cung cấp cho ai cái gì).", translation: "Bạn không bao giờ có thể tin tưởng Anna để cung cấp thông tin cho bạn." },
      { id: 22, text: "Choose the best arrangement: (a) Can you bring... (b) Hi Linda, (c) How about coming... (d) Thanks for lending... (e) See you soon,", options: ["b – e – c – a – d", "b – d – c – a – e", "b – d – e – c – a", "b – d – e – a – c"], answer: 1, explanation: "Trình tự hợp lý: Chào (b) -> Cảm ơn vì cuốn sách (d) -> Rủ rê cuối tuần (c) -> Nhờ vả mang đồ (a) -> Tạm biệt (e).", translation: "Sắp xếp đúng một bức email: Hi Linda, Cảm ơn vì cuốn sách, Cuối tuần đến nhà tôi nhé, Mang theo chút xoài nhé, Hẹn gặp lại." },
      { id: 23, text: "Choose the best arrangement: (a) Today at school... (b) Hi Doris, (c) Our teacher said... (d) We also talked about... (e) Talk to you soon, (f) Do you have any ideas...", options: ["b – a – c – d – f – e", "b – f – c – d – a – e", "b – a – d – c – f – e", "b – c – f – d – a – e"], answer: 0, explanation: "Trình tự hợp lý: Chào (b) -> Mở bài: Hôm nay ở trường (a) -> Chi tiết lời giáo viên (c) -> Thảo luận thêm về 3R (d) -> Đặt câu hỏi cho bạn (f) -> Tạm biệt (e).", translation: "Sắp xếp đúng một bức email kể về bài học tái chế ở trường." },
      { id: 24, text: "Choose the best arrangement: (a) Oh, what a meaningful... (b) We are planning a green-living... (c) Oh, can you tell me more... (d) We’d be very happy to welcome you... (e) We will launch a campaign...", options: ["b – c – e – a – d", "c – b – a – d – e", "b – e – c – a – d", "c – d – a – b – e"], answer: 0, explanation: "Đoạn hội thoại: A thông báo kế hoạch (b) -> B hỏi thêm (c) -> A giải thích chi tiết (e) -> B khen ngợi và xin tham gia (a) -> A đồng ý chào đón (d).", translation: "Sắp xếp đúng đoạn hội thoại về một chương trình sống xanh." },
      { id: 25, text: "She ________ school and ________ to college at the age of 18.", options: ["finished / applied", "was finished / applied", "finished / was applying", "finishes / applied"], answer: 0, explanation: "Hai hành động nối tiếp nhau trong quá khứ -> Dùng Quá khứ đơn.", translation: "Cô đã học xong trường phổ thông và nộp đơn vào đại học ở tuổi 18." },
      { id: 26, text: "He ________ in Russia when the Revolution ________.", options: ["was living / was starting", "lived / was starting", "was living / started", "has lived / started"], answer: 2, explanation: "Hành động đang diễn ra (QKTD) thì hành động khác xen vào (QKĐ).", translation: "Anh ấy đang sống ở Nga khi Cuộc Cách mạng nổ ra." },
      { id: 27, text: "In 2022, Queen Elizabeth II ________ when she ________ 96 years old.", options: ["was dying / was", "was died / was", "died / was", "died / was being"], answer: 2, explanation: "Sự việc đã xảy ra và kết thúc trong quá khứ (In 2022) -> Quá khứ đơn.", translation: "Năm 2022, Nữ hoàng Elizabeth II qua đời khi bà 96 tuổi." },
      { id: 28, text: "At this time five years ago, she ________ a conference in Singapore.", options: ["attended", "was attending", "were attending", "attending"], answer: 1, explanation: "Dấu hiệu 'At this time + thời gian QK' -> Quá khứ tiếp diễn (was/were + Ving).", translation: "Vào thời điểm này năm năm trước, cô ấy đang tham dự một hội nghị ở Singapore." },
      { id: 29, text: "I saw Mary at the party. She ________ a very beautiful dress.", options: ["wore", "was wearing", "has worn", "had worn"], answer: 1, explanation: "Mô tả hành động/trang phục đang mặc tại một thời điểm cụ thể trong quá khứ -> QKTD.", translation: "Tôi đã gặp Mary tại bữa tiệc. Cô ấy đang mặc một chiếc váy rất đẹp." },
      { id: 30, text: "This morning when the alarm clock ________ off, I ________ a sweet dream.", options: ["went / had", "went / were having", "was going / had", "went / was having"], answer: 3, explanation: "Đang có giấc mơ (QKTD) thì chuông báo thức reo (QKĐ).", translation: "Sáng nay khi chuông báo thức reo, tôi đang có một giấc mơ ngọt ngào." },
      { id: 31, text: "The new food wasn’t very good, so they ________ it very much.", options: ["enjoyed", "wasn’t enjoyed", "enjoy", "didn’t enjoy"], answer: 3, explanation: "Quá khứ đơn phủ định (didn't + Vo).", translation: "Thức ăn mới không ngon lắm, nên họ không thích nó nhiều." },
      { id: 32, text: "The storm ________ at half past ten while the class ________ history.", options: ["began / studied", "was beginning / was studying", "was beginning / studied", "began / was studying"], answer: 3, explanation: "Lớp học đang học (QKTD) thì cơn bão bắt đầu (QKĐ).", translation: "Cơn bão bắt đầu lúc mười rưỡi trong khi lớp đang học lịch sử." },
      { id: 33, text: "Tom ________ down the stairs this morning and ________ his leg.", options: ["fell / was hurting", "was falling / hurt", "fell / hurt", "was falling / was hurting"], answer: 2, explanation: "Hai hành động nối tiếp nhau trong quá khứ -> QKĐ.", translation: "Sáng nay Tom bị ngã cầu thang và bị thương ở chân." },
      { id: 34, text: "The car stopped for the children who ________ the road.", options: ["crossed", "were crossing", "had crossed", "are crossing"], answer: 1, explanation: "Xe dừng lại cho bọn trẻ (những đứa đang đi ngang qua đường lúc đó) -> QKTD.", translation: "Chiếc xe dừng lại nhường đường cho bọn trẻ đang băng qua đường." },

    // ----- ÂM THANH (Web Audio API) -----
    const playSound = (type) => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        if (type === 'correct') {
          // Tiếng chuông (Ting)
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); 
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.15); 
          
          gain.gain.setValueAtTime(0, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.03, ctx.currentTime + 0.15);
          gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.17);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
        } else {
          // Tiếng trầm (Spooky Beep)
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.1, ctx.currentTime + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        }
        
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 1.0);
      } catch (e) {
        console.error("Trình duyệt không hỗ trợ Web Audio API", e);
      }
    };

              <div className="w-full bg-slate-900/90 backdrop-blur-xl border border-orange-500/40 p-6 sm:p-10 rounded-3xl shadow-[0_15px_50px_rgba(0,0,0,0.5)] relative">
                <div className="text-center mb-10">
                  <div className="inline-flex justify-center items-center w-20 h-20 bg-gradient-to-tr from-orange-500 to-purple-600 rounded-full mb-4 shadow-[0_0_30px_rgba(249,115,22,0.5)] border-4 border-slate-900">
                    <GhostIcon size={36} className="text-white" />
                  </div>
                  <h1 className="text-4xl font-extrabold text-white mb-2 tracking-tight">Spooky Summary</h1>
                  <p className="text-xl text-purple-300 font-bold">You survived, {userName}!</p>
                </div>

                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
                  <div className="bg-slate-800/80 p-4 rounded-2xl border border-purple-500/30 flex flex-col items-center justify-center text-center shadow-sm">
                    <Calendar className="text-orange-400 mb-2" size={24}/>
                    <div className="text-xs text-slate-400 mb-1 font-bold uppercase tracking-wider">Date</div>
                    <div className="text-sm font-bold text-slate-200">{finishDate?.toLocaleDateString('vi-VN')} {finishDate?.toLocaleTimeString('vi-VN', {hour: '2-digit', minute: '2-digit'})}</div>
                  </div>
                  <div className="bg-slate-800/80 p-4 rounded-2xl border border-purple-500/30 flex flex-col items-center justify-center text-center shadow-sm">
                    <Clock className="text-purple-400 mb-2" size={24}/>
                    <div className="text-xs text-slate-400 mb-1 font-bold uppercase tracking-wider">Time Taken</div>
                    <div className="text-lg font-black text-slate-200">{formatTime(timeElapsed)}</div>
                  </div>
                  <div className="bg-slate-800/80 p-4 rounded-2xl border border-purple-500/30 flex flex-col items-center justify-center text-center shadow-sm">
                    <CheckCircle2 className="text-emerald-400 mb-2" size={24}/>
                    <div className="text-xs text-slate-400 mb-1 font-bold uppercase tracking-wider">1st Try Correct</div>
                    <div className="text-2xl font-black text-emerald-400">{calculateScore()}</div>
                  </div>
                  <div className="bg-slate-800/80 p-4 rounded-2xl border border-purple-500/30 flex flex-col items-center justify-center text-center shadow-sm">
                    <XCircle className="text-rose-500 mb-2" size={24}/>
                    <div className="text-xs text-slate-400 mb-1 font-bold uppercase tracking-wider">Mistakes</div>
                    <div className="text-2xl font-black text-rose-500">{QUESTIONS.length - calculateScore()}</div>
                  </div>
                </div>

                <div className="mb-10 text-center">
                  <div className="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-purple-400 mb-4 drop-shadow-sm">
                    {Math.round((calculateScore() / QUESTIONS.length) * 100)}%
                  </div>
                  <div className="w-full max-w-md mx-auto bg-slate-800 h-4 rounded-full overflow-hidden shadow-inner border border-purple-900">
                    <div 
                      className="h-full bg-gradient-to-r from-rose-600 via-orange-500 to-emerald-500 transition-all duration-1000"
                      style={{ width: `${(calculateScore() / QUESTIONS.length) * 100}%` }}
                    ></div>
                  </div>
                </div>

                <div className="mt-8 border-t border-purple-800/50 pt-8">
                  <h3 className="text-2xl font-bold text-slate-200 mb-6 flex items-center gap-2"><Info size={24} className="text-orange-500"/> Detailed Review</h3>
                  <div className="space-y-4 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                    {QUESTIONS.map((q, idx) => {
                      const ansInfo = answers[idx] || { attempts: [], firstTryCorrect: false };
                      const isCorrect = ansInfo.firstTryCorrect;
                      const firstGuessIdx = ansInfo.attempts[0];
                      const isUnanswered = ansInfo.attempts.length === 0;

                      return (
                        <div key={idx} className={`p-5 rounded-2xl border shadow-sm ${isCorrect ? 'bg-emerald-900/10 border-emerald-500/30' : 'bg-rose-900/10 border-rose-500/30'} flex flex-col gap-4`}>
                          <div className="flex flex-col sm:flex-row sm:items-start gap-4">
                            <div className="flex-shrink-0 mt-1">
                              {isCorrect ? <div className="bg-emerald-900/50 p-2 rounded-xl text-emerald-400"><CheckCircle2 size={24} /></div> 
                                         : <div className="bg-rose-900/50 p-2 rounded-xl text-rose-400"><XCircle size={24} /></div>}
                            </div>
                            <div className="flex-grow">
                              <p className="text-slate-200 font-bold text-[17px] mb-1 leading-snug"><span className="text-orange-500 mr-1">{q.id}.</span> {q.text}</p>
                              <p className="text-slate-400 text-[14px] mb-4 italic font-medium">"{q.translation}"</p>
                              
                              <div className="grid sm:grid-cols-2 gap-3 text-sm">
                                <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-700 shadow-sm">
                                  <span className="text-slate-500 text-xs font-bold uppercase block mb-1">Your First Try:</span> 
                                  <span className={`font-bold text-[15px] ${isCorrect ? 'text-emerald-400' : 'text-rose-400'}`}>
                                    {isUnanswered ? "None" : `${optionLabels[firstGuessIdx]}. ${q.options[firstGuessIdx]}`}
                                 </span>
                                </div>
                                {!isCorrect && (
                                  <div className="bg-emerald-900/20 p-3 rounded-xl border border-emerald-500/30 shadow-sm">
                                    <span className="text-emerald-500 text-xs font-bold uppercase block mb-1">Correct Answer:</span> 
                                    <span className="font-bold text-[15px] text-emerald-400">
                                      {optionLabels[q.answer]}. {q.options[q.answer]}
                                    </span>
                                  </div>
                                )}
                              </div>
                            </div>
                          </div>
                          
                          {q.explanation && (
                            <div className={`mt-1 p-4 rounded-xl border flex items-start gap-3 text-[14px] font-medium shadow-sm ${isCorrect ? 'bg-emerald-900/30 border-emerald-500/20 text-emerald-200' : 'bg-orange-900/20 border-orange-500/20 text-orange-200'}`}>
                              <Info size={20} className="flex-shrink-0 mt-0.5 opacity-60" />
                              <p className="leading-relaxed"><strong className="font-bold opacity-80 uppercase text-xs mr-2">Note:</strong> {q.explanation}</p>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
                
                <div className="mt-10 flex justify-center">
                   <button 
                      onClick={() => window.location.reload()}
                      className="px-8 py-4 rounded-xl font-bold bg-slate-800 hover:bg-slate-700 text-orange-400 shadow-[0_0_15px_rgba(249,115,22,0.3)] transition-all flex items-center gap-3 group border border-orange-500/50"
                    >
                      <Clock size={20} className="group-hover:-rotate-90 transition-transform duration-500" /> Play Again
                    </button>
                </div>
              </div>
            )}
          </div>

          <footer className="w-full text-center py-6 mt-auto z-20 relative">
            <p className="text-purple-300 text-sm font-medium tracking-wide bg-slate-900/80 backdrop-blur-md inline-block px-6 py-2.5 rounded-full border border-purple-500/30 shadow-lg">
              © Copyright by <span className="text-orange-500 font-extrabold">Hoang Truong English</span>
            </p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
