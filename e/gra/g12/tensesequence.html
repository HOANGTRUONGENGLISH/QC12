<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTE Grammar Quiz - Sequence of Tenses</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel để dịch mã JSX ngay trên trình duyệt -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes pulseBorder {

            0%,
            100% {
                border-color: rgba(251, 191, 36, 0.8);
                box-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
            }

            50% {
                border-color: rgba(251, 191, 36, 0.2);
                box-shadow: 0 0 5px rgba(251, 191, 36, 0.0);
            }
        }

        .animate-pulse-border {
            animation: pulseBorder 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* ANIMATIONS FOR FIREFLIES */
        @keyframes floatFirefly {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            50% {
                transform: translate(var(--tx), var(--ty)) scale(1.2);
                opacity: 1;
            }

            80% {
                opacity: 0.8;
            }

            100% {
                transform: translate(calc(var(--tx) * -1), calc(var(--ty) * -1)) scale(1);
                opacity: 0;
            }
        }

        @keyframes flicker {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .firefly {
            animation: floatFirefly var(--duration) ease-in-out infinite alternate, flicker var(--flicker-dur) infinite;
            animation-delay: var(--delay);
            box-shadow: 0 0 10px 2px #f59e0b, 0 0 20px 5px #fbbf24;
        }

        .brushed-metal {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            position: relative;
        }

        .brushed-metal::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(45deg,
                    rgba(255, 255, 255, 0.02) 0px,
                    rgba(255, 255, 255, 0.02) 2px,
                    transparent 2px,
                    transparent 4px);
            pointer-events: none;
            z-index: 0;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(251, 191, 36, 0.4);
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(251, 191, 36, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        }
    </style>
</head>

<body class="brushed-metal text-slate-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ----- BỘ ICON CHO GIAO DIỆN CHÍNH -----
        const Sparkles = ({ size = 24, className = "" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /><path d="M5 3v4M3 5h4" /></svg>;
        const ArrowRight = ({ size = 24, className = "" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></svg>;
        const ArrowLeft = ({ size = 24, className = "" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></svg>;
        const CheckCircle2 = ({ size = 24, className = "" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></svg>;
        const XCircle = ({ size = 24, className = "" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></svg>;
        const Clock = ({ size = 24, className = "" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>;
        const Calendar = ({ size = 24, className = "" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></svg>;
        const User = ({ size = 24, className = "" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>;
        const Info = ({ size = 24, className = "" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></svg>;
        const Lightbulb = ({ size = 24, className = "" }) => <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5" /><path d="M9 18h6" /><path d="M10 22h4" /></svg>;

        // ----- BACKGROUND ĐOM ĐÓM VÀNG ẤM -----
        const FireflyBackground = () => {
            const fireflies = Array.from({ length: 40 }).map((_, i) => ({
                id: i,
                top: `${Math.random() * 100}vh`,
                left: `${Math.random() * 100}vw`,
                size: `${Math.random() * 4 + 2}px`,
                duration: `${Math.random() * 15 + 10}s`,
                delay: `${Math.random() * -20}s`,
                flicker: `${Math.random() * 2 + 1}s`,
                tx: `${(Math.random() - 0.5) * 200}px`,
                ty: `${(Math.random() - 0.5) * 200}px`
            }));

            return (
                <div className="fixed inset-0 overflow-hidden pointer-events-none z-0">
                    {fireflies.map(ff => (
                        <div
                            key={ff.id}
                            className="absolute rounded-full bg-amber-200 firefly"
                            style={{
                                top: ff.top, left: ff.left, width: ff.size, height: ff.size,
                                '--duration': ff.duration, '--delay': ff.delay, '--flicker-dur': ff.flicker,
                                '--tx': ff.tx, '--ty': ff.ty
                            }}
                        ></div>
                    ))}
                    <div className="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-slate-900 to-transparent opacity-80"></div>
                </div>
            );
        }

        // ----- DỮ LIỆU CÂU HỎI -----
        const QUESTIONS = [
            { id: 1, text: "When I ______, she was cleaning the door.", options: ["had come", "came", "was coming", "have come"], answer: 1, translation: "Khi tôi đến, cô ấy đang lau cửa.", explanation: "Hành động đang xảy ra (was cleaning) thì có hành động khác xen vào (came - Quá khứ đơn)." },
            { id: 2, text: "When I ______, she will be cleaning the door.", options: ["will come", "have come", "come", "came"], answer: 2, translation: "Khi tôi đến, cô ấy sẽ đang lau cửa.", explanation: "Mệnh đề trạng ngữ chỉ thời gian bắt đầu bằng 'When' dùng thì Hiện tại đơn (come) để diễn tả tương lai." },
            { id: 3, text: "When he went home, his mother ______ dinner, so he took off his coat to help her.", options: ["was cooking", "had cooked", "cooks", "has been cooking"], answer: 0, translation: "Khi anh ấy về nhà, mẹ anh ấy đang nấu bữa tối, vì vậy anh ấy cởi áo khoác để giúp bà.", explanation: "Hành động đang xảy ra (was cooking) thì hành động khác xen vào (went home)." },
            { id: 4, text: "When he went home, his mother ______ dinner, so he had a delicious meal.", options: ["was cooking", "has cooked", "cooked", "had cooked"], answer: 3, translation: "Khi anh ấy về nhà, mẹ anh ấy đã nấu bữa tối xong, vì vậy anh ấy có một bữa ăn ngon.", explanation: "Hành động nấu ăn xảy ra và hoàn tất trước hành động về nhà trong quá khứ -> Quá khứ hoàn thành (had cooked)." },
            { id: 5, text: "When he went home, he ______ dinner because his wife was busy.", options: ["had cooked", "cooked", "was cooking", "has cooked"], answer: 1, translation: "Khi anh ấy về nhà, anh ấy nấu bữa tối vì vợ anh ấy bận.", explanation: "Chuỗi hành động xảy ra liên tiếp trong quá khứ: về nhà rồi nấu ăn -> Quá khứ đơn (cooked)." },
            { id: 6, text: "When he goes home, he ______ dinner because he wants to surprise his wife.", options: ["cooks", "has cooked", "will cook", "had cooked"], answer: 2, translation: "Khi anh ấy về nhà, anh ấy sẽ nấu bữa tối vì anh ấy muốn làm vợ ngạc nhiên.", explanation: "When + Hiện tại đơn, Tương lai đơn (sự việc sẽ xảy ra)." },
            { id: 7, text: "By the time he gets home, his mother ______ dinner because she always wants him to have a delicious meal after a hard day's work.", options: ["will have cooked", "cooks", "is cooking", "has cooked"], answer: 0, translation: "Trước khi anh ấy về đến nhà, mẹ anh ấy sẽ đã nấu xong bữa tối...", explanation: "By the time + Hiện tại đơn, Tương lai hoàn thành (hành động sẽ hoàn tất trước một thời điểm ở tương lai)." },
            { id: 8, text: "When I moved here, I ______ in a remote area for five years.", options: ["lived", "have lived", "was living", "had lived"], answer: 3, translation: "Khi tôi chuyển đến đây, tôi đã sống ở một vùng hẻo lánh được năm năm.", explanation: "Hành động sống (sống được 5 năm) xảy ra trước hành động chuyển đi trong quá khứ -> Quá khứ hoàn thành (had lived)." },
            { id: 9, text: "When she receives the letter, she ______ you.", options: ["calls", "will call", "has called", "is calling"], answer: 1, translation: "Khi cô ấy nhận được lá thư, cô ấy sẽ gọi cho bạn.", explanation: "When + Hiện tại đơn, Tương lai đơn." },
            { id: 10, text: "When I was young, I ______ the dream of becoming a famous doctor.", options: ["harboured", "have harboured", "harbour", "am harbouring"], answer: 0, translation: "Khi tôi còn nhỏ, tôi đã ấp ủ ước mơ trở thành một bác sĩ nổi tiếng.", explanation: "Kể về một thói quen/tình trạng trong quá khứ -> Quá khứ đơn." },
            { id: 11, text: "When I grow up, I ______ married to you.", options: ["get", "have got", "will get", "got"], answer: 2, translation: "Khi tôi lớn lên, tôi sẽ kết hôn với bạn.", explanation: "When + Hiện tại đơn, Tương lai đơn." },
            { id: 12, text: "When he grew up, he ______ the army.", options: ["had joined", "joined", "has joined", "joins"], answer: 1, translation: "Khi anh ấy lớn lên, anh ấy đã gia nhập quân đội.", explanation: "Chuỗi hành động trong quá khứ -> Quá khứ đơn." },
            { id: 13, text: "When I see him, I ______ him to call you.", options: ["reminded", "have reminded", "remind", "will remind"], answer: 3, translation: "Khi tôi gặp anh ấy, tôi sẽ nhắc anh ấy gọi cho bạn.", explanation: "When + Hiện tại đơn, Tương lai đơn." },
            { id: 14, text: "When I saw him, I ______ him to call you.", options: ["reminded", "will remind", "had reminded", "have reminded"], answer: 0, translation: "Khi tôi gặp anh ấy, tôi đã nhắc anh ấy gọi cho bạn.", explanation: "Chuỗi hành động trong quá khứ -> Quá khứ đơn." },
            { id: 15, text: "Last night, we ______ television when the power ______.", options: ["watched / was failing", "had watched / failed", "were watching / failed", "were watching / was failing"], answer: 2, translation: "Tối qua, chúng tôi đang xem tivi thì mất điện.", explanation: "Hành động đang xảy ra (were watching) thì hành động khác cắt ngang (failed)." },
            { id: 16, text: "We ______ in this class for four years by next September.", options: ["are", "will have been", "have been", "will be"], answer: 1, translation: "Chúng tôi sẽ học ở lớp này được bốn năm tính đến tháng Chín năm sau.", explanation: "By + mốc thời gian tương lai -> Tương lai hoàn thành (will have PII)." },
            { id: 17, text: "When we came in, they ______ the meal for us.", options: ["were preparing", "prepared", "have prepared", "had been prepared"], answer: 0, translation: "Khi chúng tôi bước vào, họ đang chuẩn bị bữa ăn cho chúng tôi.", explanation: "Hành động đang xảy ra (were preparing) thì hành động khác xen vào (came in)." },
            { id: 18, text: "There ______ many changes in our village in the past few years.", options: ["were", "are being", "had been", "have been"], answer: 3, translation: "Đã có nhiều thay đổi ở ngôi làng của chúng tôi trong vài năm qua.", explanation: "Dấu hiệu 'in the past few years' (trong vài năm qua cho đến nay) -> Hiện tại hoàn thành." },
            { id: 19, text: "Think carefully. I'm sure you ______ his name.", options: ["remember", "will remember", "have remembered", "are remembering"], answer: 1, translation: "Hãy suy nghĩ kỹ. Tôi chắc chắn bạn sẽ nhớ ra tên anh ấy.", explanation: "Dấu hiệu 'I'm sure' dự đoán một điều sẽ xảy ra ở tương lai -> Tương lai đơn (will V)." },
            { id: 20, text: "After ancient Greek athletes had won a race in the Olympics, they ______ a simple crown of olive leaves.", options: ["received", "had received", "were receiving", "have received"], answer: 0, translation: "Sau khi các vận động viên Hy Lạp cổ đại chiến thắng một cuộc đua ở Thế vận hội, họ nhận được một chiếc vương miện đơn giản bằng lá ô liu.", explanation: "After + Quá khứ hoàn thành, Quá khứ đơn (hành động xảy ra sau)." },
            { id: 21, text: "They ______ that bridge when I ______ there last year; they ______ it yet.", options: ["built / had been / didn't finish", "had built / was / haven't finished", "were building / was / haven’t finished", "were building / had been / haven't finished"], answer: 2, translation: "Họ đang xây cây cầu đó khi tôi ở đó năm ngoái; họ vẫn chưa hoàn thành nó.", explanation: "Quá khứ tiếp diễn (đang xây) / Quá khứ đơn (khi tôi ở đó) / Hiện tại hoàn thành (yet - chưa xong tính đến hiện tại)." },
            { id: 22, text: "As soon as my parents came, we ______ out for dinner.", options: ["had gone", "went", "have gone", "were going"], answer: 1, translation: "Ngay khi bố mẹ tôi đến, chúng tôi đi ra ngoài ăn tối.", explanation: "As soon as + QKĐ, QKĐ (hai hành động xảy ra nối tiếp nhau trong quá khứ)." },
            { id: 23, text: "I ______ everywhere for the pen I ______ yesterday, but I still can't find it.", options: ["searched / had lost", "am searching / lost", "had searched / have lost", "have searched / lost"], answer: 3, translation: "Tôi đã tìm kiếm khắp nơi cây bút tôi đánh mất hôm qua, nhưng tôi vẫn chưa thể tìm thấy nó.", explanation: "Tìm kiếm từ quá khứ đến hiện tại (have searched) / Đánh mất vào ngày hôm qua (lost)." },
            { id: 24, text: "“What ______ at the moment, Ann?”“I ______. I ______ a plane to London tomorrow morning.”", options: ["are you doing / am packing / am catching", "do you do / pack / catch", "have you done / have packed / catch", "are you doing / pack / will catch"], answer: 0, translation: "“Bạn đang làm gì lúc này, Ann?” “Tôi đang đóng gói hành lý. Tôi sẽ bắt chuyến bay đi London sáng mai.”", explanation: "Hiện tại tiếp diễn (at the moment) / Hiện tại tiếp diễn chỉ tương lai có kế hoạch (tomorrow morning)." },
            { id: 25, text: "Since I left Venezuela six years ago, I ______ to visit friends and family several times.", options: ["returned", "have returned", "have been returning", "am returning"], answer: 1, translation: "Kể từ khi tôi rời Venezuela sáu năm trước, tôi đã trở lại thăm bạn bè và gia đình vài lần.", explanation: "Since + QKĐ, Hiện tại hoàn thành (hành động lặp đi lặp lại 'several times' cho tới nay)." },
            { id: 26, text: "When my parents ______ for a visit tomorrow, they will see our baby for the first time.", options: ["will arrive", "have arrived", "arrive", "arrived"], answer: 2, translation: "Khi bố mẹ tôi đến thăm vào ngày mai, họ sẽ nhìn thấy đứa con của chúng tôi lần đầu tiên.", explanation: "Mệnh đề trạng ngữ chỉ thời gian (When) không dùng thì Tương lai, phải dùng Hiện tại đơn (arrive)." },
            { id: 27, text: "Don't worry. I ______ the report by 10 o'clock.", options: ["will have finished", "will be finishing", "will finish", "will have been finished"], answer: 0, translation: "Đừng lo. Tôi sẽ hoàn thành bản báo cáo trước 10 giờ.", explanation: "By + mốc thời gian tương lai -> Tương lai hoàn thành." },
            { id: 28, text: "I'll return Bob's pen to him next time I ______ him.", options: ["will see", "have seen", "saw", "see"], answer: 3, translation: "Tôi sẽ trả lại bút cho Bob vào lần tới tôi gặp anh ấy.", explanation: "Mệnh đề chỉ thời gian (next time) dùng thì Hiện tại đơn." },
            { id: 29, text: "“I ______ out to buy a morning newspaper.”“But it ______ now. Why don't you wait until the rain ______?”", options: ["go / rains / will stop", "am going / is raining / stops", "am going / has rained / will stop", "will go / is raining / stops"], answer: 1, translation: "“Tôi định ra ngoài mua báo sáng.” “Nhưng trời đang mưa. Sao bạn không đợi đến khi trời tạnh?”", explanation: "Sắp xảy ra (am going) / Đang xảy ra lúc nói (is raining) / Mệnh đề thời gian (until) dùng Hiện tại đơn." },
            { id: 30, text: "Whenever I travel abroad, I ______ something I need.", options: ["forget", "am forgetting", "have forgotten", "have been forgetting"], answer: 0, translation: "Bất cứ khi nào tôi đi du lịch nước ngoài, tôi đều quên một thứ gì đó mình cần.", explanation: "Thói quen, sự thật hiển nhiên -> Hiện tại đơn." },
            { id: 31, text: "Hurry up or you ______ late for class.", options: ["are being", "have been", "will be", "are"], answer: 2, translation: "Nhanh lên hoặc bạn sẽ bị trễ học.", explanation: "Câu điều kiện ẩn (nếu không nhanh thì sẽ...) -> Tương lai đơn." },
            { id: 32, text: "He ______ to the theatre three times this month.", options: ["goes", "has been", "is going", "has been going"], answer: 1, translation: "Anh ấy đã đến nhà hát ba lần trong tháng này.", diễn_giải: "Hành động lặp lại (three times) trong khoảng thời gian chưa kết thúc (this month) -> Hiện tại hoàn thành." },
            { id: 33, text: "Hurry up or the film ______ over before we ______ home.", options: ["is / will get", "has been / get", "will be / will get", "will have been / get"], answer: 3, translation: "Nhanh lên nếu không bộ phim sẽ kết thúc trước khi chúng ta về đến nhà.", explanation: "Sẽ đã kết thúc trước 1 thời điểm ở tương lai (will have been) / Mệnh đề thời gian (before) dùng Hiện tại đơn." },
            { id: 34, text: "Before I ______ the car, all the passengers had buckled their seat belts.", options: ["started", "had started", "was starting", "have started"], answer: 0, translation: "Trước khi tôi khởi động xe, tất cả hành khách đã thắt dây an toàn.", explanation: "Before + Quá khứ đơn, Quá khứ hoàn thành (had buckled xảy ra trước)." },

            { id: 36, text: "I ______ my homework when my mother ______ me to the chemist's with the prescription the doctor ______ her.", options: ["did / was sending / gave", "was doing / sent / had given", "had done / sent / was giving", "was doing / sent / has given"], answer: 1, translation: "Tôi đang làm bài tập thì mẹ sai tôi đến hiệu thuốc với đơn thuốc mà bác sĩ đã đưa cho bà.", explanation: "Đang làm (was doing) thì hành động khác xen vào (sent). Bác sĩ đưa đơn thuốc xảy ra trước đó nữa -> QK hoàn thành (had given)." },

            { id: 40, text: "He ______ on the report at this time tomorrow.", options: ["will be working", "will have worked", "works", "has worked"], answer: 0, translation: "Anh ấy sẽ đang làm báo cáo vào giờ này ngày mai.", explanation: "Thời điểm xác định trong tương lai (at this time tomorrow) -> Tương lai tiếp diễn." },
            { id: 41, text: "Go on to the next test as soon as you ______ this one.", options: ["will finish", "have finished", "had finished", "are finishing"], answer: 1, translation: "Chuyển sang bài kiểm tra tiếp theo ngay khi bạn hoàn thành bài này.", explanation: "As soon as + Hiện tại đơn/Hiện tại hoàn thành (nhấn mạnh sự hoàn tất) trong câu mệnh lệnh." },

            { id: 49, text: "Yesterday, when I ______ Tom, he ______ in a corner with a book. I ______ him that he ______ in very bad light.", options: ["was seeing / sat / told / read", "saw / had sat / was telling / had read", "had seen / was sitting / told / read", "saw / was sitting / told / was reading"], answer: 3, translation: "Hôm qua, khi tôi nhìn thấy Tom, anh ấy đang ngồi ở một góc với một cuốn sách. Tôi nói với anh ấy rằng anh ấy đang đọc sách trong điều kiện ánh sáng rất tệ.", explanation: "Khi tôi thấy (saw) thì anh ấy đang ngồi (was sitting). Tôi nói (told) anh ấy đang đọc (was reading)." },
            { id: 50, text: "James ______ while Alex ______ the grass in the garden at this time yesterday.", options: ["was weeding / was cutting", "weeded / cut", "had weeded / was cutting", "has been weeding / cuts"], answer: 0, translation: "James đang nhổ cỏ trong khi Alex đang cắt cỏ trong vườn vào giờ này hôm qua.", explanation: "Hai hành động xảy ra song song tại một thời điểm xác định trong quá khứ -> Quá khứ tiếp diễn." },
            { id: 51, text: "Susan ______ for you at 9 o'clock tomorrow.", options: ["waits", "will have waited", "will be waiting", "has been waiting"], answer: 2, translation: "Susan sẽ đang đợi bạn vào lúc 9 giờ ngày mai.", explanation: "Thời điểm xác định ở tương lai (9 o'clock tomorrow) -> Tương lai tiếp diễn." },

            { id: 61, text: "Tell them to stop and take a rest. They ______ long enough.", options: ["have worked", "had worked", "have been working", "had been working"], answer: 2, translation: "Bảo họ dừng lại và nghỉ ngơi đi. Họ đã làm việc đủ lâu rồi.", explanation: "Nhấn mạnh tính liên tục của hành động kéo dài từ quá khứ đến hiện tại (gây mệt mỏi) -> Hiện tại hoàn thành tiếp diễn." },
            { id: 62, text: "“____you ____ here before?” – “Yes, I ______ my holidays here last year.”", options: ["have/ been; spended", "have/ been; spent", "had/ been; spent", "were/ be; spent"], answer: 1, translation: "“Bạn đã từng đến đây chưa?” – “Vâng, tôi đã trải qua kỳ nghỉ ở đây năm ngoái.”", explanation: "Trải nghiệm tính đến hiện tại (have been) / Sự việc đã xảy ra năm ngoái (spent - QKĐ)." },
            { id: 63, text: "We ______ our housework by tomorrow evening.", options: ["will finish", "will have finished", "will be finishing", "are going to finish"], answer: 1, translation: "Chúng tôi sẽ đã hoàn thành công việc nhà trước tối mai.", explanation: "By + mốc thời gian tương lai -> Tương lai hoàn thành." },
            { id: 64, text: "“Your face is dirty, Tom.” – “All right, I ______ it.”", options: ["am washing", "am going to wash", "will wash", "will have washed"], answer: 2, translation: "“Mặt con bẩn kìa, Tom.” – “Được rồi, con sẽ đi rửa.”", explanation: "Quyết định đưa ra ngay tại thời điểm nói -> Tương lai đơn (will)." },
            { id: 65, text: "Coming into the room, he ______ Mary where he ______ her.", options: ["see; left", "saw; had left", "had seen; left", "saw; was leaving"], answer: 1, translation: "Vào phòng, anh thấy Mary ở nơi anh đã bỏ cô lại.", explanation: "Khi bước vào thì anh ấy nhìn thấy (saw - QKĐ). Hành động để cô ấy lại xảy ra trước đó -> QK hoàn thành (had left)." },
            { id: 66, text: "I ______ from him since he ______ two years ago.", options: ["hadn't heard; disappeared", "haven't heard; disappeared", "didn't hear; has disappeared", "will not hear; disappears"], answer: 1, translation: "Tôi đã không nghe tin tức gì từ anh ấy kể từ khi anh ấy biến mất hai năm trước.", explanation: "Hiện tại hoàn thành (haven't heard) + since + Quá khứ đơn (disappeared)." },
            { id: 67, text: "After the guests ______, she ______ back into the living-room and ______ off the light.", options: ["left; went; turned", "had left; had gone; turned", "have left; will got; turned", "had left; went; turned"], answer: 3, translation: "Sau khi khách đã về, cô quay lại phòng khách và tắt đèn.", explanation: "Khách về trước (had left). Quay lại, tắt đèn xảy ra sau và liên tiếp (went, turned)." },
            { id: 68, text: "By the time you finish cooking, they ______ their homework.", options: ["will have finished", "will finish", "had finished", "have finished"], answer: 0, translation: "Trước lúc bạn nấu ăn xong, họ sẽ đã hoàn thành bài tập về nhà.", explanation: "By the time + Hiện tại đơn, Tương lai hoàn thành." },
            { id: 69, text: "“You have just missed the last train.” – “Never mind. I ______.”", options: ["will be walking", "am going to walk", "will walk", "am walking"], answer: 2, translation: "“Bạn vừa lỡ chuyến tàu cuối cùng rồi.” – “Không sao. Tôi sẽ đi bộ.”", explanation: "Quyết định đột xuất ngay tại thời điểm nói -> Tương lai đơn (will)." },
            { id: 70, text: "“I ______ the way to the Globe Theater.” – “OK. I ______ you.”", options: ["don't know; will show", "won't know; will show", "don't know; am showing", "don't know; am going to show"], answer: 0, translation: "“Tôi không biết đường đến Nhà hát Globe.” – “Được rồi. Tôi sẽ chỉ cho bạn.”", explanation: "Trạng thái ở hiện tại (don't know) / Quyết định giúp đỡ ngay lúc nói -> Tương lai đơn (will show)." },
            { id: 71, text: "Come in, please. I ______ for you long.", options: ["have waited", "have been waiting", "had been waiting", "have been waited"], answer: 1, translation: "Xin mời vào. Tôi đã đợi bạn lâu rồi.", explanation: "Hành động bắt đầu ở quá khứ kéo dài liên tục đến hiện tại (đang đợi) -> Hiện tại hoàn thành tiếp diễn." },
            { id: 72, text: "Who ____ you ______ to the cinema with last night?", options: ["did/ went", "did/ go", "had/ gone", "have/ gone"], answer: 1, translation: "Tối qua bạn đi xem phim với ai?", explanation: "Câu hỏi ở quá khứ đơn (last night) -> Did + S + V(nguyên mẫu)." },
            { id: 73, text: "Detective: I'm afraid I must ask both of you. What ______ at 10.20 p.m. yesterday? Mr. X: I ______ chess with my wife. Mr. Y: I ______ to a play on the radio.", options: ["were you doing; am playing; was listening", "did you do; played; listened", "were you doing; am playing; am listening", "were you doing; was playing; was listening"], answer: 3, translation: "Cảnh sát: Tôi e rằng tôi phải hỏi cả hai người. Các anh đang làm gì lúc 10h20 tối hôm qua? Mr.X: Tôi đang chơi cờ với vợ. Mr.Y: Tôi đang nghe đài.", explanation: "Hỏi và trả lời về hành động đang xảy ra tại một thời điểm xác định trong quá khứ -> Quá khứ tiếp diễn." },
            { id: 74, text: "You ______ my sister for a long time. ______ come to see us tonight?", options: ["haven't seen; Will you", "won't see; Will you", "hadn't seen; Would you", "haven't seen; Are you going"], answer: 0, translation: "Bạn đã lâu không gặp em gái tôi. Tối nay bạn sẽ đến thăm chúng tôi chứ?", explanation: "For a long time (từ QK đến giờ) -> Hiện tại hoàn thành (haven't seen). Lời mời/đề nghị ở tương lai -> Will you." }
        ];

        // ----- ÂM THANH (Web Audio API) -----
        const playSound = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;

                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.15);

                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.03, ctx.currentTime + 0.15);
                    gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.17);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
                } else {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(250, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                }

                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 1.0);
            } catch (e) {
                console.error("Web Audio API not supported", e);
            }
        };

        // ----- LOGIC ỨNG DỤNG -----
        function App() {
            const [gameState, setGameState] = useState('welcome');
            const [userName, setUserName] = useState('');
            const [currentIdx, setCurrentIdx] = useState(0);
            const [answers, setAnswers] = useState({});
            const [timeElapsed, setTimeElapsed] = useState(0);
            const [finishDate, setFinishDate] = useState(null);
            const [showHint, setShowHint] = useState(false);

            const inputRef = useRef(null);

            useEffect(() => {
                let timer;
                if (gameState === 'playing') {
                    timer = setInterval(() => { setTimeElapsed((prev) => prev + 1); }, 1000);
                }
                return () => clearInterval(timer);
            }, [gameState]);

            useEffect(() => {
                setShowHint(false);
            }, [currentIdx]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Enter') {
                        if (gameState === 'welcome' && userName.trim() !== '') {
                            startQuiz();
                        } else if (gameState === 'playing') {
                            const currentAns = answers[currentIdx];
                            if (currentAns?.resolved) {
                                handleNext();
                            }
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [gameState, userName, currentIdx, answers]);

            const startQuiz = () => {
                setGameState('playing');
                setTimeElapsed(0);
                setCurrentIdx(0);
                setAnswers({});
            };

            const handleNext = () => {
                if (currentIdx < QUESTIONS.length - 1) {
                    setCurrentIdx(currentIdx + 1);
                } else {
                    finishQuiz();
                }
            };

            const handleBack = () => {
                if (currentIdx > 0) {
                    setCurrentIdx(currentIdx - 1);
                }
            };

            const selectOption = (optIdx) => {
                const currentQ = QUESTIONS[currentIdx];
                const currentAns = answers[currentIdx] || { attempts: [], resolved: false, firstTryCorrect: false };

                if (currentAns.resolved || currentAns.attempts.includes(optIdx)) return;

                const newAttempts = [...currentAns.attempts, optIdx];
                let isResolved = false;
                let isFirstTryCorrect = false;

                if (optIdx === currentQ.answer) {
                    playSound('correct');
                    isResolved = true;
                    if (newAttempts.length === 1) isFirstTryCorrect = true;
                } else {
                    playSound('incorrect');
                    if (newAttempts.length >= 2) isResolved = true;
                }

                setAnswers({
                    ...answers,
                    [currentIdx]: {
                        attempts: newAttempts,
                        resolved: isResolved,
                        firstTryCorrect: isFirstTryCorrect
                    }
                });
            };

            const finishQuiz = () => {
                setFinishDate(new Date());
                setGameState('summary');
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const calculateScore = () => {
                let correct = 0;
                QUESTIONS.forEach((q, idx) => {
                    if (answers[idx]?.firstTryCorrect) correct++;
                });
                return correct;
            };

            const optionLabels = ["A", "B", "C", "D"];

            return (
                <div className="min-h-screen font-sans flex flex-col items-center justify-between p-4 sm:p-8 relative overflow-hidden z-10">

                    <FireflyBackground />

                    <div className="w-full max-w-4xl z-10 flex-grow flex flex-col justify-center items-center">

                        {gameState === 'welcome' && (
                            <div className="bg-slate-800/40 backdrop-blur-xl border border-slate-600/50 p-10 rounded-3xl shadow-2xl w-full max-w-md text-center transform transition-all relative overflow-hidden">
                                <div className="absolute inset-0 bg-gradient-to-br from-amber-500/10 to-transparent opacity-50 pointer-events-none"></div>
                                <div className="flex justify-center mb-6 text-amber-400 drop-shadow-[0_0_15px_rgba(251,191,36,0.5)]">
                                    <Sparkles size={64} className="animate-pulse" style={{ animationDuration: '3s' }} />
                                </div>
                                <h1 className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-slate-100 to-slate-400 mb-2 tracking-tight">
                                    Welcome to HTE
                                </h1>
                                <p className="text-amber-200/80 mb-8 font-medium tracking-wide uppercase text-sm">Tenses – Advanced Practice</p>

                                <div className="mb-8 relative z-10">
                                    <label className="block text-left text-sm font-semibold text-slate-300 mb-2">Please enter your name:</label>
                                    <input
                                        ref={inputRef}
                                        type="text"
                                        autoFocus
                                        className="w-full px-5 py-4 rounded-xl bg-slate-900/50 border border-slate-600 text-slate-100 focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-500/30 transition-all text-lg placeholder-slate-500 shadow-inner"
                                        placeholder="Your Name..."
                                        value={userName}
                                        onChange={(e) => setUserName(e.target.value)}
                                    />
                                </div>

                                <button
                                    onClick={startQuiz}
                                    disabled={userName.trim() === ''}
                                    className={`w-full py-4 rounded-xl font-bold text-lg flex justify-center items-center gap-2 transition-all duration-300 relative z-10 shadow-lg ${userName.trim() !== '' ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-slate-900 hover:shadow-[0_0_20px_rgba(245,158,11,0.4)] hover:scale-[1.02]' : 'bg-slate-700/50 text-slate-500 cursor-not-allowed'}`}
                                >
                                    Start <ArrowRight size={20} />
                                </button>
                            </div>
                        )}

                        {gameState === 'playing' && (
                            <div className="w-full">
                                <div className="text-center mb-8 relative z-10">
                                    <h2 className="inline-flex items-center justify-center gap-3 text-lg sm:text-2xl md:text-3xl font-black uppercase tracking-widest bg-slate-800/60 backdrop-blur-xl px-8 py-3 sm:px-12 sm:py-4 rounded-full border border-slate-600/50 shadow-[0_10px_30px_rgba(0,0,0,0.5)]">
                                        <Sparkles size={28} className="text-amber-400 drop-shadow-md" />
                                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-slate-200 to-slate-400 drop-shadow-sm">
                                            TENSES – ADVANCED
                                        </span>
                                    </h2>
                                </div>

                                <div className="flex flex-wrap justify-between items-center bg-slate-800/40 backdrop-blur-md border border-slate-600/50 p-4 rounded-2xl mb-6 text-slate-200 shadow-lg font-medium">
                                    <div className="flex items-center gap-2">
                                        <User size={18} className="text-amber-400" />
                                        <span className="truncate max-w-[150px] sm:max-w-xs">{userName}</span>
                                    </div>
                                    <div className="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 to-amber-500">
                                        Question {currentIdx + 1} / {QUESTIONS.length}
                                    </div>
                                    <div className="flex items-center gap-2 font-mono text-slate-300 bg-slate-900/60 px-4 py-1.5 rounded-lg border border-slate-700 shadow-inner">
                                        <Clock size={18} className="animate-pulse text-amber-500" /> {formatTime(timeElapsed)}
                                    </div>
                                </div>

                                <div className="w-full bg-slate-900/60 h-2.5 rounded-full mb-8 overflow-hidden border border-slate-700/50 shadow-inner">
                                    <div
                                        className="h-full bg-gradient-to-r from-amber-300 to-orange-500 transition-all duration-300 ease-out relative"
                                        style={{ width: `${((currentIdx + 1) / QUESTIONS.length) * 100}%` }}
                                    >
                                        <div className="absolute top-0 bottom-0 right-0 w-6 bg-white/30 animate-pulse rounded-full"></div>
                                    </div>
                                </div>

                                <div className="bg-slate-800/50 backdrop-blur-xl border border-slate-600/50 rounded-3xl p-6 sm:p-10 shadow-2xl mb-4 relative">
                                    <div className="absolute inset-0 overflow-hidden rounded-3xl pointer-events-none">
                                        <div className="absolute top-[-50%] right-[-10%] w-64 h-64 bg-amber-500/10 blur-[80px] rounded-full"></div>
                                    </div>

                                    <h2 className="text-2xl sm:text-3xl font-semibold text-slate-100 mb-8 leading-relaxed relative z-10">
                                        <span className="text-amber-400 mr-2">{currentIdx + 1}.</span>
                                        {QUESTIONS[currentIdx].text}
                                    </h2>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 relative z-10">
                                        {QUESTIONS[currentIdx].options.map((opt, idx) => {
                                            const currentQ = QUESTIONS[currentIdx];
                                            const currentAnsInfo = answers[currentIdx] || { attempts: [], resolved: false };
                                            const isSelected = currentAnsInfo.attempts.includes(idx);
                                            const isCorrectAns = idx === currentQ.answer;

                                            let btnClass = "flex items-center p-4 rounded-2xl text-left border-2 transition-all duration-200 group font-medium ";
                                            let iconClass = "w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-xl mr-4 text-lg transition-colors shadow-inner font-bold ";
                                            let textClass = "text-lg transition-colors ";

                                            if (currentAnsInfo.resolved && isCorrectAns) {
                                                btnClass += "bg-emerald-900/40 border-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.3)]";
                                                iconClass += "bg-emerald-500 text-slate-900";
                                                textClass += "text-emerald-300";
                                            } else if (isSelected && !isCorrectAns) {
                                                btnClass += "bg-rose-900/40 border-rose-500 shadow-[0_0_10px_rgba(244,63,94,0.3)] animate-pulse-border cursor-not-allowed";
                                                iconClass += "bg-rose-600 text-white";
                                                textClass += "text-rose-300 line-through opacity-70";
                                            } else {
                                                btnClass += "bg-slate-900/40 border-slate-600 hover:bg-slate-700/60 hover:border-amber-500/50 cursor-pointer shadow-sm";
                                                iconClass += "bg-slate-700 text-slate-300 group-hover:bg-amber-500/20 group-hover:text-amber-300 border border-slate-600";
                                                textClass += "text-slate-200";
                                            }

                                            return (
                                                <button key={idx} onClick={() => selectOption(idx)} disabled={currentAnsInfo.resolved || isSelected} className={btnClass}>
                                                    <div className={iconClass}>{optionLabels[idx]}</div>
                                                    <span className={textClass}>{opt}</span>
                                                </button>
                                            );
                                        })}
                                    </div>

                                    <div className="mt-5 text-center min-h-[24px] z-10 relative">
                                        {(() => {
                                            const currentAnsInfo = answers[currentIdx] || { attempts: [], resolved: false, firstTryCorrect: false };
                                            if (currentAnsInfo.resolved) {
                                                return currentAnsInfo.firstTryCorrect
                                                    ? <span className="text-emerald-400 font-medium bg-emerald-900/30 border border-emerald-800/50 px-4 py-1.5 rounded-full inline-block shadow-sm">Excellent! Correct answer.</span>
                                                    : <span className="text-amber-400 font-medium bg-amber-900/30 border border-amber-800/50 px-4 py-1.5 rounded-full inline-block shadow-sm">The correct answer has been revealed.</span>;
                                            } else if (currentAnsInfo.attempts.length > 0) {
                                                return <span className="text-rose-400 font-medium bg-rose-900/30 border border-rose-800/50 px-4 py-1.5 rounded-full inline-block shadow-sm">Incorrect. Try again! (Attempts left: {2 - currentAnsInfo.attempts.length})</span>;
                                            }
                                            return null;
                                        })()}
                                    </div>

                                    <div className="mt-6 flex flex-col items-center relative z-50">
                                        <button
                                            onClick={() => setShowHint(!showHint)}
                                            className={`px-4 py-2 rounded-full text-sm font-semibold shadow-sm border transition-all flex items-center gap-2 ${showHint ? 'bg-amber-500/10 border-amber-500/30 text-amber-300' : 'bg-slate-800/80 border-slate-600 text-slate-300 hover:bg-slate-700/80'}`}
                                        >
                                            <Lightbulb size={16} className={showHint ? "text-amber-400" : "text-slate-400"} />
                                            {showHint ? 'Hide Hint' : 'Show Hint'}
                                        </button>

                                        {showHint && (
                                            <div className="absolute top-full mt-3 w-max max-w-[90vw] sm:max-w-md p-4 bg-slate-800/95 backdrop-blur-xl border border-slate-600 rounded-2xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.7)] text-slate-200 text-left z-50">
                                                <div className="absolute -top-2.5 left-1/2 -translate-x-1/2 w-5 h-5 bg-slate-800/95 border-t border-l border-slate-600 rotate-45 rounded-tl-sm"></div>
                                                <div className="relative z-10">
                                                    <div className="flex items-center gap-1.5 mb-1">
                                                        <span className="text-[10px] uppercase font-bold text-amber-400 tracking-wider">Translation</span>
                                                    </div>
                                                    <p className="font-medium text-[14px] leading-relaxed text-slate-100 mb-3">{QUESTIONS[currentIdx].translation}</p>

                                                    {answers[currentIdx]?.resolved ? (
                                                        <div className="pt-3 border-t border-slate-700">
                                                            <div className="flex items-center gap-1.5 mb-1">
                                                                <span className="text-[10px] uppercase font-bold text-emerald-400 tracking-wider">Grammar Rule</span>
                                                            </div>
                                                            <p className="text-[13px] text-slate-300 leading-relaxed"><strong className="font-semibold text-emerald-300">Rule:</strong> {QUESTIONS[currentIdx].explanation}</p>
                                                        </div>
                                                    ) : (
                                                        <div className="mt-1 pt-2 border-t border-slate-700">
                                                            <p className="text-slate-400 italic text-[11px] font-medium text-center">* Please select an answer to reveal the grammar rule.</p>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="flex flex-col-reverse sm:flex-row justify-between items-center gap-4 sm:gap-0 mt-4 w-full">
                                    <button
                                        onClick={handleBack} disabled={currentIdx === 0}
                                        className={`flex items-center justify-center gap-2 w-full sm:w-auto px-6 py-4 sm:py-3 rounded-xl font-semibold transition-all shadow-sm ${currentIdx === 0 ? 'opacity-0 cursor-default hidden sm:flex' : 'bg-slate-800/60 text-slate-300 hover:bg-slate-700 border border-slate-600'}`}
                                    >
                                        <ArrowLeft size={20} /> Back
                                    </button>

                                    <div className="flex flex-col items-center sm:items-end w-full sm:w-auto">
                                        <button
                                            onClick={handleNext} disabled={!(answers[currentIdx]?.resolved)}
                                            className={`flex items-center justify-center gap-2 w-full sm:w-auto px-8 py-4 rounded-xl font-bold text-lg transition-all shadow-lg
                        ${answers[currentIdx]?.resolved
                                                    ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-slate-900 hover:shadow-[0_0_20px_rgba(245,158,11,0.4)] hover:scale-105 cursor-pointer'
                                                    : 'bg-slate-800/40 text-slate-500 border border-slate-700 cursor-not-allowed'}`}
                                        >
                                            {currentIdx === QUESTIONS.length - 1 ? 'Finish Quiz' : 'Next'}
                                            {currentIdx === QUESTIONS.length - 1 ? <CheckCircle2 size={20} /> : <ArrowRight size={20} />}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {gameState === 'summary' && (
                            <div className="w-full bg-slate-800/60 backdrop-blur-xl border border-slate-600/50 p-6 sm:p-10 rounded-3xl shadow-2xl relative">
                                <div className="text-center mb-10">
                                    <div className="inline-flex justify-center items-center w-20 h-20 bg-gradient-to-tr from-amber-400 to-orange-500 rounded-full mb-4 shadow-[0_0_30px_rgba(245,158,11,0.4)] border-4 border-slate-800">
                                        <Sparkles size={36} className="text-slate-900" />
                                    </div>
                                    <h1 className="text-4xl font-black text-slate-100 mb-2 tracking-tight">Quiz Summary</h1>
                                    <p className="text-xl text-amber-300 font-medium">Outstanding work, {userName}!</p>
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
                                    <div className="bg-slate-900/50 p-4 rounded-2xl border border-slate-700 flex flex-col items-center justify-center text-center shadow-sm">
                                        <Calendar className="text-amber-400 mb-2" size={24} />
                                        <div className="text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider">Date</div>
                                        <div className="text-sm font-bold text-slate-200">{finishDate?.toLocaleDateString('vi-VN')} {finishDate?.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })}</div>
                                    </div>
                                    <div className="bg-slate-900/50 p-4 rounded-2xl border border-slate-700 flex flex-col items-center justify-center text-center shadow-sm">
                                        <Clock className="text-sky-400 mb-2" size={24} />
                                        <div className="text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider">Time Taken</div>
                                        <div className="text-lg font-black text-slate-200">{formatTime(timeElapsed)}</div>
                                    </div>
                                    <div className="bg-slate-900/50 p-4 rounded-2xl border border-slate-700 flex flex-col items-center justify-center text-center shadow-sm">
                                        <CheckCircle2 className="text-emerald-400 mb-2" size={24} />
                                        <div className="text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider">1st Try Correct</div>
                                        <div className="text-2xl font-black text-emerald-400">{calculateScore()}</div>
                                    </div>
                                    <div className="bg-slate-900/50 p-4 rounded-2xl border border-slate-700 flex flex-col items-center justify-center text-center shadow-sm">
                                        <XCircle className="text-rose-400 mb-2" size={24} />
                                        <div className="text-xs text-slate-400 mb-1 font-semibold uppercase tracking-wider">Mistakes</div>
                                        <div className="text-2xl font-black text-rose-400">{QUESTIONS.length - calculateScore()}</div>
                                    </div>
                                </div>

                                <div className="mb-10 text-center">
                                    <div className="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-orange-400 mb-4 drop-shadow-sm">
                                        {Math.round((calculateScore() / QUESTIONS.length) * 100)}%
                                    </div>
                                    <div className="w-full max-w-md mx-auto bg-slate-900/80 h-4 rounded-full overflow-hidden shadow-inner border border-slate-700">
                                        <div
                                            className="h-full bg-gradient-to-r from-rose-500 via-amber-400 to-emerald-500 transition-all duration-1000"
                                            style={{ width: `${(calculateScore() / QUESTIONS.length) * 100}%` }}
                                        ></div>
                                    </div>
                                </div>

                                <div className="mt-8 border-t border-slate-600/50 pt-8">
                                    <h3 className="text-2xl font-bold text-slate-100 mb-6 flex items-center gap-2"><Info size={24} className="text-amber-400" /> Detailed Review</h3>
                                    <div className="space-y-4 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                                        {QUESTIONS.map((q, idx) => {
                                            const ansInfo = answers[idx] || { attempts: [], firstTryCorrect: false };
                                            const isCorrect = ansInfo.firstTryCorrect;
                                            const firstGuessIdx = ansInfo.attempts[0];
                                            const isUnanswered = ansInfo.attempts.length === 0;

                                            return (
                                                <div key={idx} className={`p-5 rounded-2xl border shadow-sm ${isCorrect ? 'bg-emerald-900/20 border-emerald-500/30' : 'bg-rose-900/20 border-rose-500/30'} flex flex-col gap-4`}>
                                                    <div className="flex flex-col sm:flex-row sm:items-start gap-4">
                                                        <div className="flex-shrink-0 mt-1">
                                                            {isCorrect ? <div className="bg-emerald-500/20 p-2 rounded-xl text-emerald-400"><CheckCircle2 size={24} /></div>
                                                                : <div className="bg-rose-500/20 p-2 rounded-xl text-rose-400"><XCircle size={24} /></div>}
                                                        </div>
                                                        <div className="flex-grow">
                                                            <p className="text-slate-200 font-bold text-[17px] mb-1 leading-snug"><span className="text-slate-400 mr-1">{q.id}.</span> {q.text}</p>
                                                            <p className="text-amber-200/70 text-[14px] mb-4 italic font-medium">"{q.translation}"</p>

                                                            <div className="grid sm:grid-cols-2 gap-3 text-sm">
                                                                <div className="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 shadow-inner">
                                                                    <span className="text-slate-400 text-xs font-bold uppercase block mb-1">Your First Try:</span>
                                                                    <span className={`font-bold text-[15px] ${isCorrect ? 'text-emerald-400' : 'text-rose-400'}`}>
                                                                        {isUnanswered ? "None" : `${optionLabels[firstGuessIdx]}. ${q.options[firstGuessIdx]}`}
                                                                    </span>
                                                                </div>
                                                                {!isCorrect && (
                                                                    <div className="bg-emerald-900/30 p-3 rounded-xl border border-emerald-500/30 shadow-inner">
                                                                        <span className="text-emerald-400/80 text-xs font-bold uppercase block mb-1">Correct Answer:</span>
                                                                        <span className="font-bold text-[15px] text-emerald-300">
                                                                            {optionLabels[q.answer]}. {q.options[q.answer]}
                                                                        </span>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>

                                                    <div className={`mt-1 p-4 rounded-xl border flex items-start gap-3 text-[14px] font-medium shadow-sm ${isCorrect ? 'bg-emerald-900/40 border-emerald-500/20 text-emerald-200' : 'bg-rose-900/40 border-rose-500/20 text-rose-200'}`}>
                                                        <Info size={20} className="flex-shrink-0 mt-0.5 opacity-60" />
                                                        <p className="leading-relaxed"><strong className="font-bold opacity-80 uppercase text-xs mr-2">Rule:</strong> {q.explanation}</p>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="mt-10 flex justify-center">
                                    <button
                                        onClick={() => window.location.reload()}
                                        className="px-8 py-4 rounded-xl font-bold bg-slate-700 hover:bg-slate-600 text-white shadow-lg transition-all flex items-center gap-3 group border border-slate-500"
                                    >
                                        <Clock size={20} className="group-hover:-rotate-90 transition-transform duration-500" /> Retake Quiz
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    <footer className="w-full text-center py-6 mt-auto z-20 relative">
                        <p className="text-slate-300 text-sm font-semibold tracking-wide bg-slate-900/70 backdrop-blur-md inline-block px-6 py-2.5 rounded-full border border-slate-700 shadow-lg">
                            © Copyright by <span className="text-amber-400 font-bold">Hoang Truong English</span>
                        </p>
                    </footer>
                </div>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
