<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOCAB QUIZ - ACTIONS 1</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* Typography */
        h1,
        h2,
        h3,
        .neon-font {
            font-family: 'Outfit', sans-serif;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background-color: #022c22;
            /* Blackboard / Emerald 950 */
            -webkit-tap-highlight-color: transparent;
            color: #ecfdf5;
            touch-action: manipulation;
        }

        /* Custom Scrollbar - Neon Green */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #064e3b;
        }

        ::-webkit-scrollbar-thumb {
            background: #22c55e;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4ade80;
        }

        /* Animations */
        @keyframes float-up {
            0% {
                transform: translateY(100vh) rotate(-15deg) scale(0.8);
                opacity: 0;
            }

            10% {
                opacity: 0.15;
            }

            90% {
                opacity: 0.15;
            }

            100% {
                transform: translateY(-20vh) rotate(20deg) scale(1.2);
                opacity: 0;
            }
        }

        .floating-item {
            position: absolute;
            font-size: 2.5rem;
            animation: float-up linear infinite;
            z-index: 0;
            opacity: 0;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(74, 222, 128, 0.4));
            /* Neon green glow */
        }

        @keyframes pop-in {
            0% {
                transform: scale(0.9);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .animate-pop {
            animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-6px);
            }

            40% {
                transform: translateX(6px);
            }

            60% {
                transform: translateX(-6px);
            }

            80% {
                transform: translateX(6px);
            }
        }

        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes pulse-neon {

            0%,
            100% {
                box-shadow: 0 0 15px rgba(34, 197, 94, 0.4), 0 0 30px rgba(34, 197, 94, 0.2);
            }

            50% {
                box-shadow: 0 0 25px rgba(34, 197, 94, 0.7), 0 0 45px rgba(34, 197, 94, 0.4);
            }
        }

        .btn-glow {
            animation: pulse-neon 2.5s infinite;
        }

        /* Neon Glassmorphism Panels (Blackboard feel) */
        .glass-panel {
            background: rgba(2, 44, 34, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(74, 222, 128, 0.3);
            box-shadow: 0 0 30px rgba(22, 163, 74, 0.2), inset 0 0 20px rgba(74, 222, 128, 0.05);
        }

        .question-text strong {
            color: #4ade80;
            font-weight: 800;
            padding: 2px 8px;
            background: rgba(20, 83, 45, 0.5);
            border: 1px solid rgba(74, 222, 128, 0.4);
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 1.15em;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }

        .neon-text-gradient {
            background: linear-gradient(to right, #4ade80, #a3e635);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hidden {
            display: none !important;
        }

        /* Notebook lines pattern */
        .notebook-lines {
            background-image: repeating-linear-gradient(transparent, transparent 31px, rgba(74, 222, 128, 0.1) 31px, rgba(74, 222, 128, 0.1) 32px);
        }
    </style>
</head>

<body class="min-h-screen relative flex items-center justify-center p-4 lg:p-8">

    <div id="background-layer" class="fixed inset-0 overflow-hidden pointer-events-none z-[-1]">
        <!-- Dark green grid/blackboard background -->
        <div
            class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#064e3b] via-[#022c22] to-[#000000] opacity-100">
        </div>
        <div
            class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+PHBhdGggZD0iTTAgMGgyMHYyMEgwem0xMCAxMGEyIDIgMCAxIDAgMC00IDIgMiAwIDAgMCAwIDR6IiBmaWxsPSIjNGFkZTgwIiBmaWxsLW9wYWNpdHk9IjAuMDUiIGZpbGwtcnVsZT0iZXZlbm9kZCIvPjwvc3ZnPg==')] opacity-60">
        </div>
        <div id="floating-container"></div>
    </div>

    <div id="main-content" class="relative w-full max-w-3xl transition-all duration-500 z-10">

        <!-- START SCREEN -->
        <div id="screen-start"
            class="glass-panel rounded-3xl p-6 md:p-14 text-center transform hover:scale-[1.01] transition-transform duration-500">
            <div class="text-6xl md:text-8xl mb-4 md:mb-6 drop-shadow-[0_0_15px_rgba(74,222,128,0.6)]">🎒✏️📚</div>
            <h1
                class="text-3xl sm:text-4xl md:text-5xl font-black mb-3 md:mb-4 neon-text-gradient neon-font tracking-tight drop-shadow-sm leading-tight uppercase">
                ACTION<br>VERBS
            </h1>
            <p
                class="text-base sm:text-lg md:text-xl text-emerald-100/80 mb-8 md:mb-10 font-medium leading-relaxed max-w-xl mx-auto">
                Cùng điểm danh <span id="total-count"
                    class="font-bold text-green-300 bg-green-900/40 px-3 py-1 rounded-lg border border-green-500/50 shadow-[0_0_10px_rgba(74,222,128,0.3)] mx-1"></span>
                cụm từ và hành động thiết yếu mỗi ngày đến trường nhé! 🏫
            </p>

            <div class="mb-6 md:mb-8 relative max-w-xs md:max-w-sm mx-auto">
                <input type="text" id="user-name-input" placeholder="Nhập tên của bạn..."
                    class="w-full bg-emerald-950/60 border-2 border-green-500/50 rounded-xl px-4 py-3 text-green-100 placeholder-green-700/80 focus:outline-none focus:border-green-400 focus:ring-2 focus:ring-green-400/30 transition-all text-center text-base md:text-lg font-semibold shadow-inner"
                    autocomplete="off" spellcheck="false">
            </div>

            <button id="btn-start"
                class="w-full md:w-auto px-8 md:px-10 py-4 md:py-5 bg-gradient-to-r from-green-600 to-emerald-500 hover:from-emerald-500 hover:to-teal-400 text-white font-bold rounded-full text-lg md:text-xl transition-all cursor-pointer transform hover:-translate-y-1 active:translate-y-0 active:scale-95 neon-font tracking-wide uppercase btn-glow"
                style="touch-action: manipulation;">
                Vào Lớp Thôi! 🔔
            </button>
        </div>

        <!-- PLAYING SCREEN -->
        <div id="screen-playing"
            class="glass-panel rounded-3xl p-4 sm:p-6 md:p-10 hidden border-t-4 border-t-green-500 shadow-2xl">
            <!-- Header: Progress & Score -->
            <div class="flex justify-between items-center mb-4 md:mb-6 border-b-2 border-green-900/50 pb-3 md:pb-5">
                <div class="flex flex-col">
                    <span
                        class="text-[10px] md:text-xs text-green-400/80 font-bold tracking-widest uppercase mb-0.5 md:mb-1">Tiến
                        độ</span>
                    <span id="progress-text"
                        class="text-green-400 font-bold tracking-widest uppercase text-xs sm:text-sm md:text-lg neon-font drop-shadow-[0_0_5px_rgba(74,222,128,0.4)]">BÀI
                        1 / 13</span>
                </div>
                <div class="flex flex-col items-end">
                    <span
                        class="text-[10px] md:text-xs text-green-400/80 font-bold tracking-widest uppercase mb-0.5 md:mb-1">Điểm
                        Tích Lũy</span>
                    <span id="score-text"
                        class="bg-emerald-900/60 border border-emerald-500/40 px-3 md:px-4 py-1 md:py-1.5 rounded-xl text-emerald-300 font-bold text-xs sm:text-sm md:text-base shadow-[0_0_10px_rgba(16,185,129,0.3)] flex items-center gap-1 md:gap-2">
                        <span>⭐</span> <span id="score-number" class="text-base md:text-lg">0</span>
                    </span>
                </div>
            </div>

            <!-- Question Area -->
            <div
                class="mb-5 md:mb-8 bg-black/40 p-5 md:p-8 rounded-2xl border border-green-900 shadow-inner relative overflow-hidden notebook-lines">
                <h2 id="question-text"
                    class="text-lg sm:text-xl md:text-2xl font-semibold leading-relaxed question-text text-gray-100 z-10 relative">
                </h2>
            </div>

            <!-- Options Container -->
            <div id="options-container" class="flex flex-col gap-3 md:gap-4 mb-6 md:mb-8">
                <!-- Buttons injected by JS -->
            </div>

            <div id="keyboard-hint" class="text-center text-xs text-green-400/50 font-semibold mb-4 hidden md:block">
                Mẹo: Dùng phím số <kbd
                    class="bg-emerald-900/80 px-2 py-1 rounded text-green-300 border border-green-800">1</kbd> - <kbd
                    class="bg-emerald-900/80 px-2 py-1 rounded text-green-300 border border-green-800">4</kbd> để chọn
                nhanh.
            </div>

            <div id="explanation-container" class="transition-all duration-500 overflow-hidden max-h-0 opacity-0">
                <div
                    class="bg-emerald-950/80 border-l-4 border-green-500 rounded-r-2xl p-4 md:p-6 mb-5 md:mb-6 shadow-[0_0_20px_rgba(34,197,94,0.15)] relative overflow-hidden">
                    <div id="rationale-text" class="hidden relative z-10">
                        <span id="rationale-content" class="block"></span>
                    </div>
                </div>

                <button id="btn-next"
                    class="w-full py-4 md:py-5 bg-teal-900/80 hover:bg-teal-800 border border-teal-500/50 text-teal-100 font-bold rounded-2xl text-base md:text-xl shadow-[0_0_15px_rgba(20,184,166,0.4)] transition-all flex justify-center items-center gap-2 md:gap-3 cursor-pointer transform hover:-translate-y-1 active:translate-y-0 neon-font tracking-wide uppercase"
                    style="touch-action: manipulation;">
                    Tiếp Tục ➔
                </button>
            </div>
        </div>

        <!-- END SCREEN -->
        <div id="screen-end"
            class="glass-panel rounded-3xl p-6 md:p-14 text-center transform transition-transform duration-500 hidden">
            <div class="text-6xl md:text-8xl mb-4 md:mb-6 animate-pop drop-shadow-[0_0_15px_rgba(74,222,128,0.6)]">🏆🎓
            </div>
            <h1
                class="text-2xl sm:text-3xl md:text-5xl font-black mb-3 md:mb-4 neon-text-gradient neon-font tracking-tight drop-shadow-sm leading-tight">
                Hoàn Thành Tiết Học!
            </h1>
            <p id="final-message"
                class="text-sm sm:text-base md:text-xl text-emerald-100/80 mb-6 md:mb-10 font-medium max-w-lg mx-auto leading-relaxed">
            </p>

            <!-- Statistics Board -->
            <div
                class="max-w-md mx-auto bg-emerald-950/80 border border-green-500/40 rounded-3xl p-5 md:p-8 text-left shadow-[0_0_25px_rgba(34,197,94,0.15)] mb-8 md:mb-10 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-2 h-full bg-gradient-to-b from-green-400 to-lime-500"></div>
                <h3
                    class="text-lg md:text-2xl font-bold text-green-400 mb-4 md:mb-6 border-b-2 border-green-900/50 pb-3 md:pb-4 text-center neon-font tracking-wide uppercase drop-shadow-[0_0_5px_rgba(74,222,128,0.5)]">
                    Sổ Điểm Danh<br><span id="display-student-name"
                        class="text-emerald-100 text-base md:text-xl mt-2 block font-sans tracking-normal capitalize"></span>
                </h3>
                <ul class="space-y-4 md:space-y-5 text-emerald-100/90 text-xs sm:text-sm md:text-base font-medium">
                    <li class="flex justify-between items-center border-b border-emerald-900/60 pb-2 md:pb-3">
                        <span class="flex items-center gap-2 md:gap-3"><span
                                class="text-lg md:text-xl flex-shrink-0">✅</span> Nhạy bén <span
                                class="hidden sm:inline">(Đúng L1)</span>:</span>
                        <span id="stat-correct"
                            class="font-black text-green-400 text-xl md:text-2xl neon-font drop-shadow-[0_0_5px_rgba(74,222,128,0.6)] flex-shrink-0"></span>
                    </li>
                    <li class="flex justify-between items-center border-b border-emerald-900/60 pb-2 md:pb-3">
                        <span class="flex items-center gap-2 md:gap-3"><span
                                class="text-lg md:text-xl flex-shrink-0">🤔</span> Cẩn thận <span
                                class="hidden sm:inline">(Đúng L2)</span>:</span>
                        <span id="stat-second"
                            class="font-black text-lime-400 text-xl md:text-2xl neon-font drop-shadow-[0_0_5px_rgba(163,230,53,0.6)] flex-shrink-0"></span>
                    </li>
                    <li class="flex justify-between items-center pb-1">
                        <span class="flex items-center gap-2 md:gap-3"><span
                                class="text-lg md:text-xl flex-shrink-0">📝</span> Đã củng cố <span
                                class="hidden sm:inline">(Vòng 2)</span>:</span>
                        <span id="stat-wrong"
                            class="font-black text-orange-400 text-xl md:text-2xl neon-font drop-shadow-[0_0_5px_rgba(251,146,60,0.6)] flex-shrink-0"></span>
                    </li>
                </ul>
            </div>

            <button id="btn-restart"
                class="w-full md:w-auto px-8 md:px-10 py-4 md:py-5 bg-transparent hover:bg-green-900/30 border-2 border-green-500 text-green-400 hover:text-green-300 font-bold rounded-full text-base md:text-xl transition-all flex items-center justify-center gap-3 mx-auto cursor-pointer shadow-[0_0_15px_rgba(34,197,94,0.3)] neon-font tracking-wide uppercase active:scale-95"
                style="touch-action: manipulation;">
                🔄 Học Lại Bài Mới
            </button>
        </div>
    </div>

    <script>
        const rawData = [
            { word: "go to work", meaning: "đi làm", exEn: "I go to work at 7 a.m.", exVn: "Tôi đi làm lúc 7 giờ sáng." },
            { word: "come home", meaning: "về nhà", exEn: "I come home at 6 p.m. Please come here.", exVn: "Tôi về nhà lúc 6 giờ tối. Vui lòng đến đây." },
            { word: "eat apples", meaning: "ăn táo", exEn: "I eat apples every morning.", exVn: "Tôi ăn táo mỗi sáng." },
            { word: "drink water", meaning: "uống nước", exEn: "I drink water every day.", exVn: "Tôi uống nước mỗi ngày." },
            { word: "sit down", meaning: "ngồi xuống", exEn: "Please sit down.", exVn: "Vui lòng ngồi xuống." },
            { word: "stand up", meaning: "đứng lên", exEn: "Please stand up.", exVn: "Vui lòng đứng lên." },
            { word: "read a book", meaning: "đọc sách", exEn: "I read a book before bed.", exVn: "Tôi đọc sách trước khi đi ngủ." },
            { word: "write my name", meaning: "viết tên", exEn: "I write my name on the paper.", exVn: "Tôi viết tên mình lên giấy." },
            { word: "speak English", meaning: "nói tiếng Anh", exEn: "We speak English in class.", exVn: "Chúng tôi nói tiếng Anh trong lớp." },
            { word: "listen to music", meaning: "nghe nhạc", exEn: "I listen to music in the evening.", exVn: "Tôi nghe nhạc vào buổi tối." },
            { word: "look at the picture", meaning: "nhìn vào bức tranh", exEn: "Please look at the picture.", exVn: "Vui lòng nhìn vào bức tranh." },
            { word: "open the door", meaning: "mở cửa", exEn: "Can you open the door, please?", exVn: "Bạn có thể mở cửa được không?" },
            { word: "close the door", meaning: "đóng cửa", exEn: "Please close the door.", exVn: "Vui lòng đóng cửa." }
        ];

        document.getElementById('total-count').innerText = rawData.length;

        let quizData = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let correctSecondTry = 0;
        let failedQuestions = 0;
        let attempts = 0;
        let hasAnswered = false;
        let currentShuffledOptions = [];
        let reviewQueue = [];
        let isReviewRound = false;
        let userName = "";

        const DOM = {
            screenStart: document.getElementById('screen-start'),
            screenPlaying: document.getElementById('screen-playing'),
            screenEnd: document.getElementById('screen-end'),
            progressText: document.getElementById('progress-text'),
            scoreNumber: document.getElementById('score-number'),
            questionText: document.getElementById('question-text'),
            optionsContainer: document.getElementById('options-container'),
            explanationContainer: document.getElementById('explanation-container'),
            rationaleText: document.getElementById('rationale-text'),
            rationaleContent: document.getElementById('rationale-content'),
            btnNext: document.getElementById('btn-next'),
            btnStart: document.getElementById('btn-start'),
            btnRestart: document.getElementById('btn-restart'),
            userNameInput: document.getElementById('user-name-input'),
            displayStudentName: document.getElementById('display-student-name')
        };

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function generateQuizData() {
            const shuffledRaw = shuffleArray([...rawData]);

            return shuffledRaw.map((item, index) => {
                let wrongMeanings = [];
                const allMeanings = rawData.map(v => v.meaning).filter(m => m !== item.meaning);
                const shuffledWrong = shuffleArray(allMeanings);
                wrongMeanings = shuffledWrong.slice(0, 3);

                const options = [
                    { text: item.meaning, isCorrect: true },
                    { text: wrongMeanings[0], isCorrect: false },
                    { text: wrongMeanings[1], isCorrect: false },
                    { text: wrongMeanings[2], isCorrect: false }
                ];

                return {
                    questionNumber: index + 1,
                    question: `Hành động **${item.word}** có nghĩa là gì?`,
                    answerOptions: options,
                    speakWordText: item.word,
                    speakSentenceText: item.exEn,
                    rationale: `
                        <div class="flex items-center flex-wrap gap-3 mb-3 md:mb-4 border-b border-green-500/30 pb-3 md:pb-4">
                            <span class="text-2xl md:text-3xl font-black text-green-400 tracking-wide neon-font drop-shadow-[0_0_8px_rgba(74,222,128,0.5)]">${item.word}</span>
                            
                            <!-- Loa 1: Chỉ đọc cụm từ -->
                            <button onclick="speakWord('${item.word.replace(/['’]/g, "\\'")}')" class="ml-auto p-2 bg-green-900/50 hover:bg-green-800 text-green-300 rounded-full transition-all flex items-center justify-center w-10 h-10 md:w-12 md:h-12 shadow-[0_0_15px_rgba(74,222,128,0.3)] border border-green-500/50 hover:scale-110 flex-shrink-0" title="Nghe từ vựng" style="touch-action: manipulation;">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.28l3.435 3.435A1 1 0 0014 18.5V5.5a1 1 0 00-1.707-.707L9.28 8.22A2 2 0 007 10H5z" /></svg>
                            </button>
                        </div>
                        <div class="flex items-start md:items-center justify-between text-emerald-100 font-medium text-sm md:text-base leading-relaxed pl-3 border-l-4 border-green-500 bg-emerald-900/40 py-2 pr-2 rounded-r-lg mb-2 gap-2">
                            <div class="pt-1 md:pt-0"><span class="text-green-400 mr-1 md:mr-2 drop-shadow-[0_0_5px_rgba(74,222,128,0.5)]">📝</span> <span>${item.exEn}</span></div>
                            
                            <!-- Loa 2: Chỉ đọc câu ví dụ -->
                            <button onclick="speakWord('${item.exEn.replace(/['’]/g, "\\'")}')" class="p-1.5 bg-teal-900/60 hover:bg-teal-800 text-teal-300 rounded-full transition-all flex items-center justify-center w-8 h-8 md:w-10 md:h-10 shadow-[0_0_10px_rgba(20,184,166,0.3)] border border-teal-500/40 hover:scale-110 flex-shrink-0 mt-0.5 md:mt-0" title="Nghe câu ví dụ" style="touch-action: manipulation;">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 md:h-5 md:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.28l3.435 3.435A1 1 0 0014 18.5V5.5a1 1 0 00-1.707-.707L9.28 8.22A2 2 0 007 10H5z" /></svg>
                            </button>
                        </div>
                        <div class="text-emerald-300/80 italic font-medium text-sm md:text-base leading-relaxed pl-3 border-l-4 border-emerald-800 bg-emerald-950/50 py-2 pr-3 rounded-r-lg">
                            <span class="text-emerald-600 mr-2">🇻🇳</span> <span>${item.exVn}</span>
                        </div>`
                };
            });
        }

        function startGame() {
            // Lấy tên người dùng
            const nameValue = DOM.userNameInput.value.trim();

            // Kiểm tra xem người dùng đã nhập tên chưa
            if (nameValue === "") {
                DOM.userNameInput.classList.add('animate-shake', 'border-rose-500', 'ring-2', 'ring-rose-500/50');
                setTimeout(() => {
                    DOM.userNameInput.classList.remove('animate-shake', 'border-rose-500', 'ring-2', 'ring-rose-500/50');
                }, 600);
                return; // Dừng lại, không cho phép vào lớp
            }

            userName = nameValue;

            quizData = generateQuizData();
            currentQuestionIndex = 0;
            score = 0;
            correctSecondTry = 0;
            failedQuestions = 0;
            reviewQueue = [];
            isReviewRound = false;

            DOM.screenStart.classList.add('hidden');
            DOM.screenEnd.classList.add('hidden');
            DOM.screenPlaying.classList.remove('hidden');

            DOM.screenPlaying.style.opacity = 0;
            setTimeout(() => {
                DOM.screenPlaying.style.transition = 'opacity 0.5s ease';
                DOM.screenPlaying.style.opacity = 1;
            }, 10);

            loadQuestion();
        }

        function loadQuestion() {
            hasAnswered = false;
            attempts = 0;

            const currentQ = quizData[currentQuestionIndex];

            if (isReviewRound) {
                DOM.progressText.innerText = `ÔN TẬP: BÀI ${currentQuestionIndex + 1} / ${quizData.length}`;
                DOM.progressText.className = "text-orange-400 font-bold tracking-widest uppercase text-xs sm:text-sm md:text-lg neon-font drop-shadow-[0_0_5px_rgba(251,146,60,0.5)]";
            } else {
                DOM.progressText.innerText = `BÀI ${currentQuestionIndex + 1} / ${quizData.length}`;
                DOM.progressText.className = "text-green-400 font-bold tracking-widest uppercase text-xs sm:text-sm md:text-lg neon-font drop-shadow-[0_0_5px_rgba(74,222,128,0.5)]";
            }

            DOM.scoreNumber.innerText = score;
            DOM.questionText.innerHTML = currentQ.question.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            currentShuffledOptions = shuffleArray(currentQ.answerOptions);

            DOM.optionsContainer.innerHTML = '';
            const labels = ['1', '2', '3', '4'];
            currentShuffledOptions.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.style.touchAction = 'manipulation';
                const numberLabel = `<span class="inline-flex items-center justify-center w-7 h-7 rounded bg-emerald-950 text-green-400 font-bold border border-green-800/50 text-sm mr-3 font-mono transition-colors flex-shrink-0">${labels[index]}</span>`;

                btn.className = "group text-left p-3 sm:p-4 rounded-xl border border-green-900/60 transition-all duration-300 text-sm sm:text-base bg-emerald-900/30 hover:bg-green-900/40 hover:border-green-500/50 text-emerald-100 cursor-pointer shadow-sm font-semibold flex items-center";
                btn.innerHTML = `${numberLabel} <span class="leading-snug">${option.text}</span>`;

                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    handleAnswer(index, option.isCorrect);
                });

                DOM.optionsContainer.appendChild(btn);
            });

            DOM.explanationContainer.classList.remove('max-h-[800px]', 'opacity-100', 'mt-6');
            DOM.explanationContainer.classList.add('max-h-0', 'opacity-0');
            DOM.rationaleText.className = "hidden";

            if (currentQuestionIndex < quizData.length - 1) {
                DOM.btnNext.innerHTML = 'Chuyển Bài ➔';
                DOM.btnNext.className = "w-full py-4 md:py-5 bg-teal-900/80 hover:bg-teal-800 border border-teal-500/50 text-teal-100 font-bold rounded-2xl text-base md:text-xl shadow-[0_0_15px_rgba(20,184,166,0.4)] transition-all flex justify-center items-center gap-2 md:gap-3 cursor-pointer transform hover:-translate-y-1 active:translate-y-0 neon-font tracking-wide uppercase";
            } else {
                DOM.btnNext.innerHTML = 'Đang xử lý...';
            }
        }

        function handleAnswer(selectedIndex, isCorrect) {
            if (hasAnswered) return;

            const currentQ = quizData[currentQuestionIndex];
            const buttons = DOM.optionsContainer.children;
            const btn = buttons[selectedIndex];

            Array.from(buttons).forEach(b => b.classList.remove('group', 'hover:bg-green-900/40', 'hover:border-green-500/50'));

            if (isCorrect) {
                hasAnswered = true;
                if (attempts === 0) {
                    if (!isReviewRound) score++;
                    DOM.scoreNumber.innerText = score;
                    DOM.scoreNumber.style.transform = 'scale(1.5)';
                    DOM.scoreNumber.style.color = '#a3e635';
                    setTimeout(() => {
                        DOM.scoreNumber.style.transform = 'scale(1)';
                        DOM.scoreNumber.style.color = 'inherit';
                    }, 300);
                } else if (attempts === 1) {
                    if (!isReviewRound) correctSecondTry++;
                }

                const numberSpan = btn.querySelector('span:first-child');
                numberSpan.className = "inline-flex items-center justify-center w-7 h-7 rounded bg-green-500 text-emerald-950 font-bold text-sm mr-3 font-mono flex-shrink-0 shadow-[0_0_10px_rgba(34,197,94,0.8)]";
                btn.className = "text-left p-3 sm:p-4 rounded-xl border border-green-400 transition-all duration-500 text-sm sm:text-base bg-green-900/40 text-green-300 shadow-[0_0_15px_rgba(74,222,128,0.3)] font-bold flex items-center";

                for (let i = 0; i < buttons.length; i++) {
                    buttons[i].disabled = true;
                    if (i !== selectedIndex && !buttons[i].classList.contains('bg-rose-900/40')) {
                        buttons[i].className += " opacity-30 cursor-not-allowed scale-95";
                    }
                }

                speakWord(currentQ.speakWordText); // Chỉ auto đọc cụm từ
                showRationale(currentQ);
                updateNextButtonState();
            } else {
                attempts++;

                const numberSpan = btn.querySelector('span:first-child');
                numberSpan.className = "inline-flex items-center justify-center w-7 h-7 rounded bg-rose-600 text-white font-bold text-sm mr-3 font-mono flex-shrink-0 shadow-[0_0_10px_rgba(225,29,72,0.8)]";
                btn.className = "text-left p-3 sm:p-4 rounded-xl border border-rose-500 transition-all duration-300 text-sm sm:text-base bg-rose-900/40 text-rose-300 animate-shake flex items-center shadow-[0_0_15px_rgba(244,63,94,0.2)]";

                const textSpan = btn.querySelector('span:last-child');
                textSpan.classList.add('line-through', 'decoration-rose-500', 'opacity-70');

                btn.disabled = true;

                setTimeout(() => { btn.classList.remove('animate-shake'); }, 400);

                if (attempts >= 2) {
                    hasAnswered = true;
                    if (!isReviewRound) failedQuestions++;

                    reviewQueue.push(currentQ);

                    for (let i = 0; i < buttons.length; i++) {
                        buttons[i].disabled = true;
                        if (currentShuffledOptions[i].isCorrect) {
                            const correctNum = buttons[i].querySelector('span:first-child');
                            correctNum.className = "inline-flex items-center justify-center w-7 h-7 rounded bg-green-500 text-emerald-950 font-bold text-sm mr-3 font-mono flex-shrink-0 shadow-[0_0_10px_rgba(34,197,94,0.8)]";
                            buttons[i].className = "text-left p-3 sm:p-4 rounded-xl border border-green-400 transition-all duration-500 text-sm sm:text-base bg-green-900/40 text-green-300 shadow-[0_0_15px_rgba(74,222,128,0.3)] font-bold flex items-center";
                        } else if (!buttons[i].classList.contains('bg-rose-900/40')) {
                            buttons[i].className += " opacity-30 cursor-not-allowed scale-95";
                        }
                    }
                    speakWord(currentQ.speakWordText); // Chỉ auto đọc cụm từ
                    showRationale(currentQ);
                    updateNextButtonState();
                }
            }
        }

        function updateNextButtonState() {
            if (currentQuestionIndex === quizData.length - 1) {
                if (reviewQueue.length > 0) {
                    DOM.btnNext.innerHTML = 'Sang Vòng Ôn Tập 📝';
                    DOM.btnNext.className = "w-full py-4 md:py-5 bg-orange-600/90 hover:bg-orange-500 border border-orange-400/50 text-white font-bold rounded-2xl text-lg md:text-xl shadow-[0_0_20px_rgba(249,115,22,0.4)] transition-all flex justify-center items-center gap-3 cursor-pointer transform hover:-translate-y-1 active:translate-y-0 neon-font tracking-wide uppercase";
                } else {
                    DOM.btnNext.innerHTML = 'Hoàn Thành Tiết Học 🏁';
                    DOM.btnNext.className = "w-full py-4 md:py-5 bg-gradient-to-r from-green-600 to-lime-500 hover:from-lime-500 hover:to-green-400 text-emerald-950 font-bold rounded-2xl text-lg md:text-xl shadow-[0_0_20px_rgba(132,204,22,0.5)] transition-all flex justify-center items-center gap-3 cursor-pointer transform hover:-translate-y-1 active:translate-y-0 neon-font tracking-wide uppercase";
                }
            }
        }

        function showRationale(currentQ) {
            DOM.rationaleContent.innerHTML = currentQ.rationale;
            DOM.rationaleText.className = "block text-base md:text-lg animate-pop";

            DOM.explanationContainer.classList.remove('max-h-0', 'opacity-0');
            DOM.explanationContainer.classList.add('max-h-[800px]', 'opacity-100', 'mt-6');

            if (window.innerWidth < 768) {
                setTimeout(() => { DOM.explanationContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 300);
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else if (reviewQueue.length > 0) {
                isReviewRound = true;
                quizData = shuffleArray([...reviewQueue]);
                reviewQueue = [];
                currentQuestionIndex = 0;
                loadQuestion();
            } else {
                endGame();
            }
        }

        function endGame() {
            DOM.screenPlaying.classList.add('hidden');
            DOM.screenEnd.classList.remove('hidden');
            DOM.screenEnd.classList.add('animate-pop');

            const finalMessage = document.getElementById('final-message');
            const percentage = score / rawData.length;

            if (percentage >= 0.9) {
                finalMessage.style.display = "none";
            } else if (percentage >= 0.6) {
                finalMessage.innerText = `Khá lắm ${userName}! Bạn đã nhớ được phần lớn nội dung bài học. Hãy củng cố thêm chút nữa nhé! 📚`;
                finalMessage.style.display = "block";
            } else {
                finalMessage.innerText = `${userName} ơi, có vẻ bài học hơi nhiều thông tin. Đừng nản chí, hãy ôn tập lại từ đầu nhé! ✏️`;
                finalMessage.style.display = "block";
            }

            DOM.displayStudentName.innerText = `👨‍🎓 ${userName} 👩‍🎓`;
            document.getElementById('stat-correct').innerText = `${score}`;
            document.getElementById('stat-second').innerText = `${correctSecondTry}`;
            document.getElementById('stat-wrong').innerText = `${failedQuestions}`;
        }

        let availableVoices = [];
        function initVoices() {
            availableVoices = window.speechSynthesis.getVoices();
            if (availableVoices.length === 0) {
                window.speechSynthesis.onvoiceschanged = () => { availableVoices = window.speechSynthesis.getVoices(); };
            }
        }

        window.speakWord = function (text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();

                let spokenText = text;
                if (spokenText.trim() === 'I') spokenText = 'eye';
                // Thay thế dấu gạch chéo thành "or" để đọc tự nhiên hơn
                spokenText = spokenText.replace(/\//g, ' or ');

                const utterance = new SpeechSynthesisUtterance(spokenText);

                let selectedVoice = null;
                const enVoices = availableVoices.filter(v => v.lang.startsWith('en'));

                if (enVoices.length > 0) {
                    selectedVoice = enVoices.find(v => v.name.includes('Samantha')) ||
                        enVoices.find(v => v.name.includes('Zira')) ||
                        enVoices.find(v => v.name.includes('Google US English')) ||
                        enVoices.find(v => v.lang === 'en-US' && v.name.includes('Female')) ||
                        enVoices[0];
                }

                if (selectedVoice) utterance.voice = selectedVoice;
                utterance.lang = selectedVoice ? selectedVoice.lang : 'en-US';
                utterance.rate = 0.85;
                utterance.pitch = 1.1;
                utterance.volume = 1;

                try { window.speechSynthesis.speak(utterance); } catch (e) { console.error("TTS Error:", e); }
            }
        };

        function createFloatingItems() {
            const container = document.getElementById('floating-container');
            const icons = ['✏️', '📏', '🎒', '📖', '✂️', '🖍️', '🍎', '📝'];
            const numberOfItems = window.innerWidth > 768 ? 20 : 12;

            for (let i = 0; i < numberOfItems; i++) {
                const item = document.createElement('div');
                item.className = 'floating-item';
                item.innerText = icons[Math.floor(Math.random() * icons.length)];
                item.style.left = `${Math.random() * 100}%`;

                const duration = Math.random() * 25 + 15;
                item.style.animationDuration = `${duration}s`;
                item.style.animationDelay = `${Math.random() * 20}s`;
                item.style.transform = `scale(${Math.random() * 0.5 + 0.5})`;

                container.appendChild(item);
            }
        }

        function initApp() {
            createFloatingItems();
            initVoices();

            DOM.btnStart.addEventListener('click', function (e) { e.preventDefault(); startGame(); });
            DOM.btnRestart.addEventListener('click', function (e) { e.preventDefault(); startGame(); });
            DOM.btnNext.addEventListener('click', function (e) { e.preventDefault(); nextQuestion(); });

            document.addEventListener('keydown', function (event) {
                if (event.key === 'Enter') {
                    if (!DOM.screenPlaying.classList.contains('hidden') && hasAnswered) {
                        event.preventDefault(); nextQuestion();
                    } else if (!DOM.screenStart.classList.contains('hidden')) {
                        event.preventDefault(); startGame();
                    } else if (!DOM.screenEnd.classList.contains('hidden')) {
                        event.preventDefault(); startGame();
                    }
                }

                if (!DOM.screenPlaying.classList.contains('hidden') && !hasAnswered) {
                    if (['1', '2', '3', '4'].includes(event.key)) {
                        const index = parseInt(event.key) - 1;
                        const buttons = DOM.optionsContainer.children;
                        if (buttons[index] && !buttons[index].disabled) {
                            buttons[index].click();
                        }
                    }
                }
            });
        }

        window.addEventListener('DOMContentLoaded', initApp);

    </script>
