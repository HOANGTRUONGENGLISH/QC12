<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YES / NO / NOT GIVEN - BREAKING THE HABIT</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas cho tính năng chụp màn hình -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* CSS cho thanh cuộn */
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;

            width: 8px;
        }

        #passage-container::-webkit-scrollbar-track,
        #questions-container::-webkit-scrollbar-track {
            background: transparent;
        }

        #passage-container::-webkit-scrollbar-thumb,
        #questions-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
            border: 2px solid white;
        }

        /* Đảm bảo các thẻ định dạng văn bản hoạt động tốt cùng Tailwind */
        #app b,
        #app strong {
            font-weight: bolder;
        }

        #app i,
        #app em {
            font-style: italic;
        }

        #app u {
            text-decoration: underline;
        }

        #app strike,
        #app s {
            text-decoration: line-through;
        }
    </style>
</head>

<body class="h-screen flex flex-col bg-slate-100 text-slate-800 font-sans overflow-hidden">

    <div id="app" class="flex flex-col h-full w-full relative"></div>

    <script>
        const quizData = [
            {
                title: "YES / NO / NOT GIVEN - BREAKING THE HABIT",
                instruction: "Do the following statements agree with the claims of the writer in the Reading passage?<br>Write:<br><strong>YES</strong> — if the statement agrees with the claims of the writer<br><strong>NO</strong> — if the statement contradicts the claims of the writer<br><strong>NOT GIVEN</strong> — if it is impossible to say what the writer thinks about this",
                passage: "<h2 class='text-xl md:text-2xl font-bold text-slate-900 mb-2'>Breaking the habit</h2><h3 class='text-lg font-medium text-slate-700 mb-4 italic'>We all think we can break our bad habits – but they can stay with us for life</h3><p class='mb-4'>What is a bad habit? The most common definition is that it is something that we do regularly, almost without thinking about it, and which has some sort of negative consequence. This consequence could affect those around us, or it could affect us personally. Those who deny having bad habits are probably lying. Bad habits are part of what makes us human.</p><p class='mb-4'>Many early habits, like sucking our thumb, are broken when we are very young. We are either told to stop doing it by our parents, or we consciously or subconsciously observe that others do not have the same habit, and we gradually grow out of it. It is when we intentionally or unintentionally pick up new habits in our later childhood or early adulthood that it becomes a problem. Unless we can break that habit early on, it becomes a part of our life, and becomes ‘programmed’ into our brain.</p><p class='mb-4'>A recent study of human memory suggests that no matter how hard we try to change our habits, it is the old ways that tend to win, especially in situations where we are rushed, stressed or overworked. Habits that we thought we had got rid of can suddenly come back. During the study programme, the researchers showed a group of volunteers several pictures, and gave them words to associate with them (for example, see a picture of tea, and associate it with ‘breakfast’). They then showed the volunteers the same pictures again, and gave them new words to associate with them (see a picture of tea, and say ‘afternoon’).</p><p class='mb-4'>A few days later, the volunteers were given a test. The researchers showed them the pictures, and told them to respond with one of the words they had been given for each one. It came as no surprise that their answers were split between the first set of words and the second. Two weeks later, they were given the same test again. This time, most of them only gave the first set of words. They appeared to have completely forgotten the second set.</p><p class='mb-4'>The study confirms that the responses we learn first are those that remain strongest over time. We may try to change our ways, but after a while, the response that comes to mind first is usually the first one we learned. The more that response is used, the more automatic it becomes and the harder it becomes to respond in any other way.</p><p class='mb-4'>The study therefore suggests that, over time, our bad habits also become automatic, learned behaviour. This is not good news for people who picked up bad habits early in life and now want to change or break them. Even when we try to put new, good intentions into practice, those previously learned habits remain stronger in more automatic, unconscious forms of memory.</p>",

                passageTranslation: "<h2 class='text-xl md:text-2xl font-bold text-slate-900 mb-2'>Từ bỏ thói quen</h2><h3 class='text-lg font-medium text-slate-700 mb-4 italic'>Tất cả chúng ta đều nghĩ rằng mình có thể từ bỏ những thói quen xấu – nhưng chúng có thể đi theo ta suốt đời</h3><p class='mb-4'>Thói quen xấu là gì? Định nghĩa phổ biến nhất đó là một việc mà chúng ta làm thường xuyên, gần như không cần suy nghĩ về nó, và gây ra một số hậu quả tiêu cực. Hậu quả này có thể ảnh hưởng đến những người xung quanh, hoặc ảnh hưởng trực tiếp đến cá nhân chúng ta. Những người phủ nhận việc có thói quen xấu có lẽ đang nói dối. Thói quen xấu là một phần tạo nên con người chúng ta.</p><p class='mb-4'>Nhiều thói quen ban đầu, như mút ngón tay, được phá vỡ khi chúng ta còn rất nhỏ. Chúng ta hoặc bị cha mẹ yêu cầu dừng lại, hoặc chúng ta có ý thức hay vô thức quan sát thấy những người khác không có thói quen đó, và dần dần chúng ta từ bỏ nó khi lớn lên. Nhưng khi chúng ta vô tình hay cố ý hình thành những thói quen mới trong giai đoạn thơ ấu muộn hoặc đầu tuổi trưởng thành thì nó lại trở thành vấn đề. Trừ khi ta có thể sớm phá vỡ thói quen đó, nó sẽ trở thành một phần cuộc sống của chúng ta và được 'lập trình' vào bộ não.</p><p class='mb-4'>Một nghiên cứu gần đây về trí nhớ con người cho thấy rằng dù chúng ta có cố gắng thay đổi thói quen đến đâu, thì những lề lối cũ vẫn có xu hướng giành chiến thắng, đặc biệt là trong những tình huống chúng ta đang vội vã, căng thẳng hoặc làm việc quá sức. Những thói quen mà ta tưởng mình đã vứt bỏ được có thể đột nhiên quay trở lại. Trong chương trình nghiên cứu, các nhà nghiên cứu đã cho một nhóm tình nguyện viên xem vài bức tranh và đưa ra các từ để họ liên kết với chúng (ví dụ: nhìn thấy hình ảnh tách trà và liên kết nó với từ 'bữa sáng'). Sau đó, họ lại cho tình nguyện viên xem những bức tranh cũ, và đưa ra các từ mới để liên kết (nhìn thấy tách trà và nói 'buổi chiều').</p><p class='mb-4'>Vài ngày sau, các tình nguyện viên được tham gia một bài kiểm tra. Các nhà nghiên cứu cho họ xem lại các bức tranh và yêu cầu họ phản hồi bằng một trong những từ đã được cung cấp cho mỗi bức. Không có gì đáng ngạc nhiên khi câu trả lời của họ bị chia rẽ giữa nhóm từ đầu tiên và nhóm từ thứ hai. Hai tuần sau, họ lại được làm bài kiểm tra tương tự. Lần này, hầu hết họ chỉ đưa ra các từ thuộc nhóm đầu tiên. Họ dường như đã hoàn toàn quên nhóm từ thứ hai.</p><p class='mb-4'>Nghiên cứu xác nhận rằng những phản ứng mà chúng ta học đầu tiên là những phản ứng duy trì mạnh mẽ nhất theo thời gian. Chúng ta có thể cố gắng thay đổi lề lối, nhưng sau một thời gian, phản ứng nảy ra trong đầu đầu tiên thường là phản ứng mà chúng ta đã học đầu tiên. Phản ứng đó càng được sử dụng nhiều, nó càng trở nên tự động và càng khó để phản ứng theo bất kỳ cách nào khác.</p><p class='mb-4'>Do đó, nghiên cứu cho thấy rằng theo thời gian, những thói quen xấu của chúng ta cũng trở thành hành vi tự động được học hỏi. Đây không phải là tin tốt cho những người đã mắc thói quen xấu từ sớm và hiện tại đang muốn thay đổi hoặc phá vỡ chúng. Ngay cả khi chúng ta cố gắng đưa những ý định mới, tốt đẹp vào thực tế, thì những thói quen đã học từ trước đó vẫn mạnh mẽ hơn dưới dạng trí nhớ vô thức và tự động hơn.</p>",

                questions: [
                    {
                        id: 1,
                        text: "<strong>[1]</strong> We usually develop bad habits when we are very young.",
                        type: "text",
                        correct: "NOT GIVEN",
                        explanation: "<strong>Từ khóa:</strong> usually develop bad habits, very young.<br><br><strong>Trong bài (Đoạn 2):</strong> \"Many early habits... are broken when we are very young... It is when we intentionally or unintentionally pick up new habits in our later childhood or early adulthood that it becomes a problem.\"<br><br><strong>Giải thích:</strong> Bài đọc chỉ ra rằng những thói quen hình thành lúc còn rất nhỏ (very young) thường sẽ bị phá bỏ. Thay vào đó, chúng ta thường hình thành những thói quen xấu (trở thành vấn đề) ở giai đoạn 'later childhood' (thơ ấu muộn) hoặc 'early adulthood' (đầu tuổi trưởng thành). Do đó, câu khẳng định là sai (NO)."
                    },
                    {
                        id: 2,
                        text: "<strong>[2]</strong> We can only break bad habits if people tell us to do so.",
                        type: "text",
                        correct: "NO",
                        explanation: "<strong>Từ khóa:</strong> only break bad habits, people tell us to do so.<br><br><strong>Trong bài (Đoạn 2):</strong> \"We are either told to stop doing it by our parents, or we consciously or subconsciously observe that others do not have the same habit, and we gradually grow out of it.\"<br><br><strong>Giải thích:</strong> Tác giả nói rằng chúng ta có thể được bảo ngừng làm việc đó, HOẶC (or) chúng ta tự quan sát thấy người khác không có thói quen đó rồi dần dần từ bỏ. Việc dùng từ \"only\" (chỉ có thể) trong câu hỏi là mâu thuẫn với thông tin trong bài. Chọn NO."
                    },
                    {
                        id: 3,
                        text: "<strong>[3]</strong> Bad habits may return when we are under pressure.",
                        type: "text",
                        correct: "YES",
                        explanation: "<strong>Từ khóa:</strong> return, under pressure.<br><br><strong>Trong bài (Đoạn 3):</strong> \"...it is the old ways that tend to win, especially in situations where we are rushed, stressed or overworked. Habits that we thought we had got rid of can suddenly come back.\"<br><br><strong>Giải thích:</strong> Cụm từ \"under pressure\" tương đương với \"rushed, stressed or overworked\". Tác giả khẳng định rằng trong những tình huống này, thói quen cũ có thể đột nhiên quay trở lại (suddenly come back). Chọn YES."
                    },
                    {
                        id: 4,
                        text: "<strong>[4]</strong> Researchers were surprised by the answers that the volunteers gave in the first test.",
                        type: "text",
                        correct: "NO",
                        explanation: "<strong>Từ khóa:</strong> surprised, answers, first test.<br><br><strong>Trong bài (Đoạn 4):</strong> \"It came as no surprise that their answers were split between the first set of words and the second.\"<br><br><strong>Giải thích:</strong> Bài đọc ghi rõ \"It came as no surprise\" (Không có gì đáng ngạc nhiên) đối với các câu trả lời ở bài kiểm tra đầu tiên. Điều này hoàn toàn trái ngược với từ \"surprised\" (ngạc nhiên) trong câu hỏi. Chọn NO."
                    },
                    {
                        id: 5,
                        text: "<strong>[5]</strong> The volunteers found the test more difficult when they did it the second time.",
                        type: "text",
                        correct: "NOT GIVEN",
                        explanation: "<strong>Từ khóa:</strong> test more difficult, second time.<br><br><strong>Trong bài (Đoạn 4):</strong> \"Two weeks later, they were given the same test again. This time, most of them only gave the first set of words.\"<br><br><strong>Giải thích:</strong> Bài đọc có mô tả về kết quả của bài test thứ hai (người tham gia chỉ đưa ra nhóm từ đầu tiên). Tuy nhiên, không có bất kỳ thông tin nào đề cập đến việc người tham gia có cảm thấy bài test \"khó hơn\" (more difficult) hay không. Do đó chọn NOT GIVEN."
                    },
                    {
                        id: 6,
                        text: "<strong>[6]</strong> People find it more difficult to remember things they learnt when they were young.",
                        type: "text",
                        correct: "NO",
                        explanation: "<strong>Từ khóa:</strong> more difficult to remember, learnt when they were young.<br><br><strong>Trong bài (Đoạn 5):</strong> \"The study confirms that the responses we learn first are those that remain strongest over time.\"<br><br><strong>Giải thích:</strong> Bài đọc khẳng định những thứ chúng ta học đầu tiên (learn first - thường là khi còn trẻ) sẽ tồn tại mạnh mẽ nhất theo thời gian. Nghĩa là chúng rất dễ nhớ, chứ không phải \"more difficult to remember\" (khó nhớ hơn). Chọn NO."
                    },
                    {
                        id: 7,
                        text: "<strong>[7]</strong> If we develop bad habits early in life, they are harder to get rid of.",
                        type: "text",
                        correct: "YES",
                        explanation: "<strong>Từ khóa:</strong> early in life, harder to get rid of.<br><br><strong>Trong bài (Đoạn 6):</strong> \"This is not good news for people who picked up bad habits early in life and now want to change or break them... those previously learned habits remain stronger...\"<br><br><strong>Giải thích:</strong> Bài đọc kết luận rằng những người hình thành thói quen xấu từ sớm sẽ gặp khó khăn để thay đổi chúng, vì những thói quen học từ trước luôn mạnh mẽ hơn (remain stronger). Khẳng định này trùng khớp với câu hỏi. Chọn YES."
                    }
                ]
            }
        ];

        const state = {
            answers: {},
            isSubmitted: false,
            score: 0,
            incorrectIds: [],
            startTime: Date.now(),
            endTime: null,
            submitTime: null,
            currentPartIndex: 0,
            showPassageTranslation: false,
            expandedExplanations: {},
            expandedNotes: {},
            showResetConfirm: false,
            hasCapturedScreenshot: false,
            showCompletedModal: false,
            notes: {},
            formattedPassage: null,
            formattedPassageTrans: null,
            formattedQuestions: {}
        };

        const totalQuestions = quizData.reduce((acc, curr) => acc + curr.questions.length, 0);
        const allQuestions = quizData.flatMap(s => s.questions);

        // Lưu lại format HTML trước khi re-render
        window.saveFormatting = () => {
            const passageEl = document.getElementById('passage-content');
            if (passageEl) {
                if (state.showPassageTranslation) {
                    state.formattedPassageTrans = passageEl.innerHTML;
                } else {
                    state.formattedPassage = passageEl.innerHTML;
                }
            }
            allQuestions.forEach(q => {
                const qEl = document.getElementById(`q-text-${q.id}`);
                if (qEl) {
                    state.formattedQuestions[q.id] = qEl.innerHTML;
                }
            });
        };

        window.formatText = (command, value = null) => {
            const targets = document.querySelectorAll('.format-target');
            targets.forEach(t => t.setAttribute('contenteditable', 'true'));

            document.execCommand(command, false, value);

            targets.forEach(t => t.setAttribute('contenteditable', 'false'));
            saveFormatting();
        };

        window.handleNoteChange = (qId, val) => {
            state.notes[qId] = val;
        };

        window.generateInputHtml = (q, isAnswered, isCorrect, userAnswer) => {
            let inputClass = `inline-block w-[115px] md:w-[130px] px-1 py-1 mx-1 border-2 rounded-md focus:outline-none focus:ring-2 transition-all font-bold text-slate-800 cursor-pointer text-[13px] shadow-sm `;
            let feedbackIcon = '';

            const showFeedback = state.isSubmitted && state.hasCapturedScreenshot;

            if (!state.isSubmitted) {
                inputClass += isAnswered ? 'border-indigo-500 bg-indigo-50 text-indigo-700 focus:ring-indigo-200' : 'border-slate-300 bg-white focus:border-indigo-500 focus:ring-indigo-200';
            } else if (!showFeedback) {
                inputClass += 'border-slate-300 bg-slate-100 text-slate-500 cursor-not-allowed';
            } else {
                if (isCorrect) {
                    inputClass += 'border-green-500 bg-green-50 text-green-700';
                    feedbackIcon = `<i class="fa-solid fa-circle-check text-green-500 text-lg absolute -right-6 top-1/2 mt-0.5 -translate-y-1/2"></i>`;
                } else {
                    inputClass += 'border-red-500 bg-red-50 text-red-700';
                    feedbackIcon = `<i class="fa-solid fa-circle-xmark text-red-500 text-lg absolute -right-6 top-1/2 mt-0.5 -translate-y-1/2"></i>`;
                }
            }

            let normalizedUserAns = userAnswer.trim().toUpperCase();

            // Cập nhật tuỳ chọn sang YES / NO / NOT GIVEN
            const options = [
                { value: "", label: "-- Chọn --" },
                { value: "YES", label: "YES" },
                { value: "NO", label: "NO" },
                { value: "NOT GIVEN", label: "NOT GIVEN" }
            ];

            const optionsHtml = options.map(opt =>
                `<option value="${opt.value}" ${normalizedUserAns === opt.value ? 'selected' : ''}>${opt.label}</option>`
            ).join('');

            return `
                <span class="font-bold text-indigo-700 mr-1 hidden">[${q.id}]</span>
                <select 
                    class="${inputClass}" 
                    style="text-align-last: center;"
                    ${state.isSubmitted ? 'disabled' : ''}
                    onchange="handleInputChange(${q.id}, this.value)"
                >
                    ${optionsHtml}
                </select>
                ${feedbackIcon}
            `;
        };

        window.restoreInputs = () => {
            allQuestions.forEach(q => {
                const wrapper = document.getElementById(`input-wrap-${q.id}`);
                if (wrapper) {
                    const userAnswer = state.answers[q.id] || '';
                    const isAnswered = userAnswer.trim() !== '';
                    const isCorrect = state.isSubmitted && (userAnswer.trim().toUpperCase() === q.correct.toUpperCase());
                    wrapper.innerHTML = window.generateInputHtml(q, isAnswered, isCorrect, userAnswer);
                }
            });
        };

        function renderApp() {
            const app = document.getElementById('app');
            const answeredCount = Object.keys(state.answers).filter(k => state.answers[k].toString().trim() !== '').length;
            const currentSection = quizData[state.currentPartIndex];

            const qContainer = document.getElementById('questions-container');
            const scrollPos = qContainer ? qContainer.scrollTop : 0;

            let timeStr = "";
            let dateStr = "";
            if (state.isSubmitted && state.submitTime) {
                const totalSeconds = Math.floor((state.endTime - state.startTime) / 1000);
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                timeStr = `${minutes} phút ${seconds} giây`;

                const d = state.submitTime;
                const hours = String(d.getHours()).padStart(2, '0');
                const mins = String(d.getMinutes()).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const year = d.getFullYear();
                dateStr = `${hours}:${mins} - ${day}/${month}/${year}`;
            }

            let passageHtml = state.showPassageTranslation
                ? (state.formattedPassageTrans || currentSection.passageTranslation)
                : (state.formattedPassage || currentSection.passage);

            let html = `
                <!-- Header -->
                <div id="main-header" class="flex-none bg-white border-b border-slate-200 shadow-sm px-4 py-3 flex justify-between items-center z-30">
                    <div>
                        <h1 class="text-xl font-bold text-indigo-700 flex items-center gap-2">
                            <i class="fa-brands fa-discourse text-indigo-600"></i>
                            IELTS READING PRACTICE
                        </h1>
                        <p class="text-sm text-slate-500">Mô phỏng đề thi IELTS Reading</p>
                    </div>
                    ${!state.isSubmitted ? `
                    <div id="progress-text-container" class="text-sm font-medium bg-indigo-50 text-indigo-800 px-3 py-1 rounded-full border border-indigo-200 hidden md:block">
                        <span id="progress-text">Đã làm: ${answeredCount} / ${totalQuestions}</span>
                    </div>
                    ` : `
                    <div class="text-sm font-bold bg-green-100 text-green-800 px-4 py-2 rounded-full border border-green-300 flex items-center gap-2">
                        <i class="fa-solid fa-award"></i> Điểm: ${state.score} / ${totalQuestions}
                    </div>
                    `}
                </div>

                <!-- Main Body -->
                <div class="flex-1 flex flex-col min-h-0 w-full max-w-[1600px] mx-auto px-2 md:px-6 py-1.5 md:py-2 gap-2">
                    
                    ${state.isSubmitted && state.hasCapturedScreenshot ? `
                    <div class="flex-none bg-white p-5 md:p-6 rounded-xl border border-green-200 shadow-sm animate-in fade-in duration-500 mb-2">
                        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-6">
                            <div class="flex items-center gap-4">
                                <i class="fa-solid fa-circle-check text-green-500 text-4xl md:text-5xl"></i>
                                <div>
                                    <h2 class="text-xl md:text-2xl font-bold text-slate-800">Hoàn thành bài thi!</h2>

            let notesHtml = `
                <div class="absolute top-3 right-3 z-10 flex flex-col items-end">
                    <button onclick="toggleNote(${q.id})" class="text-slate-400 hover:text-amber-500 transition-colors p-1.5 rounded-md hover:bg-slate-100 relative" title="Ghi chú của giáo viên">
                        <i class="fa-solid fa-comment-dots text-xl ${hasNote ? 'text-amber-500' : ''}"></i>
                        ${hasNote ? '<span class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 border-2 border-white rounded-full"></span>' : ''}
                    </button>
                    
                    ${showNote ? `
                    <div class="mt-2 bg-amber-50 border border-amber-200 rounded-xl p-3 shadow-xl w-64 md:w-80 relative animate-in fade-in slide-in-from-top-2 duration-200 z-50">
                        <div class="absolute -top-2 right-3 w-4 h-4 bg-amber-50 border-t border-l border-amber-200 transform rotate-45"></div>
                        <div class="relative z-10">
                            <div class="text-xs font-bold text-amber-800 mb-2 flex items-center justify-between uppercase tracking-wider">
                                <span><i class="fa-solid fa-pen-clip mr-1"></i> Ghi chú riêng</span>
                                <button onclick="toggleNote(${q.id})" class="text-amber-600 hover:text-amber-800 bg-amber-100 hover:bg-amber-200 rounded-full w-5 h-5 flex items-center justify-center transition-colors"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                            <textarea 
                                class="w-full bg-white border border-amber-300 rounded p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 min-h-[90px] custom-scrollbar text-slate-700 transition-all shadow-inner" 
                                placeholder="Nhập ghi chú, phân tích câu hỏi tại đây..."
                                oninput="handleNoteChange(${q.id}, this.value)"
                            >${state.notes[q.id] || ''}</textarea>
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;

            let headingHtml = q.heading ? `
                <div class="${idx !== 0 ? 'mt-8' : ''} mb-4 format-target" contenteditable="false">
                    <h3 class="text-[17px] font-bold text-slate-800 border-b-2 border-indigo-100 pb-2 outline-none">${q.heading}</h3>
                </div>
            ` : '';

            let rawText = "";
            if (state.formattedQuestions[q.id]) {
                rawText = state.formattedQuestions[q.id];
            } else {
                const regex = new RegExp(`<strong>\\[${q.id}\\]<\\/strong>|\\[${q.id}\\]`);
                rawText = q.text.replace(regex, `<span id="input-wrap-${q.id}" class="relative inline-block align-middle whitespace-nowrap mx-1" contenteditable="false"></span>`);
            }

            let questionTextHtml = `
                <div class="flex items-start gap-2.5 md:gap-3 pr-8">
                    <div class="mt-2 w-1.5 h-1.5 rounded-full bg-slate-500 shrink-0 mt-1.5"></div>
                    <div id="q-text-${q.id}" class="format-target text-slate-800 mb-0 text-[15px] md:text-base leading-relaxed text-justify w-full outline-none focus:outline-none" contenteditable="false">
                        ${rawText}
                    </div>
                </div>
            `;

            return `
                ${headingHtml}
                <div id="question-${q.id}" class="${containerClass}">
                    <div class="w-full">
                        ${questionTextHtml}
                        ${errorHtml}
                        ${explanationHtml}
                        ${notesHtml}
                    </div>
                </div>
            `;
        }

        window.updateProgress = () => {
            const answeredCount = Object.keys(state.answers).filter(k => state.answers[k].toString().trim() !== '').length;

            const progressText = document.getElementById('progress-text');
            if (progressText) progressText.innerText = `Đã làm: ${answeredCount} / ${totalQuestions}`;

            const submitBtnMain = document.getElementById('submit-btn-main');
            const submitBtnNav = document.getElementById('submit-btn-nav');

            if (answeredCount > 0) {
                if (submitBtnMain) {
                    submitBtnMain.disabled = false;
                    submitBtnMain.className = "px-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition-all flex items-center gap-2 text-lg";
                }
                if (submitBtnNav) {
                    submitBtnNav.disabled = false;
                    submitBtnNav.className = "px-4 py-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs md:text-sm font-bold rounded shadow transition-colors";
                }
            } else {
                if (submitBtnMain) {
                    submitBtnMain.disabled = true;
                    submitBtnMain.className = "opacity-50 px-8 py-3.5 bg-indigo-600 text-white font-bold rounded-xl shadow-lg flex items-center gap-2 text-lg cursor-not-allowed";
                }
                if (submitBtnNav) {
                    submitBtnNav.disabled = true;
                    submitBtnNav.className = "opacity-50 px-4 py-1 bg-indigo-600 text-white text-xs md:text-sm font-bold rounded shadow cursor-not-allowed";
                }
            }

            allQuestions.forEach(q => {
                const btn = document.getElementById(`nav-btn-${q.id}`);
                const isAnswered = state.answers[q.id] && state.answers[q.id].toString().trim() !== '';

                if (btn && !state.isSubmitted) {
                    btn.className = isAnswered
                        ? "shrink-0 w-7 h-7 md:w-8 md:h-8 rounded text-xs md:text-sm font-bold flex items-center justify-center transition-all border cursor-pointer bg-indigo-600 text-white border-indigo-600 shadow-sm"
                        : "shrink-0 w-7 h-7 md:w-8 md:h-8 rounded text-xs md:text-sm font-bold flex items-center justify-center transition-all border cursor-pointer bg-slate-50 text-slate-600 border-slate-300 hover:bg-slate-200";
                }

                const wrapper = document.getElementById(`input-wrap-${q.id}`);
                if (wrapper) {
                    const inputEl = wrapper.querySelector('select');
                    if (inputEl && !state.isSubmitted) {
                        if (isAnswered) {
                            inputEl.className = "inline-block w-[115px] md:w-[130px] px-1 py-1 mx-1 border-2 rounded-md focus:outline-none focus:ring-2 transition-all font-bold text-slate-800 cursor-pointer text-[13px] shadow-sm border-indigo-500 bg-indigo-50 text-indigo-700 focus:ring-indigo-200";
                        } else {
                            inputEl.className = "inline-block w-[115px] md:w-[130px] px-1 py-1 mx-1 border-2 rounded-md focus:outline-none focus:ring-2 transition-all font-bold text-slate-800 cursor-pointer text-[13px] shadow-sm border-slate-300 bg-white focus:border-indigo-500 focus:ring-indigo-200";
                        }
                    }
                }

                const container = document.getElementById(`question-${q.id}`);
                if (container && !state.isSubmitted) {
                    container.className = `p-4 md:p-5 rounded-xl border transition-all ${isAnswered ? 'bg-slate-50 border-indigo-200' : 'bg-white border-slate-200 hover:border-slate-300'}`;
                }
            });
        };

        window.handleInputChange = (qId, val) => {
            if (state.isSubmitted) return;
            state.answers[qId] = val;
            updateProgress();
        };

        window.calculateScore = () => {
            saveFormatting();
            let currentScore = 0;
            let incorrectIds = [];
            quizData.forEach(section => {
                section.questions.forEach(q => {
                    const userAnswer = (state.answers[q.id] || "").toString().trim().toUpperCase();
                    const correctAnswer = q.correct.toString().trim().toUpperCase();
                    if (userAnswer === correctAnswer) {
                        currentScore += 1;
                    } else {
                        incorrectIds.push(q.id);
                    }
                });
            });
            state.score = currentScore;
            state.incorrectIds = incorrectIds;
            state.endTime = Date.now();
            state.submitTime = new Date();
            state.isSubmitted = true;
            state.showCompletedModal = true;
            renderApp();
        };

        window.captureAndReveal = () => {
            const captureArea = document.getElementById('capture-area');
            const btn = document.getElementById('capture-btn');
            const btnText = document.getElementById('capture-btn-text');

            if (!captureArea || !btn) return;

            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            const originalText = btnText.innerText;
            btnText.innerText = 'Đang xử lý...';

            setTimeout(() => {
                html2canvas(captureArea, {
                    scale: 3,
                    backgroundColor: '#ffffff',
                    useCORS: true,
                    logging: false,
                    onclone: function (clonedDoc) {
                        const clonedBtnText = clonedDoc.getElementById('capture-btn-text');
                        const clonedBtn = clonedDoc.getElementById('capture-btn');
                        if (clonedBtnText) clonedBtnText.innerText = originalText;
                        if (clonedBtn) {
                            clonedBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                            clonedBtn.style.opacity = '1';
                        }

                        const clonedArea = clonedDoc.getElementById('capture-area');
                        if (clonedArea) {
                            clonedArea.style.transform = 'none';
                            clonedArea.style.boxShadow = 'none';
                            clonedArea.style.border = 'none';
                        }

                        const clonedTitleBox = clonedDoc.getElementById('title-box');
                        if (clonedTitleBox) {
                            clonedTitleBox.style.border = 'none';
                            clonedTitleBox.style.background = 'transparent';
                            clonedTitleBox.style.boxShadow = 'none';
                            clonedTitleBox.style.padding = '0';
                        }

                        const clonedStatsBox = clonedDoc.getElementById('stats-box');
                        if (clonedStatsBox) {
                            clonedStatsBox.style.border = 'none';
                            clonedStatsBox.style.background = 'transparent';
                            clonedStatsBox.style.boxShadow = 'none';
                        }

                        const clonedWrongBox = clonedDoc.getElementById('wrong-answers-box');
                        if (clonedWrongBox) {
                            clonedWrongBox.style.border = 'none';
                            clonedWrongBox.style.background = 'transparent';
                            clonedWrongBox.style.boxShadow = 'none';
                        }

                        const valueBoxes = clonedDoc.querySelectorAll('.value-box, .wrong-q-box');
                        valueBoxes.forEach(box => {
                            box.style.border = 'none';
                            box.style.background = 'transparent';
                            box.style.boxShadow = 'none';
                            box.style.padding = '0';
                            box.style.margin = '0';

                            if (box.classList.contains('wrong-q-box')) {
                                box.style.marginRight = '10px';
                                box.style.color = '#dc2626';
                            } else {
                                box.style.color = '#1e293b';
                            }
                        });
                    }
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `Ket_qua_IELTS_Reading_${new Date().getTime()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    state.hasCapturedScreenshot = true;
                    state.showCompletedModal = false;
                    renderApp();

                }).catch(err => {
                    console.error("Lỗi khi chụp ảnh:", err);
                    alert("Có lỗi xảy ra khi lưu ảnh. Bạn có thể xem đáp án ngay.");
                    state.hasCapturedScreenshot = true;
                    state.showCompletedModal = false;
                    renderApp();
                });
            }, 50);
        };

        window.resetQuiz = () => {
            state.showResetConfirm = true;
            renderApp();
        };

        window.cancelReset = () => {
            state.showResetConfirm = false;
            renderApp();
        };

        window.confirmReset = () => {
            state.answers = {};
            state.isSubmitted = false;
            state.score = 0;
            state.incorrectIds = [];
            state.startTime = Date.now();
            state.endTime = null;
            state.submitTime = null;
            state.expandedExplanations = {};
            state.showResetConfirm = false;
            state.hasCapturedScreenshot = false;
            state.showCompletedModal = false;
            state.notes = {};
            state.formattedPassage = null;
            state.formattedPassageTrans = null;
            state.formattedQuestions = {};

            renderApp();
        };

        window.togglePassageTranslation = () => {
            saveFormatting();
            state.showPassageTranslation = !state.showPassageTranslation;
            renderApp();
        };

        window.toggleExplanation = (qId) => {
            saveFormatting();
            state.expandedExplanations[qId] = !state.expandedExplanations[qId];
            renderApp();
        };

        window.toggleNote = (qId) => {
            saveFormatting();
            state.expandedNotes[qId] = !state.expandedNotes[qId];
            renderApp();
        };

        window.performScroll = (id) => {
            const container = document.getElementById('questions-container');
            const el = document.getElementById(`question-${id}`);

            if (container && el) {
                const containerTop = container.getBoundingClientRect().top;
                const elTop = el.getBoundingClientRect().top;
                const currentScroll = container.scrollTop;
                const targetScroll = currentScroll + (elTop - containerTop) - 20;

                container.scrollTo({ top: targetScroll, behavior: "smooth" });

                const wrapper = document.getElementById(`input-wrap-${id}`);
                if (wrapper) {
                    const inputEl = wrapper.querySelector('select');
                    if (inputEl) {
                        inputEl.focus();
                        inputEl.classList.add('bg-indigo-100', 'border-indigo-500');
                        setTimeout(() => inputEl.classList.remove('bg-indigo-100', 'border-indigo-500'), 1000);
                    }
                }
            }
        };

        window.scrollToQuestion = (id) => {
            performScroll(id);
        };

        // Start Application
        renderApp();

    </script>
</body>

</html>
