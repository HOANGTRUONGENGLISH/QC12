</head>

<body class="h-screen flex flex-col bg-slate-100 text-slate-800 font-sans overflow-hidden">

    <div id="app" class="flex flex-col h-full w-full relative"></div>

    <script>
        const quizData = [
            {
                title: "Summary Completion - Fighting fear using virtual reality",
                instruction: "Complete the summary using the list of words and phrases, A–J, below.",
                passage: "<h2 class='text-xl md:text-2xl font-bold text-slate-900 mb-2'>Fighting fear using virtual reality</h2><h3 class='text-lg font-medium text-slate-700 mb-4 italic'>Computers are not just for entertainment, shopping or research purposes – as one woman found out when she tried to cure her fears</h3><p class='mb-4'>Most people have at least one thing they are afraid of. A fear of things like snakes, spiders, dogs, heights or open spaces affects over 90% of the population. In extreme cases, a fear can develop into a phobia, where the fear of something is so powerful it can affect the way the sufferer lives their life. About 10% of people suffer from a phobia. Most sufferers never seek treatment, because the most common type of cure – ‘exposure therapy’ – involves them being exposed to the object of their fear, and this is the last thing many of them are prepared to do.</p><p class='mb-4'>There is now a new cure for phobias, using something called virtual reality exposure therapy (VRET). The concept is simple. The person with the phobia wears a virtual reality headset. A computer, controlled by a therapist, then simulates a variety of situations in which the sufferer is gradually exposed to the object of their fear, which they view on the headset’s screen. At the same time, the therapist explains why they should not be afraid of it. The technique is surprisingly successful, as this case demonstrates.</p><p class='mb-4'>Sara Considine had a serious spider phobia, and had developed several spider-related behaviour patterns. Before going to bed, for example, she would check her room for spiders, then seal the windows with tape so none could get in. She had frightening dreams about spiders every night. Eventually, she decided to get treatment.</p><p class='mb-4'>During twelve one-hour virtual reality sessions over a three-month period, Ms Considine started very slowly. First, she stood a long way from the virtual spider and just looked at it. Slowly, she moved a little closer. The therapist controlling the computer programme then made the virtual spider move. After just two sessions, Ms Considine reported that although she still saw spiders in her dreams, they were no longer frightening, and she had even managed to have an amusing ‘conversation’ with one of them. A few sessions later, the therapist encouraged her to hold the virtual spider in her virtual hand, and put it in places where the presence of a real spider would cause her fear. The next stage was to introduce touch. A large toy spider was placed next to her. Ms Considine then reached out to touch the virtual spider she could see on the screen, and at the same time her real hand touched the toy spider.</p><p class='mb-4'>After her sessions were over, Sara Considine was able to stop her spider-related behaviour. She even took up camping, something she would never have considered before therapy. More recently she has appeared on a television nature programme, where for the first time she was able to hold a real spider in her hands.</p>",
                passageTranslation: "<h2 class='text-xl md:text-2xl font-bold text-slate-900 mb-2'>Chống lại nỗi sợ hãi bằng thực tế ảo</h2><h3 class='text-lg font-medium text-slate-700 mb-4 italic'>Máy tính không chỉ dành cho mục đích giải trí, mua sắm hay nghiên cứu – như một người phụ nữ đã nhận ra khi cô cố gắng chữa trị nỗi sợ hãi của mình</h3><p class='mb-4'>Hầu hết mọi người đều có ít nhất một thứ mà họ sợ hãi. Nỗi sợ những thứ như rắn, nhện, chó, độ cao hoặc không gian mở ảnh hưởng đến hơn 90% dân số. Trong những trường hợp cực đoan, nỗi sợ hãi có thể phát triển thành hội chứng ám ảnh sợ hãi (phobia), nơi nỗi sợ một thứ gì đó mạnh mẽ đến mức nó có thể ảnh hưởng đến cách người bệnh sống cuộc đời của họ. Khoảng 10% mọi người mắc phải hội chứng này. Hầu hết những người mắc bệnh không bao giờ tìm kiếm sự điều trị, bởi vì loại cách chữa phổ biến nhất – 'liệu pháp tiếp xúc' – đòi hỏi họ phải tiếp xúc với đối tượng gây sợ hãi, và đây là điều cuối cùng mà nhiều người trong số họ sẵn sàng làm.</p><p class='mb-4'>Hiện nay đã có một cách chữa trị mới cho hội chứng ám ảnh sợ hãi, sử dụng một phương pháp gọi là liệu pháp tiếp xúc thực tế ảo (VRET). Khái niệm này rất đơn giản. Người mắc chứng ám ảnh sẽ đeo một bộ kính thực tế ảo. Một máy tính, được điều khiển bởi bác sĩ trị liệu, sau đó mô phỏng nhiều tình huống khác nhau, trong đó người bệnh dần dần được tiếp xúc với đối tượng mà họ sợ hãi, thông qua việc nhìn trên màn hình của kính. Cùng lúc đó, bác sĩ trị liệu giải thích tại sao họ không nên sợ nó. Kỹ thuật này thành công đáng ngạc nhiên, như trường hợp dưới đây minh chứng.</p><p class='mb-4'>Sara Considine mắc chứng sợ nhện nghiêm trọng và đã hình thành một số kiểu hành vi liên quan đến nhện. Ví dụ, trước khi đi ngủ, cô sẽ kiểm tra phòng xem có nhện không, sau đó dùng băng dính bịt kín các cửa sổ để không con nào lọt vào được. Đêm nào cô cũng có những giấc mơ đáng sợ về nhện. Cuối cùng, cô quyết định đi điều trị.</p><p class='mb-4'>Trong 12 buổi thực tế ảo, mỗi buổi kéo dài một giờ trong khoảng thời gian ba tháng, cô Considine bắt đầu rất chậm rãi. Đầu tiên, cô đứng cách xa con nhện ảo và chỉ nhìn nó. Từ từ, cô tiến lại gần hơn một chút. Bác sĩ trị liệu điều khiển chương trình máy tính sau đó làm cho con nhện ảo di chuyển. Chỉ sau hai buổi, cô Considine báo cáo rằng mặc dù cô vẫn nhìn thấy nhện trong giấc mơ, nhưng chúng không còn đáng sợ nữa, và cô thậm chí còn có một 'cuộc trò chuyện' thú vị với một trong số chúng. Vài buổi sau đó, bác sĩ trị liệu khuyến khích cô giữ con nhện ảo trong bàn tay ảo của mình, và đặt nó ở những nơi mà sự hiện diện của một con nhện thật sẽ gây ra nỗi sợ hãi cho cô. Giai đoạn tiếp theo là giới thiệu sự tiếp xúc. Một con nhện đồ chơi lớn được đặt cạnh cô. Cô Considine sau đó đưa tay ra để chạm vào con nhện ảo mà cô có thể nhìn thấy trên màn hình, và cùng lúc đó bàn tay thật của cô chạm vào con nhện đồ chơi.</p><p class='mb-4'>Sau khi các buổi trị liệu kết thúc, Sara Considine đã có thể chấm dứt các hành vi liên quan đến nhện của mình. Cô thậm chí còn đi cắm trại, một việc mà cô chưa bao giờ nghĩ đến trước khi điều trị. Gần đây hơn, cô đã xuất hiện trên một chương trình truyền hình về thiên nhiên, nơi lần đầu tiên cô có thể cầm một con nhện thật trên tay.</p>",
                questions: [
                    {
                        id: 1,
                        heading: `
                  <div class="bg-indigo-50 border border-indigo-200 rounded-xl p-4 md:p-5 mb-6 shadow-sm">
                      <h4 class="text-indigo-800 font-bold mb-3 text-sm uppercase tracking-wide border-b border-indigo-200/50 pb-2"><i class="fa-solid fa-list-ul mr-2"></i>List of Words and Phrases</h4>
                      <div class="grid grid-cols-2 md:grid-cols-5 gap-3 text-[14px] font-medium text-slate-700">
                          <div class="bg-white px-3 py-1.5 rounded-md border border-indigo-100 shadow-sm"><strong class="text-indigo-600 mr-1.5">A</strong> afraid of</div>
                          <div class="bg-white px-3 py-1.5 rounded-md border border-indigo-100 shadow-sm"><strong class="text-indigo-600 mr-1.5">B</strong> amused by</div>
                          <div class="bg-white px-3 py-1.5 rounded-md border border-indigo-100 shadow-sm"><strong class="text-indigo-600 mr-1.5">C</strong> contact</div>
                          <div class="bg-white px-3 py-1.5 rounded-md border border-indigo-100 shadow-sm"><strong class="text-indigo-600 mr-1.5">D</strong> held</div>
                          <div class="bg-white px-3 py-1.5 rounded-md border border-indigo-100 shadow-sm"><strong class="text-indigo-600 mr-1.5">E</strong> observed</div>
                          <div class="bg-white px-3 py-1.5 rounded-md border border-indigo-100 shadow-sm"><strong class="text-indigo-600 mr-1.5">F</strong> quickly</div>
                          <div class="bg-white px-3 py-1.5 rounded-md border border-indigo-100 shadow-sm"><strong class="text-indigo-600 mr-1.5">G</strong> slowly</div>
                          <div class="bg-white px-3 py-1.5 rounded-md border border-indigo-100 shadow-sm"><strong class="text-indigo-600 mr-1.5">H</strong> touch</div>
                          <div class="bg-white px-3 py-1.5 rounded-md border border-indigo-100 shadow-sm"><strong class="text-indigo-600 mr-1.5">I</strong> three</div>
                          <div class="bg-white px-3 py-1.5 rounded-md border border-indigo-100 shadow-sm"><strong class="text-indigo-600 mr-1.5">J</strong> twelve</div>
                      </div>
                  </div>
                  <h3 class="text-[17px] font-bold text-slate-800 border-b-2 border-indigo-100 pb-2 mb-4 outline-none">Treating a phobia using VRET</h3>
                `,
                        text: "Sara Considine’s programme of treatments lasted for <strong>[1]</strong> months.",
                        type: "text",
                        correct: "I",
                        explanation: "<strong>Từ khóa:</strong> treatments lasted for, months.<br><br><strong>Trong bài (Đoạn 4):</strong> \"During twelve one-hour virtual reality sessions over a <strong>three</strong>-month period...\"<br><br><strong>Giải thích:</strong> Bài đọc nêu rõ chương trình điều trị kéo dài trong khoảng thời gian 3 tháng (three-month). Trong danh sách tùy chọn, từ 'three' tương ứng với đáp án <strong>I</strong>."
                    },
                    {
                        id: 2,
                        text: "At first, the sessions did not move very <strong>[2]</strong>,",
                        type: "text",
                        correct: "F",
                        explanation: "<strong>Từ khóa:</strong> At first, did not move very.<br><br><strong>Trong bài (Đoạn 4):</strong> \"...Ms Considine started very slowly.\"<br><br><strong>Giải thích:</strong> Bài đọc nói rằng các buổi trị liệu bắt đầu rất chậm (started very slowly). Cụm từ \"did not move very quickly\" (không tiến triển nhanh) mang ý nghĩa tương đương hoàn toàn. Từ 'quickly' tương ứng với đáp án <strong>F</strong>."
                    },
                    {
                        id: 3,
                        text: "...as she just <strong>[3]</strong> the virtual spider through her headset.",
                        type: "text",
                        correct: "E",
                        explanation: "<strong>Từ khóa:</strong> just, virtual spider, through her headset.<br><br><strong>Trong bài (Đoạn 4):</strong> \"First, she stood a long way from the virtual spider and just <strong>looked at</strong> it.\"<br><br><strong>Giải thích:</strong> Hành động 'looked at' (nhìn vào) mang ý nghĩa tương đương với 'observed' (quan sát). Trong danh sách tùy chọn, từ 'observed' tương ứng với đáp án <strong>E</strong>."
                    },
                    {
                        id: 4,
                        text: "It only took two sessions for her to stop being <strong>[4]</strong> the spiders in her dreams.",
                        type: "text",
                        correct: "A",
                        explanation: "<strong>Từ khóa:</strong> stop being, spiders in her dreams.<br><br><strong>Trong bài (Đoạn 4):</strong> \"After just two sessions... although she still saw spiders in her dreams, they were <strong>no longer frightening</strong>...\"<br><br><strong>Giải thích:</strong> Bài đọc ghi nhận lũ nhện 'không còn đáng sợ' (no longer frightening). Điều này đồng nghĩa với việc cô ấy 'ngừng cảm thấy sợ hãi' (stop being afraid of). Trong danh sách, cụm 'afraid of' tương ứng với đáp án <strong>A</strong>."
                    },
                    {
                        id: 5,
                        text: "After a while, she could hold the virtual spider in her virtual hand, and the next stage involved making physical <strong>[5]</strong> with a toy spider.",
                        type: "text",
                        correct: "C",
                        explanation: "<strong>Từ khóa:</strong> next stage, physical, toy spider.<br><br><strong>Trong bài (Đoạn 4):</strong> \"The next stage was to introduce touch. A large toy spider was placed next to her... her real hand <strong>touched</strong> the toy spider.\"<br><br><strong>Giải thích:</strong> Giai đoạn tiếp theo liên quan đến việc chạm vào đồ vật (introduce touch / touched). Việc chạm vào một con nhện đồ chơi thật tương đương với việc tạo ra 'sự tiếp xúc vật lý' (physical contact). Trong danh sách, từ 'contact' tương ứng với đáp án <strong>C</strong>. <em>(Lưu ý: Mặc dù có từ 'touch' ở đáp án H, nhưng cụm từ 'making physical contact' là sự kết hợp collocation tự nhiên và chuẩn xác nhất trong tiếng Anh cho ngữ cảnh này).</em>"
                    }
                ]
            }
        ];

        const state = {
            answers: {},
            isSubmitted: false,
            score: 0,
            incorrectIds: [],
            startTime: Date.now(),
            endTime: null,
            submitTime: null,
            currentPartIndex: 0,
            showPassageTranslation: false,
            expandedExplanations: {},
            expandedNotes: {},
            showResetConfirm: false,
            hasCapturedScreenshot: false,
            showCompletedModal: false,
            // Quản lý format và ghi chú
            notes: {},
            formattedPassage: null,
            formattedPassageTrans: null,
            formattedQuestions: {}
        };

        const totalQuestions = quizData.reduce((acc, curr) => acc + curr.questions.length, 0);
        const allQuestions = quizData.flatMap(s => s.questions);

        // Lưu lại format HTML trước khi re-render
        window.saveFormatting = () => {
            const passageEl = document.getElementById('passage-content');
            if (passageEl) {
                if (state.showPassageTranslation) {
                    state.formattedPassageTrans = passageEl.innerHTML;
                } else {
                    state.formattedPassage = passageEl.innerHTML;
                }
            }
            allQuestions.forEach(q => {
                const qEl = document.getElementById(`q-text-${q.id}`);
                if (qEl) {
                    state.formattedQuestions[q.id] = qEl.innerHTML;
                }
            });
        };

        // Hàm thực thi format (được gọi từ toolbar)
        window.formatText = (command, value = null) => {
            // Bật chế độ chỉnh sửa trong tíc tắc để áp dụng màu/format
            const targets = document.querySelectorAll('.format-target');
            targets.forEach(t => t.setAttribute('contenteditable', 'true'));

            document.execCommand(command, false, value);

            // Tắt ngay lập tức để khóa hoàn toàn khả năng gõ phím
            targets.forEach(t => t.setAttribute('contenteditable', 'false'));

            saveFormatting();
        };

        // Quản lý nhập Note
        window.handleNoteChange = (qId, val) => {
            state.notes[qId] = val;
        };

        window.generateInputHtml = (q, isAnswered, isCorrect, userAnswer) => {
            // Thay đổi width nhỏ gọn cho phù hợp với 1 ký tự (A-J)
            let inputClass = `inline-block w-[65px] md:w-[75px] px-1 py-1 mx-1 border-2 rounded-md focus:outline-none focus:ring-2 transition-all font-bold text-slate-800 cursor-pointer text-[14px] shadow-sm `;
            let feedbackIcon = '';

            const showFeedback = state.isSubmitted && state.hasCapturedScreenshot;

            if (!state.isSubmitted) {
                inputClass += isAnswered ? 'border-indigo-500 bg-indigo-50 text-indigo-700 focus:ring-indigo-200' : 'border-slate-300 bg-white focus:border-indigo-500 focus:ring-indigo-200';
            } else if (!showFeedback) {
                // Trạng thái đã nộp nhưng chưa chụp ảnh (chưa xem đáp án)
                inputClass += 'border-slate-300 bg-slate-100 text-slate-500 cursor-not-allowed';
            } else {
                // Trạng thái đã xem đáp án
                if (isCorrect) {
                    inputClass += 'border-green-500 bg-green-50 text-green-700';
                    feedbackIcon = `<i class="fa-solid fa-circle-check text-green-500 text-lg absolute -right-6 top-1/2 mt-0.5 -translate-y-1/2"></i>`;
                } else {
                    inputClass += 'border-red-500 bg-red-50 text-red-700';
                    feedbackIcon = `<i class="fa-solid fa-circle-xmark text-red-500 text-lg absolute -right-6 top-1/2 mt-0.5 -translate-y-1/2"></i>`;
                }
            }

            let normalizedUserAns = userAnswer.trim().toUpperCase();

            // Cập nhật tuỳ chọn cho dạng bài chọn đáp án A-J
            const options = [
                { value: "", label: "-" },
                { value: "A", label: "A" },
                { value: "B", label: "B" },
                { value: "C", label: "C" },
                { value: "D", label: "D" },
                { value: "E", label: "E" },
                { value: "F", label: "F" },
                { value: "G", label: "G" },
                { value: "H", label: "H" },
                { value: "I", label: "I" },
                { value: "J", label: "J" }
            ];

            const optionsHtml = options.map(opt =>
                `<option value="${opt.value}" ${normalizedUserAns === opt.value ? 'selected' : ''}>${opt.label}</option>`
            ).join('');

            return `
                <span class="font-bold text-indigo-700 mr-1 hidden">[${q.id}]</span>
                <select 
                    class="${inputClass}" 
                    style="text-align-last: center;"
                    ${state.isSubmitted ? 'disabled' : ''}
                    onchange="handleInputChange(${q.id}, this.value)"
                >
                    ${optionsHtml}
                </select>
                ${feedbackIcon}
            `;
        };

        window.restoreInputs = () => {
            allQuestions.forEach(q => {
                const wrapper = document.getElementById(`input-wrap-${q.id}`);
                if (wrapper) {
                    const userAnswer = state.answers[q.id] || '';
                    const isAnswered = userAnswer.trim() !== '';
                    const isCorrect = state.isSubmitted && userAnswer.toLowerCase().trim() === q.correct.toLowerCase().trim();
                    wrapper.innerHTML = window.generateInputHtml(q, isAnswered, isCorrect, userAnswer);
                }
            });
        };

        function renderApp() {
            const app = document.getElementById('app');
            const answeredCount = Object.keys(state.answers).filter(k => state.answers[k].toString().trim() !== '').length;
            const currentSection = quizData[state.currentPartIndex];

            // Lưu vị trí cuộn
            const qContainer = document.getElementById('questions-container');
            const scrollPos = qContainer ? qContainer.scrollTop : 0;

            // Tính toán thời gian
            let timeStr = "";
            let dateStr = "";
            if (state.isSubmitted && state.submitTime) {
                const totalSeconds = Math.floor((state.endTime - state.startTime) / 1000);
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                timeStr = `${minutes} phút ${seconds} giây`;

                const d = state.submitTime;
                const hours = String(d.getHours()).padStart(2, '0');
                const mins = String(d.getMinutes()).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const year = d.getFullYear();
                dateStr = `${hours}:${mins} - ${day}/${month}/${year}`;
            }

            let passageHtml = state.showPassageTranslation
                ? (state.formattedPassageTrans || currentSection.passageTranslation)
                : (state.formattedPassage || currentSection.passage);

            let html = `
                <!-- Header -->
                <div id="main-header" class="flex-none bg-white border-b border-slate-200 shadow-sm px-4 py-3 flex justify-between items-center z-30">
                    <div>
                        <h1 class="text-xl font-bold text-indigo-700 flex items-center gap-2">

            }

            let errorHtml = (showFeedback && !isCorrect) ? `
                <div class="mt-4 flex items-start gap-2 text-sm text-red-700 bg-red-100/60 p-3.5 rounded-lg border border-red-200">
                    <i class="fa-solid fa-circle-exclamation mt-0.5 text-lg"></i>
                    <div>
                        <p class="mb-1">Bạn đã trả lời sai hoặc để trống.</p>
                        <p>Đáp án đúng là: <strong class="text-base uppercase text-red-800 tracking-wider">${q.correct}</strong></p>
                    </div>
                </div>
            ` : '';

            let explanationHtml = '';
            if (showFeedback && q.explanation) {
                explanationHtml = `
                    <div class="mt-5 border-t border-slate-200/80 pt-4">
                        <button onclick="toggleExplanation(${q.id})" class="flex items-center gap-2 text-sm font-bold transition-colors ${showExp ? 'text-indigo-700' : 'text-indigo-600 hover:text-indigo-800'}">
                            <i class="fa-solid fa-book-open"></i>
                            ${showExp ? 'Ẩn giải thích' : 'Xem giải thích chi tiết'}
                            <i class="fa-solid ${showExp ? 'fa-chevron-up' : 'fa-chevron-down'} ml-1"></i>
                        </button>
                        
                        ${showExp ? `
                        <div class="mt-4 bg-indigo-50/70 p-4 md:p-5 rounded-xl border border-indigo-100 text-sm text-slate-800 shadow-inner">
                            <div class="whitespace-pre-wrap leading-relaxed text-justify">${q.explanation}</div>
                        </div>
                        ` : ''}
                    </div>
                `;
            }

            const showNote = state.expandedNotes[q.id];
            const hasNote = state.notes[q.id] && state.notes[q.id].trim() !== '';

            let notesHtml = `
                <div class="absolute top-3 right-3 z-10 flex flex-col items-end">
                    <button onclick="toggleNote(${q.id})" class="text-slate-400 hover:text-amber-500 transition-colors p-1.5 rounded-md hover:bg-slate-100 relative" title="Ghi chú của giáo viên">
                        <i class="fa-solid fa-comment-dots text-xl ${hasNote ? 'text-amber-500' : ''}"></i>
                        ${hasNote ? '<span class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 border-2 border-white rounded-full"></span>' : ''}
                    </button>
                    
                    ${showNote ? `
                    <div class="mt-2 bg-amber-50 border border-amber-200 rounded-xl p-3 shadow-xl w-64 md:w-80 relative animate-in fade-in slide-in-from-top-2 duration-200 z-50">
                        <div class="absolute -top-2 right-3 w-4 h-4 bg-amber-50 border-t border-l border-amber-200 transform rotate-45"></div>
                        <div class="relative z-10">
                            <div class="text-xs font-bold text-amber-800 mb-2 flex items-center justify-between uppercase tracking-wider">
                                <span><i class="fa-solid fa-pen-clip mr-1"></i> Ghi chú riêng</span>
                                <button onclick="toggleNote(${q.id})" class="text-amber-600 hover:text-amber-800 bg-amber-100 hover:bg-amber-200 rounded-full w-5 h-5 flex items-center justify-center transition-colors"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                            <textarea 
                                class="w-full bg-white border border-amber-300 rounded p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 min-h-[90px] custom-scrollbar text-slate-700 transition-all shadow-inner" 
                                placeholder="Nhập ghi chú, phân tích câu hỏi tại đây..."
                                oninput="handleNoteChange(${q.id}, this.value)"
                            >${state.notes[q.id] || ''}</textarea>
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;

            let headingHtml = q.heading ? `
                <div class="${idx !== 0 ? 'mt-8' : ''} mb-4 format-target" contenteditable="false">
                    ${q.heading}
                </div>
            ` : '';

            // Lồng Wrapper
            let rawText = "";
            if (state.formattedQuestions[q.id]) {
                rawText = state.formattedQuestions[q.id];
            } else {
                const regex = new RegExp(`<strong>\\[${q.id}\\]<\\/strong>|\\[${q.id}\\]`);
                rawText = q.text.replace(regex, `<span id="input-wrap-${q.id}" class="relative inline-block align-middle whitespace-nowrap" contenteditable="false"></span>`);
            }

            let questionTextHtml = `
                <div class="flex items-start gap-2.5 md:gap-3 pr-8">
                    <div class="mt-2 w-1.5 h-1.5 rounded-full bg-slate-500 shrink-0 mt-1.5"></div>
                    <div id="q-text-${q.id}" class="format-target text-slate-800 mb-0 text-[15px] md:text-base leading-relaxed text-justify w-full outline-none focus:outline-none" contenteditable="false">
                        ${rawText}
                    </div>
                </div>
            `;

            return `
                ${headingHtml}
                <div id="question-${q.id}" class="${containerClass}">
                    <div class="w-full">
                        ${questionTextHtml}
                        ${errorHtml}
                        ${explanationHtml}
                        ${notesHtml}
                    </div>
                </div>
            `;
        }

        window.updateProgress = () => {
            const answeredCount = Object.keys(state.answers).filter(k => state.answers[k].toString().trim() !== '').length;

            const progressText = document.getElementById('progress-text');
            if (progressText) progressText.innerText = `Đã làm: ${answeredCount} / ${totalQuestions}`;

            const submitBtnMain = document.getElementById('submit-btn-main');
            const submitBtnNav = document.getElementById('submit-btn-nav');

            if (answeredCount > 0) {
                if (submitBtnMain) {
                    submitBtnMain.disabled = false;
                    submitBtnMain.className = "px-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition-all flex items-center gap-2 text-lg";
                }
                if (submitBtnNav) {
                    submitBtnNav.disabled = false;
                    submitBtnNav.className = "px-4 py-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs md:text-sm font-bold rounded shadow transition-colors";
                }
            } else {
                if (submitBtnMain) {
                    submitBtnMain.disabled = true;
                    submitBtnMain.className = "opacity-50 px-8 py-3.5 bg-indigo-600 text-white font-bold rounded-xl shadow-lg flex items-center gap-2 text-lg cursor-not-allowed";
                }
                if (submitBtnNav) {
                    submitBtnNav.disabled = true;
                    submitBtnNav.className = "opacity-50 px-4 py-1 bg-indigo-600 text-white text-xs md:text-sm font-bold rounded shadow cursor-not-allowed";
                }
            }

            allQuestions.forEach(q => {
                const btn = document.getElementById(`nav-btn-${q.id}`);
                const isAnswered = state.answers[q.id] && state.answers[q.id].toString().trim() !== '';

                if (btn && !state.isSubmitted) {
                    btn.className = isAnswered
                        ? "shrink-0 w-7 h-7 md:w-8 md:h-8 rounded text-xs md:text-sm font-bold flex items-center justify-center transition-all border cursor-pointer bg-indigo-600 text-white border-indigo-600 shadow-sm"
                        : "shrink-0 w-7 h-7 md:w-8 md:h-8 rounded text-xs md:text-sm font-bold flex items-center justify-center transition-all border cursor-pointer bg-slate-50 text-slate-600 border-slate-300 hover:bg-slate-200";
                }

                const wrapper = document.getElementById(`input-wrap-${q.id}`);
                if (wrapper) {
                    const inputEl = wrapper.querySelector('select');
                    if (inputEl && !state.isSubmitted) {
                        if (isAnswered) {
                            inputEl.className = "inline-block w-[65px] md:w-[75px] px-1 py-1 mx-1 border-2 rounded-md focus:outline-none focus:ring-2 transition-all font-bold text-slate-800 cursor-pointer text-[14px] shadow-sm border-indigo-500 bg-indigo-50 text-indigo-700 focus:ring-indigo-200";
                        } else {
                            inputEl.className = "inline-block w-[65px] md:w-[75px] px-1 py-1 mx-1 border-2 rounded-md focus:outline-none focus:ring-2 transition-all font-bold text-slate-800 cursor-pointer text-[14px] shadow-sm border-slate-300 bg-white focus:border-indigo-500 focus:ring-indigo-200";
                        }
                    }
                }

                const container = document.getElementById(`question-${q.id}`);
                if (container && !state.isSubmitted) {
                    container.className = `p-4 md:p-5 rounded-xl border transition-all ${isAnswered ? 'bg-slate-50 border-indigo-200' : 'bg-white border-slate-200 hover:border-slate-300'}`;
                }
            });
        };

        window.handleInputChange = (qId, val) => {
            if (state.isSubmitted) return;
            state.answers[qId] = val;
            updateProgress();
        };

        window.calculateScore = () => {
            saveFormatting();
            let currentScore = 0;
            let incorrectIds = [];
            quizData.forEach(section => {
                section.questions.forEach(q => {
                    const userAnswer = (state.answers[q.id] || "").toString().toLowerCase().trim();
                    const correctAnswer = q.correct.toString().toLowerCase().trim();
                    if (userAnswer === correctAnswer) {
                        currentScore += 1;
                    } else {
                        incorrectIds.push(q.id);
                    }
                });
            });
            state.score = currentScore;
            state.incorrectIds = incorrectIds;
            state.endTime = Date.now();
            state.submitTime = new Date();
            state.isSubmitted = true;
            state.showCompletedModal = true;
            renderApp();
        };

        window.captureAndReveal = () => {
            const captureArea = document.getElementById('capture-area');
            const btn = document.getElementById('capture-btn');
            const btnText = document.getElementById('capture-btn-text');

            if (!captureArea || !btn) return;

            // Khoá nút bấm ngay lập tức nhưng CHỈ đổi text để tránh vỡ icon
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            const originalText = btnText.innerText;
            btnText.innerText = 'Đang xử lý...';

            setTimeout(() => {
                html2canvas(captureArea, {
                    scale: 3,
                    backgroundColor: '#ffffff',
                    useCORS: true,
                    logging: false,
                    onclone: function (clonedDoc) {
                        // Trả lại text gốc cho nút trong ảnh chụp
                        const clonedBtnText = clonedDoc.getElementById('capture-btn-text');
                        const clonedBtn = clonedDoc.getElementById('capture-btn');
                        if (clonedBtnText) clonedBtnText.innerText = originalText;
                        if (clonedBtn) {
                            clonedBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                            clonedBtn.style.opacity = '1';
                        }

                        // LOẠI BỎ TOÀN BỘ KHUNG, ĐƯỜNG VIỀN, BÓNG ĐỔ KHỎI HÌNH CHỤP

                        // 1. Viền ngoài cùng của Card
                        const clonedArea = clonedDoc.getElementById('capture-area');
                        if (clonedArea) {
                            clonedArea.style.transform = 'none';
                            clonedArea.style.boxShadow = 'none';
                            clonedArea.style.border = 'none';
                        }

                        // 2. Viền bọc tên bài thi
                        const clonedTitleBox = clonedDoc.getElementById('title-box');
                        if (clonedTitleBox) {
                            clonedTitleBox.style.border = 'none';
                            clonedTitleBox.style.background = 'transparent';
                            clonedTitleBox.style.boxShadow = 'none';
                            clonedTitleBox.style.padding = '0';
                        }

                        // 3. Viền bọc tất cả các thông số (stats)
                        const clonedStatsBox = clonedDoc.getElementById('stats-box');
                        if (clonedStatsBox) {
                            clonedStatsBox.style.border = 'none';
                            clonedStatsBox.style.background = 'transparent';
                            clonedStatsBox.style.boxShadow = 'none';
                        }

                        // 4. Viền bọc các câu sai
                        const clonedWrongBox = clonedDoc.getElementById('wrong-answers-box');
                        if (clonedWrongBox) {
                            clonedWrongBox.style.border = 'none';
                            clonedWrongBox.style.background = 'transparent';
                            clonedWrongBox.style.boxShadow = 'none';
                        }

                        // 5. Các viền bo vuông nhỏ ở từng chỉ số (Ngày giờ, Thời gian, Câu 1, Câu 2...)
                        const valueBoxes = clonedDoc.querySelectorAll('.value-box, .wrong-q-box');
                        valueBoxes.forEach(box => {
                            box.style.border = 'none';
                            box.style.background = 'transparent';
                            box.style.boxShadow = 'none';
                            // Xóa luôn padding để chữ biến thành văn bản liền mạch (flat text)
                            box.style.padding = '0';
                            box.style.margin = '0';

                            // Căn lại khoảng cách sau khi xoá hộp cho tự nhiên
                            if (box.classList.contains('wrong-q-box')) {
                                box.style.marginRight = '10px';
                                box.style.color = '#dc2626'; // Đỏ (đảm bảo không bị mất màu)
                            } else {
                                box.style.color = '#1e293b'; // Đen xám
                            }
                        });
                    }
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `Ket_qua_IELTS_Reading_${new Date().getTime()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    state.hasCapturedScreenshot = true;
                    state.showCompletedModal = false;
                    renderApp();

                }).catch(err => {
                    console.error("Lỗi khi chụp ảnh:", err);
                    alert("Có lỗi xảy ra khi lưu ảnh. Bạn có thể xem đáp án ngay.");
                    state.hasCapturedScreenshot = true;
                    state.showCompletedModal = false;
                    renderApp();
                });
            }, 50);
        };

        window.resetQuiz = () => {
            state.showResetConfirm = true;
            renderApp();
        };

        window.cancelReset = () => {
            state.showResetConfirm = false;
            renderApp();
        };

        window.confirmReset = () => {
            state.answers = {};
            state.isSubmitted = false;
            state.score = 0;
            state.incorrectIds = [];
            state.startTime = Date.now();
            state.endTime = null;
            state.submitTime = null;
            state.expandedExplanations = {};
            state.showResetConfirm = false;
            state.hasCapturedScreenshot = false;
            state.showCompletedModal = false;
            // Xoá định dạng & ghi chú
            state.notes = {};
            state.formattedPassage = null;
            state.formattedPassageTrans = null;
            state.formattedQuestions = {};

            renderApp();
        };

        window.togglePassageTranslation = () => {
            saveFormatting();
            state.showPassageTranslation = !state.showPassageTranslation;
            renderApp();
        };

        window.toggleExplanation = (qId) => {
            saveFormatting();
            state.expandedExplanations[qId] = !state.expandedExplanations[qId];
            renderApp();
        };

        window.toggleNote = (qId) => {
            saveFormatting();
            state.expandedNotes[qId] = !state.expandedNotes[qId];
            renderApp();
        };

        window.performScroll = (id) => {
            const container = document.getElementById('questions-container');
            const el = document.getElementById(`question-${id}`);

            if (container && el) {
                const containerTop = container.getBoundingClientRect().top;
                const elTop = el.getBoundingClientRect().top;
                const currentScroll = container.scrollTop;
                const targetScroll = currentScroll + (elTop - containerTop) - 20;

                container.scrollTo({ top: targetScroll, behavior: "smooth" });

                const wrapper = document.getElementById(`input-wrap-${id}`);
                if (wrapper) {
                    const inputEl = wrapper.querySelector('select');
                    if (inputEl) {
                        inputEl.focus();
                        inputEl.classList.add('bg-indigo-100', 'border-indigo-500');
                        setTimeout(() => inputEl.classList.remove('bg-indigo-100', 'border-indigo-500'), 1000);
                    }
                }
            }
        };

        window.scrollToQuestion = (id) => {
            performScroll(id);
        };

        // Start Application
        renderApp();

    </script>
</body>

</html>
