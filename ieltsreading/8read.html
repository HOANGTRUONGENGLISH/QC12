<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS READING - T/F/NG - THE VENICE CARNIVAL</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas cho tính năng chụp màn hình -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        #passage-container::-webkit-scrollbar,
        #questions-container::-webkit-scrollbar {
            width: 8px;
        }

        #passage-container::-webkit-scrollbar-track,
        #questions-container::-webkit-scrollbar-track {
            background: transparent;
        }

        #passage-container::-webkit-scrollbar-thumb,
        #questions-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
            border: 2px solid white;
        }

        /* Đảm bảo các thẻ định dạng văn bản hoạt động tốt cùng Tailwind */
        #app b,
        #app strong {
            font-weight: bolder;
        }

        #app i,
        #app em {
            font-style: italic;
        }

        #app u {
            text-decoration: underline;
        }

        #app strike,
        #app s {
            text-decoration: line-through;
        }
    </style>
</head>

<body class="h-screen flex flex-col bg-slate-100 text-slate-800 font-sans overflow-hidden">

    <div id="app" class="flex flex-col h-full w-full relative"></div>

    <script>
        const quizData = [
            {
                title: "IELTS READING - THE VENICE CARNIVAL",
                instruction: "Do these statements agree with the information given in the text?<br>Look at the statements and write:<br><strong>TRUE</strong> – if the statement agrees with the information<br><strong>FALSE</strong> – if the statement contradicts the information<br><strong>NOT GIVEN</strong> – if there is no information on this",
                passage: "<h2 class='text-xl md:text-2xl font-bold text-slate-900 mb-4'>The Venice Carnival</h2><p class='mb-4'>In January or February, Venice plays host to the most magical of carnivals. During the carnival, the city is filled with a mass of masked party-goers, posing and dancing, in an attempt to reinvent one of the great traditions of the city. Naturally, it is very crowded and hotels and restaurants are expensive, but it is a unique occasion and a great time to experience this beautiful city.</p><p class='mb-4'>The carnival was first held in Venice in the 11th century and lasted for over two months. Activities involved a series of formal parties in St Mark’s Square and playing games for money. Regardless of social status, participants wore costumes and masks. Images of the time and occasion are still displayed throughout the city today. During the 18th century, however, this period of festivities came to an end, and the carnival did not return until 1979. Today, the carnival is extremely popular with people eager to dress up and parade around the city in their masks and costumes.</p><p class='mb-4'>The weekends are the busiest times at the carnival – the final weekend in particular. During the festivities, you can enjoy live music and take part in a large open-air festival. Costumes are also a major feature of the occasion and there is even a competition to judge the best one. The best ones are usually displayed at the centre of carnival festivities, in the breathtaking St Mark’s Square. Numerous shops in Venice sell these costumes and masks in preparation for this great event.</p><p class='mb-4'>Perhaps the most attractive aspect of the Venice carnival, though, is the variety of masked balls and parties there are to attend. You do have to pay for these, however, and they can be quite costly. One of the most expensive parties is the Valentine’s Grand Masquerade Ball, held on February 14th at the Palazzo Flangini.</p>",
                passageTranslation: "<h2 class='text-xl md:text-2xl font-bold text-slate-900 mb-4'>Lễ hội hóa trang Venice</h2><p class='mb-4'>Vào tháng 1 hoặc tháng 2, Venice tổ chức lễ hội hóa trang kỳ diệu nhất. Trong suốt lễ hội, thành phố chật kín những người dự tiệc đeo mặt nạ, tạo dáng và khiêu vũ, trong một nỗ lực nhằm tái hiện một trong những truyền thống tuyệt vời của thành phố. Đương nhiên, nó rất đông đúc và các khách sạn cũng như nhà hàng đều đắt đỏ, nhưng đây là một dịp độc đáo và là khoảng thời gian tuyệt vời để trải nghiệm thành phố xinh đẹp này.</p><p class='mb-4'>Lễ hội hóa trang lần đầu tiên được tổ chức ở Venice vào thế kỷ 11 và kéo dài hơn hai tháng. Các hoạt động bao gồm một chuỗi các bữa tiệc trang trọng ở Quảng trường St Mark và chơi các trò chơi ăn tiền. Bất kể địa vị xã hội, những người tham gia đều mặc trang phục và đeo mặt nạ. Những hình ảnh về thời gian và sự kiện này vẫn được trưng bày khắp thành phố ngày nay. Tuy nhiên, vào thế kỷ 18, thời kỳ lễ hội này đã kết thúc, và lễ hội hóa trang đã không quay trở lại cho đến năm 1979. Ngày nay, lễ hội cực kỳ phổ biến với những người háo hức hóa trang và diễu hành quanh thành phố trong những chiếc mặt nạ và trang phục của họ.</p><p class='mb-4'>Những ngày cuối tuần là khoảng thời gian bận rộn nhất tại lễ hội – đặc biệt là ngày cuối tuần cuối cùng. Trong suốt lễ hội, bạn có thể thưởng thức nhạc sống và tham gia vào một lễ hội ngoài trời lớn. Trang phục cũng là một đặc điểm chính của dịp này và thậm chí còn có một cuộc thi để đánh giá trang phục đẹp nhất. Những trang phục đẹp nhất thường được trưng bày tại trung tâm của các hoạt động lễ hội, ở Quảng trường St Mark ngoạn mục. Rất nhiều cửa hàng ở Venice bán những trang phục và mặt nạ này để chuẩn bị cho sự kiện trọng đại này.</p><p class='mb-4'>Tuy nhiên, có lẽ khía cạnh hấp dẫn nhất của lễ hội hóa trang Venice là sự đa dạng của các buổi dạ vũ và bữa tiệc đeo mặt nạ để tham dự. Mặc dù vậy, bạn phải trả tiền cho những thứ này, và chúng có thể khá đắt. Một trong những bữa tiệc đắt đỏ nhất là Valentine’s Grand Masquerade Ball, được tổ chức vào ngày 14 tháng 2 tại Palazzo Flangini.</p>",
                questions: [
                    {
                        id: 1,
                        text: "<strong>[1]</strong> Before the 20th century, only the rich participated in the carnival.",
                        type: "text",
                        correct: "FALSE",
                        explanation: "<strong>Từ khóa:</strong> Before 20th century, only the rich.<br><br><strong>Trong bài (Đoạn 2):</strong> \"Regardless of social status, participants wore costumes and masks.\"<br><br><strong>Giải thích:</strong> Bài đọc đề cập ở đoạn 2 rằng \"Bất kể địa vị xã hội (Regardless of social status), những người tham gia đều mặc trang phục và đeo mặt nạ\", điều này mâu thuẫn hoàn toàn với nhận định chỉ người giàu mới tham gia. Do đó đáp án là FALSE."
                    },
                    {
                        id: 2,
                        text: "<strong>[2]</strong> The Venice carnival was banned in the 18th century.",
                        type: "text",
                        correct: "NOT GIVEN",
                        explanation: "<strong>Từ khóa:</strong> banned, 18th century.<br><br><strong>Trong bài (Đoạn 2):</strong> \"During the 18th century, however, this period of festivities came to an end...\"<br><br><strong>Giải thích:</strong> Bài đọc chỉ nói rằng vào thế kỷ 18, thời kỳ lễ hội này \"đã đi đến hồi kết\" (came to an end). Tác giả không hề cung cấp thông tin rằng nó bị chính quyền \"cấm\" (banned) hay tự lụi tàn. Do thiếu thông tin nên đáp án là NOT GIVEN."
                    },
                    {
                        id: 3,
                        text: "<strong>[3]</strong> The most popular days at the carnival are during the week.",
                        type: "text",
                        correct: "FALSE",
                        explanation: "<strong>Từ khóa:</strong> most popular days, during the week.<br><br><strong>Trong bài (Đoạn 3):</strong> \"The weekends are the busiest times at the carnival\"<br><br><strong>Giải thích:</strong> Bài đọc ghi rõ \"Cuối tuần là khoảng thời gian bận rộn/đông đúc nhất\" (The weekends are the busiest times), trái ngược hoàn toàn với nhận định là các ngày trong tuần (during the week). Vậy đáp án là FALSE."
                    },
                    {
                        id: 4,
                        text: "<strong>[4]</strong> None of the festivities take place outside.",
                        type: "text",
                        correct: "FALSE",
                        explanation: "<strong>Từ khóa:</strong> None, take place outside.<br><br><strong>Trong bài (Đoạn 3):</strong> \"...take part in a large open-air festival.\"<br><br><strong>Giải thích:</strong> Đoạn 3 có nhắc đến việc người tham gia có thể hòa mình vào \"lễ hội ngoài trời\" (open-air festival), nên câu nói \"không có hoạt động lễ hội nào diễn ra ngoài trời\" (None of the festivities take place outside) là thông tin Sai. Đáp án là FALSE."
                    },
                    {
                        id: 5,
                        text: "<strong>[5]</strong> There are few places in Venice where you can purchase your costume and mask.",
                        type: "text",
                        correct: "FALSE",
                        explanation: "<strong>Từ khóa:</strong> few places, purchase costume and mask.<br><br><strong>Trong bài (Đoạn 3):</strong> \"Numerous shops in Venice sell these costumes and masks...\"<br><br><strong>Giải thích:</strong> Bài đọc khẳng định có \"Vô số/Rất nhiều cửa hàng\" (Numerous shops) bán trang phục và mặt nạ, điều này mâu thuẫn trực tiếp với từ \"few places\" (rất ít nơi) trong câu hỏi. Đáp án là FALSE."
                    },
                    {
                        id: 6,
                        text: "<strong>[6]</strong> In order to take part in the costume competition you need to be Italian.",
                        type: "text",
                        correct: "NOT GIVEN",
                        explanation: "<strong>Từ khóa:</strong> take part in costume competition, need to be Italian.<br><br><strong>Trong bài (Đoạn 3):</strong> \"Costumes are also a major feature of the occasion and there is even a competition to judge the best one.\"<br><br><strong>Giải thích:</strong> Bài đọc có nhắc đến cuộc thi trang phục (costume competition) nhưng không hề đề cập đến điều kiện quốc tịch của người tham gia (có cần là người Ý hay không). Vì vậy, đáp án là NOT GIVEN."
                    },
                    {
                        id: 7,
                        text: "<strong>[7]</strong> The tickets for the Valentine’s Grand Masquerade Ball are worth a lot of money.",
                        type: "text",
                        correct: "TRUE",
                        explanation: "<strong>Từ khóa:</strong> tickets, Valentine’s Grand Masquerade Ball, worth a lot of money.<br><br><strong>Trong bài (Đoạn 4):</strong> \"One of the most expensive parties is the Valentine’s Grand Masquerade Ball...\"<br><br><strong>Giải thích:</strong> Bài đọc xác nhận dạ vũ Valentine là \"Một trong những bữa tiệc đắt đỏ nhất\" (One of the most expensive parties), đồng nghĩa với việc vé rất đắt (worth a lot of money). Thông tin khớp hoàn toàn nên đáp án là TRUE."
                    }
                ]
            }
        ];

        const state = {
            answers: {},
            isSubmitted: false,
            score: 0,
            incorrectIds: [],
            startTime: Date.now(),
            endTime: null,
            submitTime: null,
            currentPartIndex: 0,
            showPassageTranslation: false,
            expandedExplanations: {},
            expandedNotes: {},
            showResetConfirm: false,
            hasCapturedScreenshot: false,
            showCompletedModal: false,
            notes: {},
            formattedPassage: null,
            formattedPassageTrans: null,
            formattedQuestions: {}
        };

        const totalQuestions = quizData.reduce((acc, curr) => acc + curr.questions.length, 0);
        const allQuestions = quizData.flatMap(s => s.questions);

        // Chuẩn hoá đáp án
        window.normalizeAnswer = (ans) => {
            if (!ans) return "";
            return ans.toString().toUpperCase().trim();
        };

        // Lưu lại format HTML trước khi re-render
        window.saveFormatting = () => {
            const passageEl = document.getElementById('passage-content');
            if (passageEl) {
                if (state.showPassageTranslation) {
                    state.formattedPassageTrans = passageEl.innerHTML;
                } else {
                    state.formattedPassage = passageEl.innerHTML;
                }
            }
            allQuestions.forEach(q => {
                const qEl = document.getElementById(`q-text-${q.id}`);
                if (qEl) {
                    state.formattedQuestions[q.id] = qEl.innerHTML;
                }
            });
        };

        // Hàm thực thi format (được gọi từ toolbar)
        window.formatText = (command, value = null) => {
            const targets = document.querySelectorAll('.format-target');
            targets.forEach(t => t.setAttribute('contenteditable', 'true'));

            document.execCommand(command, false, value);

            targets.forEach(t => t.setAttribute('contenteditable', 'false'));
            saveFormatting();
        };

        window.handleNoteChange = (qId, val) => {
            state.notes[qId] = val;
        };

        window.generateInputHtml = (q, isAnswered, isCorrect, userAnswer) => {
            // Thay đổi width lớn hơn một chút để chứa vừa chữ "NOT GIVEN"
            let inputClass = `inline-block w-[115px] md:w-[130px] px-1 py-1 mx-1 border-2 rounded-md focus:outline-none focus:ring-2 transition-all font-bold text-slate-800 cursor-pointer text-[12px] md:text-[13px] shadow-sm `;
            let feedbackIcon = '';

            const showFeedback = state.isSubmitted && state.hasCapturedScreenshot;

            if (!state.isSubmitted) {
                inputClass += isAnswered ? 'border-indigo-500 bg-indigo-50 text-indigo-700 focus:ring-indigo-200' : 'border-slate-300 bg-white focus:border-indigo-500 focus:ring-indigo-200';
            } else if (!showFeedback) {
                inputClass += 'border-slate-300 bg-slate-100 text-slate-500 cursor-not-allowed';
            } else {
                if (isCorrect) {
                    inputClass += 'border-green-500 bg-green-50 text-green-700';
                    feedbackIcon = `<i class="fa-solid fa-circle-check text-green-500 text-lg absolute -right-6 top-1/2 mt-0.5 -translate-y-1/2"></i>`;
                } else {
                    inputClass += 'border-red-500 bg-red-50 text-red-700';
                    feedbackIcon = `<i class="fa-solid fa-circle-xmark text-red-500 text-lg absolute -right-6 top-1/2 mt-0.5 -translate-y-1/2"></i>`;
                }
            }

            let normalizedUserAns = userAnswer.trim().toUpperCase();

            // Tùy chọn T/F/NG
            const options = [
                { value: "", label: "-- Chọn --" },
                { value: "TRUE", label: "TRUE" },
                { value: "FALSE", label: "FALSE" },
                { value: "NOT GIVEN", label: "NOT GIVEN" }
            ];

            const optionsHtml = options.map(opt =>
                `<option value="${opt.value}" ${normalizedUserAns === opt.value ? 'selected' : ''}>${opt.label}</option>`
            ).join('');

            return `
                <span class="font-bold text-indigo-700 mr-1 hidden">[${q.id}]</span>
                <select 
                    class="${inputClass}" 
                    style="text-align-last: center;"
                    ${state.isSubmitted ? 'disabled' : ''}
                    onchange="handleInputChange(${q.id}, this.value)"
                >
                    ${optionsHtml}
                </select>
                ${feedbackIcon}
            `;
        };

        window.restoreInputs = () => {
            allQuestions.forEach(q => {
                const wrapper = document.getElementById(`input-wrap-${q.id}`);
                if (wrapper) {
                    const userAnswer = state.answers[q.id] || '';
                    const isAnswered = userAnswer.trim() !== '';
                    const isCorrect = state.isSubmitted && window.normalizeAnswer(userAnswer) === window.normalizeAnswer(q.correct);
                    wrapper.innerHTML = window.generateInputHtml(q, isAnswered, isCorrect, userAnswer);
                }
            });
        };

        function renderApp() {
            const app = document.getElementById('app');
            const answeredCount = Object.keys(state.answers).filter(k => state.answers[k].toString().trim() !== '').length;
            const currentSection = quizData[state.currentPartIndex];

            const qContainer = document.getElementById('questions-container');
            const scrollPos = qContainer ? qContainer.scrollTop : 0;

            let timeStr = "";
            let dateStr = "";
            if (state.isSubmitted && state.submitTime) {
                const totalSeconds = Math.floor((state.endTime - state.startTime) / 1000);
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                timeStr = `${minutes} phút ${seconds} giây`;

                const d = state.submitTime;
                const hours = String(d.getHours()).padStart(2, '0');
                const mins = String(d.getMinutes()).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const year = d.getFullYear();
                dateStr = `${hours}:${mins} - ${day}/${month}/${year}`;
            }

            let passageHtml = state.showPassageTranslation
                ? (state.formattedPassageTrans || currentSection.passageTranslation)
                : (state.formattedPassage || currentSection.passage);

            let html = `
                <!-- Header -->
                <div id="main-header" class="flex-none bg-white border-b border-slate-200 shadow-sm px-4 py-3 flex justify-between items-center z-30">
                    <div>
                        <h1 class="text-xl font-bold text-indigo-700 flex items-center gap-2">
                            <i class="fa-brands fa-discourse text-indigo-600"></i>
                            IELTS READING PRACTICE
                        </h1>
                        <p class="text-sm text-slate-500">Mô phỏng đề thi IELTS Reading</p>
                    </div>
                    ${!state.isSubmitted ? `
                    <div id="progress-text-container" class="text-sm font-medium bg-indigo-50 text-indigo-800 px-3 py-1 rounded-full border border-indigo-200 hidden md:block">
                        <span id="progress-text">Đã làm: ${answeredCount} / ${totalQuestions}</span>
                    </div>
                    ` : `
                    <div class="text-sm font-bold bg-green-100 text-green-800 px-4 py-2 rounded-full border border-green-300 flex items-center gap-2">
                        <i class="fa-solid fa-award"></i> Điểm: ${state.score} / ${totalQuestions}
                    </div>
                    `}
                </div>

                <!-- Main Body -->
                <div class="flex-1 flex flex-col min-h-0 w-full max-w-[1600px] mx-auto px-2 md:px-6 py-1.5 md:py-2 gap-2">
                    
                    ${state.isSubmitted && state.hasCapturedScreenshot ? `
                    <div class="flex-none bg-white p-5 md:p-6 rounded-xl border border-green-200 shadow-sm animate-in fade-in duration-500 mb-2">
                        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-6">
                            <div class="flex items-center gap-4">
                                <i class="fa-solid fa-circle-check text-green-500 text-4xl md:text-5xl"></i>
                                <div>
                                    <h2 class="text-xl md:text-2xl font-bold text-slate-800">Hoàn thành bài thi!</h2>
                                    <p class="text-slate-600 mt-1">Tuyệt vời, bạn đã hoàn thành bài tập. Hãy xem kết quả chi tiết bên dưới.</p>
                                </div>
                            </div>
                            <button onclick="resetQuiz()" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition shadow font-medium whitespace-nowrap">
                                <i class="fa-solid fa-rotate-right mr-2"></i>Làm lại bài thi
                            </button>
                        </div>
                        
                        <div class="bg-slate-50 border border-slate-200 rounded-lg overflow-hidden">
                            <div class="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-slate-200">
                                <div class="p-4 flex justify-between items-center">
                                    <span class="text-slate-600 font-medium"><i class="fa-regular fa-clock text-indigo-500 mr-2"></i>Giờ, ngày nộp:</span>
                                    <span class="font-bold text-slate-800">${dateStr}</span>
                                </div>
                                <div class="p-4 flex justify-between items-center">
                                    <span class="text-slate-600 font-medium"><i class="fa-solid fa-stopwatch text-indigo-500 mr-2"></i>Tổng thời gian làm:</span>
                                    <span class="font-bold text-slate-800">${timeStr}</span>
                                </div>
                                <div class="p-4 flex justify-between items-center bg-green-50/50">
                                    <span class="text-green-700 font-medium"><i class="fa-solid fa-check text-green-600 mr-2"></i>Số câu đúng:</span>
                                    <span class="font-bold text-green-700 text-lg">${state.score} / ${totalQuestions}</span>
                                </div>
                                <div class="p-4 flex justify-between items-center ${state.incorrectIds.length > 0 ? 'bg-red-50/50' : 'bg-slate-50'}">
                                    <span class="${state.incorrectIds.length > 0 ? 'text-red-700' : 'text-slate-600'} font-medium"><i class="fa-solid fa-xmark text-red-500 mr-2"></i>Số câu sai/chưa làm:</span>
                                    <span class="font-bold ${state.incorrectIds.length > 0 ? 'text-red-700' : 'text-slate-800'} text-lg">${state.incorrectIds.length} / ${totalQuestions}</span>
                                </div>
                            </div>
                            ${state.incorrectIds.length > 0 ? `
                            <div class="p-4 border-t border-slate-200 bg-white">
                                <span class="text-slate-600 font-medium block mb-3"><i class="fa-solid fa-circle-exclamation text-amber-500 mr-2"></i>Các câu sai hoặc chưa trả lời:</span>
                                <div class="flex flex-wrap gap-2">
                                    ${state.incorrectIds.map(id => `<button onclick="scrollToQuestion(${id})" class="px-4 py-1.5 bg-red-50 text-red-700 font-bold rounded-md border border-red-200 hover:bg-red-100 transition shadow-sm">Câu ${id}</button>`).join('')}
                                </div>
                            </div>
                            ` : `

                        ${questionTextHtml}
                        ${errorHtml}
                        ${explanationHtml}
                        ${notesHtml}
                    </div>
                </div>
            `;
        }

        window.updateProgress = () => {
            const answeredCount = Object.keys(state.answers).filter(k => state.answers[k].toString().trim() !== '').length;

            const progressText = document.getElementById('progress-text');
            if (progressText) progressText.innerText = `Đã làm: ${answeredCount} / ${totalQuestions}`;

            const submitBtnMain = document.getElementById('submit-btn-main');
            const submitBtnNav = document.getElementById('submit-btn-nav');

            if (answeredCount > 0) {
                if (submitBtnMain) {
                    submitBtnMain.disabled = false;
                    submitBtnMain.className = "px-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition-all flex items-center gap-2 text-lg";
                }
                if (submitBtnNav) {
                    submitBtnNav.disabled = false;
                    submitBtnNav.className = "px-4 py-1 bg-indigo-600 hover:bg-indigo-700 text-white text-xs md:text-sm font-bold rounded shadow transition-colors";
                }
            } else {
                if (submitBtnMain) {
                    submitBtnMain.disabled = true;
                    submitBtnMain.className = "opacity-50 px-8 py-3.5 bg-indigo-600 text-white font-bold rounded-xl shadow-lg flex items-center gap-2 text-lg cursor-not-allowed";
                }
                if (submitBtnNav) {
                    submitBtnNav.disabled = true;
                    submitBtnNav.className = "opacity-50 px-4 py-1 bg-indigo-600 text-white text-xs md:text-sm font-bold rounded shadow cursor-not-allowed";
                }
            }

            allQuestions.forEach(q => {
                const btn = document.getElementById(`nav-btn-${q.id}`);
                const isAnswered = state.answers[q.id] && state.answers[q.id].toString().trim() !== '';

                if (btn && !state.isSubmitted) {
                    btn.className = isAnswered
                        ? "shrink-0 w-7 h-7 md:w-8 md:h-8 rounded text-xs md:text-sm font-bold flex items-center justify-center transition-all border cursor-pointer bg-indigo-600 text-white border-indigo-600 shadow-sm"
                        : "shrink-0 w-7 h-7 md:w-8 md:h-8 rounded text-xs md:text-sm font-bold flex items-center justify-center transition-all border cursor-pointer bg-slate-50 text-slate-600 border-slate-300 hover:bg-slate-200";
                }

                const wrapper = document.getElementById(`input-wrap-${q.id}`);
                if (wrapper) {
                    const inputEl = wrapper.querySelector('select');
                    if (inputEl && !state.isSubmitted) {
                        if (isAnswered) {
                            inputEl.className = "inline-block w-[115px] md:w-[130px] px-1 py-1 mx-1 border-2 rounded-md focus:outline-none focus:ring-2 transition-all font-bold text-slate-800 cursor-pointer text-[12px] md:text-[13px] shadow-sm border-indigo-500 bg-indigo-50 text-indigo-700 focus:ring-indigo-200";
                        } else {
                            inputEl.className = "inline-block w-[115px] md:w-[130px] px-1 py-1 mx-1 border-2 rounded-md focus:outline-none focus:ring-2 transition-all font-bold text-slate-800 cursor-pointer text-[12px] md:text-[13px] shadow-sm border-slate-300 bg-white focus:border-indigo-500 focus:ring-indigo-200";
                        }
                    }
                }

                const container = document.getElementById(`question-${q.id}`);
                if (container && !state.isSubmitted) {
                    container.className = `p-4 md:p-5 rounded-xl border transition-all ${isAnswered ? 'bg-slate-50 border-indigo-200' : 'bg-white border-slate-200 hover:border-slate-300'}`;
                }
            });
        };

        window.handleInputChange = (qId, val) => {
            if (state.isSubmitted) return;
            state.answers[qId] = val;
            updateProgress();
        };

        window.calculateScore = () => {
            saveFormatting();
            let currentScore = 0;
            let incorrectIds = [];
            quizData.forEach(section => {
                section.questions.forEach(q => {
                    const userAnswer = state.answers[q.id] || "";
                    const userNorm = window.normalizeAnswer(userAnswer);
                    const correctNorm = window.normalizeAnswer(q.correct);

                    if (userNorm === correctNorm) {
                        currentScore += 1;
                    } else {
                        incorrectIds.push(q.id);
                    }
                });
            });
            state.score = currentScore;
            state.incorrectIds = incorrectIds;
            state.endTime = Date.now();
            state.submitTime = new Date();
            state.isSubmitted = true;
            state.showCompletedModal = true;
            renderApp();
        };

        window.captureAndReveal = () => {
            const captureArea = document.getElementById('capture-area');
            const btn = document.getElementById('capture-btn');
            const btnText = document.getElementById('capture-btn-text');

            if (!captureArea || !btn) return;

            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            const originalText = btnText.innerText;
            btnText.innerText = 'Đang xử lý...';

            setTimeout(() => {
                html2canvas(captureArea, {
                    scale: 3,
                    backgroundColor: '#ffffff',
                    useCORS: true,
                    logging: false,
                    onclone: function (clonedDoc) {
                        const clonedBtnText = clonedDoc.getElementById('capture-btn-text');
                        const clonedBtn = clonedDoc.getElementById('capture-btn');
                        if (clonedBtnText) clonedBtnText.innerText = originalText;
                        if (clonedBtn) {
                            clonedBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                            clonedBtn.style.opacity = '1';
                        }

                        const clonedArea = clonedDoc.getElementById('capture-area');
                        if (clonedArea) {
                            clonedArea.style.transform = 'none';
                            clonedArea.style.boxShadow = 'none';
                            clonedArea.style.border = 'none';
                        }

                        const clonedTitleBox = clonedDoc.getElementById('title-box');
                        if (clonedTitleBox) {
                            clonedTitleBox.style.border = 'none';
                            clonedTitleBox.style.background = 'transparent';
                            clonedTitleBox.style.boxShadow = 'none';
                            clonedTitleBox.style.padding = '0';
                        }

                        const clonedStatsBox = clonedDoc.getElementById('stats-box');
                        if (clonedStatsBox) {
                            clonedStatsBox.style.border = 'none';
                            clonedStatsBox.style.background = 'transparent';
                            clonedStatsBox.style.boxShadow = 'none';
                        }

                        const clonedWrongBox = clonedDoc.getElementById('wrong-answers-box');
                        if (clonedWrongBox) {
                            clonedWrongBox.style.border = 'none';
                            clonedWrongBox.style.background = 'transparent';
                            clonedWrongBox.style.boxShadow = 'none';
                        }

                        const valueBoxes = clonedDoc.querySelectorAll('.value-box, .wrong-q-box');
                        valueBoxes.forEach(box => {
                            box.style.border = 'none';
                            box.style.background = 'transparent';
                            box.style.boxShadow = 'none';
                            box.style.padding = '0';
                            box.style.margin = '0';

                            if (box.classList.contains('wrong-q-box')) {
                                box.style.marginRight = '10px';
                                box.style.color = '#dc2626';
                            } else {
                                box.style.color = '#1e293b';
                            }
                        });
                    }
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `Ket_qua_IELTS_Reading_${new Date().getTime()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    state.hasCapturedScreenshot = true;
                    state.showCompletedModal = false;
                    renderApp();

                }).catch(err => {
                    console.error("Lỗi khi chụp ảnh:", err);
                    alert("Có lỗi xảy ra khi lưu ảnh. Bạn có thể xem đáp án ngay.");
                    state.hasCapturedScreenshot = true;
                    state.showCompletedModal = false;
                    renderApp();
                });
            }, 50);
        };

        window.resetQuiz = () => {
            state.showResetConfirm = true;
            renderApp();
        };

        window.cancelReset = () => {
            state.showResetConfirm = false;
            renderApp();
        };

        window.confirmReset = () => {
            state.answers = {};
            state.isSubmitted = false;
            state.score = 0;
            state.incorrectIds = [];
            state.startTime = Date.now();
            state.endTime = null;
            state.submitTime = null;
            state.expandedExplanations = {};
            state.showResetConfirm = false;
            state.hasCapturedScreenshot = false;
            state.showCompletedModal = false;
            state.notes = {};
            state.formattedPassage = null;
            state.formattedPassageTrans = null;
            state.formattedQuestions = {};

            renderApp();
        };

        window.togglePassageTranslation = () => {
            saveFormatting();
            state.showPassageTranslation = !state.showPassageTranslation;
            renderApp();
        };

        window.toggleExplanation = (qId) => {
            saveFormatting();
            state.expandedExplanations[qId] = !state.expandedExplanations[qId];
            renderApp();
        };

        window.toggleNote = (qId) => {
            saveFormatting();
            state.expandedNotes[qId] = !state.expandedNotes[qId];
            renderApp();
        };

        window.performScroll = (id) => {
            const container = document.getElementById('questions-container');
            const el = document.getElementById(`question-${id}`);

            if (container && el) {
                const containerTop = container.getBoundingClientRect().top;
                const elTop = el.getBoundingClientRect().top;
                const currentScroll = container.scrollTop;
                const targetScroll = currentScroll + (elTop - containerTop) - 20;

                container.scrollTo({ top: targetScroll, behavior: "smooth" });

                const wrapper = document.getElementById(`input-wrap-${id}`);
                if (wrapper) {
                    const inputEl = wrapper.querySelector('select');
                    if (inputEl) {
                        inputEl.focus();
                        inputEl.classList.add('bg-indigo-100', 'border-indigo-500');
                        setTimeout(() => inputEl.classList.remove('bg-indigo-100', 'border-indigo-500'), 1000);
                    }
                }
            }
        };

        window.scrollToQuestion = (id) => {
            performScroll(id);
        };

        // Start App
        renderApp();

    </script>
</body>

</html>
